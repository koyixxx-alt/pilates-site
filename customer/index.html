<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f3f1">
<title>マイページ — Pilates</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f3f1;--paper:#ffffff;--ink:#4f3d3a;--ink2:#6e5955;--sub:#a08a85;--faint:#cdbcb7;
    --line:#eee2de;--line2:#f5edea;--accent:#e8a3a0;--accent-h:#df9692;--accent-d:#bf716d;--accent-soft:#fbeeec;
    --pill:#f4ebe8;--tile:#fcf7f6;--up:#6b9a83;--down:#bf716d;--danger:#c0574f;
    --shadow:0 1px 2px rgba(120,80,70,.04),0 10px 28px -18px rgba(150,90,80,.24);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font:inherit;font-size:16px;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)}
  .hidden{display:none!important}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}

  /* ログイン */
  .cover{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .cover-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:40px 28px 32px}
  .cover-card .logo{font-size:26px;font-weight:700;letter-spacing:.06em;text-align:center}
  .cover-card .cap{font-size:10px;letter-spacing:.3em;color:var(--sub);text-align:center;margin:8px 0 24px}
  .seg{display:flex;background:var(--tile);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin-bottom:22px}
  .seg button{flex:1;font-size:14px;color:var(--ink2);padding:9px 0;border-radius:999px;transition:background .15s,color .15s}
  .seg button.on{background:var(--accent);color:#fff;font-weight:700}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;letter-spacing:.06em}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .btn-block{width:100%;padding:13px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;letter-spacing:.06em;transition:background .15s}
  .btn-block:hover{background:var(--accent-h)}
  .btn-block:disabled{opacity:.6;cursor:default}
  .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;text-align:center}
  .ok{color:var(--up);font-size:13px;margin-top:12px;text-align:center}
  .hint{font-size:12px;color:var(--sub);margin-top:16px;line-height:1.8;text-align:center}

  /* 本体 */
  #app{display:none}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 18px}
  .top .logo{font-size:20px;font-weight:700;letter-spacing:.06em}
  .top .d{font-size:12px;color:var(--sub)}
  .hello{font-size:12px;color:var(--sub);padding:0 4px;margin-bottom:6px}
  .hello b{display:block;font-size:21px;color:var(--ink);margin-top:2px;letter-spacing:.04em}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px;margin-top:14px}
  .card .k{font-size:11px;color:var(--sub);letter-spacing:.14em}
  .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .ch h2{font-size:15px;font-weight:700;letter-spacing:.06em}
  .ch h2 span{font-weight:400;font-size:12px;color:var(--sub);margin-left:8px}
  .banner{background:var(--accent-soft);color:var(--accent-d);border-radius:14px;padding:12px 16px;font-size:13px;margin-top:14px;line-height:1.8}
  .next{display:flex;align-items:center;gap:16px;margin-top:8px}
  .next .day{font-size:40px;font-weight:700;line-height:1;min-width:52px;text-align:center}
  .next .meta{font-size:14px;color:var(--ink2);line-height:1.7}
  .more{font-size:12px;color:var(--sub);margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
  .stamps{display:flex;gap:10px;margin:12px 0 10px;flex-wrap:wrap}
  .stamps i{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--faint);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--faint)}
  .stamps i.on{border:0;background:var(--accent);color:#fff;font-weight:700}
  .coupon{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
  .coupon b{font-size:20px;color:var(--accent-d)}
  .coupon span{font-size:12px;color:var(--accent-d)}
  .mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
  .mrow .l{font-size:11px;color:var(--sub)}
  .mrow .v{font-size:24px;font-weight:700;line-height:1.3}
  .mrow .v small{font-size:12px;color:var(--sub);margin-left:2px;font-weight:500}
  .mrow .d{font-size:11.5px;font-weight:700}
  .up{color:var(--up)}.dn{color:var(--down)}.muted{color:var(--sub)}
  .goal{font-size:15px;font-weight:500;margin-top:4px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pills button{padding:6px 13px;border-radius:999px;background:var(--pill);font-size:12.5px;color:var(--ink2)}
  .pills button.on{background:var(--accent);color:#fff;font-weight:700}
  canvas{display:block;width:100%}
  .rec{padding:14px 0;border-top:1px solid var(--line2)}
  .rec:first-child{border-top:0;padding-top:0}
  .rec .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .rec .dt{font-size:13px;font-weight:700}
  .rec .pl{font-size:12px;color:var(--sub)}
  .rec .vals{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:4px;color:var(--ink2)}
  .rec .nt{font-size:13px;color:var(--ink2);background:var(--tile);border-radius:10px;padding:9px 12px;margin-top:8px;line-height:1.8}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .tag.gray{background:var(--pill);color:var(--sub)}
  .list{list-style:none}
  .list li{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line2);font-size:14px}
  .list li:first-child{border-top:0;padding-top:0}
  .list li span:first-child{color:var(--sub);white-space:nowrap}
  .list li span:last-child{text-align:right;word-break:break-all}
  .btn{font-size:13px;font-weight:700;border-radius:999px;padding:10px 20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.wide{width:100%;padding:13px}
  .empty{text-align:center;color:var(--sub);padding:22px 10px;font-size:13.5px;line-height:1.9}
  .note{background:var(--tile);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.85}
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:532px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--paper);
    border:1px solid var(--line);border-radius:999px;display:flex;padding:5px;z-index:40;box-shadow:0 12px 30px -12px rgba(120,70,60,.35)}
  .tabbar button{flex:1;font-size:13.5px;padding:11px 0;border-radius:999px;color:var(--ink2)}
  .tabbar button.on{background:var(--accent);color:#fff;font-weight:700}

  /* 計測入力 */
  .modal-bg{position:fixed;inset:0;background:rgba(60,40,36,.3);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s ease both}
  .modal{background:var(--paper);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.22,.9,.3,1) both}
  @media(min-width:600px){.modal-bg{align-items:center;padding:20px}.modal{border-radius:22px}}
  .modal-h{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:center}
  .modal-h h3{font-size:17px;letter-spacing:.06em}
  .modal-h .x{font-size:22px;color:var(--sub);width:34px;height:34px;border-radius:50%}
  .modal-b{padding:8px 20px 16px;overflow-y:auto}
  .modal-f{padding:12px 20px calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line2)}
  .modal-f .btn{flex:1;padding:12px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form .full{grid-column:1/-1}
  .fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
  .fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
  .unit{position:relative}
  .unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none}
  .unit input{padding-right:36px}
  .toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;
    padding:12px 22px;border-radius:999px;font-size:13.5px;z-index:90;transition:transform .3s,opacity .3s;max-width:calc(100% - 32px);text-align:center}
  .toast.show{transform:translate(-50%,0);opacity:1}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .wrap>*{animation:up .3s cubic-bezier(.22,.9,.3,1) both}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:360px){.mrow .v{font-size:20px}.stamps i{width:34px;height:34px}}
</style>
</head>
<body>

<div id="boot" class="loading">読み込み中…</div>

<div id="config" class="cover hidden">
  <div class="cover-card"><div class="logo">初期設定</div><div class="cap">CONNECTION</div>
    <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>anon public key</label><input id="cfgKey" placeholder="eyJhbGci..."></div>
    <button class="btn-block" onclick="saveConfig()">保存して開始</button><div class="err" id="cfgErr"></div></div>
</div>

<div id="auth" class="cover hidden">
  <div class="cover-card">
    <div class="logo" id="authLogo">Pilates</div><div class="cap">MY PAGE</div>
    <div class="seg"><button id="tabLogin" class="on" onclick="authMode('login')">ログイン</button><button id="tabSignup" onclick="authMode('signup')">はじめての方</button></div>
    <div class="field"><label>メールアドレス</label><input id="auEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>パスワード</label><input id="auPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <button class="btn-block" id="auBtn" onclick="doAuth()">ログイン</button>
    <div class="err" id="auErr"></div><div class="ok" id="auOk"></div>
    <div class="hint" id="authHint">はじめての方は、<b>スタジオに登録したメールアドレス</b>で「はじめての方」から登録してください。</div>
  </div>
</div>

<div id="app">
  <div class="wrap" id="view"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(new URLSearchParams(location.search).has('demo'))document.write('<script src="demo.js"><\/script>');</script>
<script>
let SUPABASE_URL="https://jedhznwwspoeoztokqad.supabase.co";
let SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZGh6bnd3c3BvZW96dG9rcWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNjMzNTQsImV4cCI6MjA5ODYzOTM1NH0.41y_csW3FKEjXRlsXfBydA4TPXwbJBKrHUlOsQNgoFc";
const DEMO=!!window.demoClient;

let sb=null,meUser=null,me=null;
const store={measurements:[],sessions:[],reservations:null,coupon:null,studio:null};
let ui={view:'home',metric:'weight'};

function getConfig(){return {url:SUPABASE_URL||localStorage.getItem('sb_url')||'',key:SUPABASE_ANON_KEY||localStorage.getItem('sb_key')||''};}
function saveConfig(){const u=document.getElementById('cfgUrl').value.trim(),k=document.getElementById('cfgKey').value.trim();
  if(!u||!k){document.getElementById('cfgErr').textContent='両方入力してください';return;}
  localStorage.setItem('sb_url',u);localStorage.setItem('sb_key',k);location.reload();}

const pad=n=>String(n).padStart(2,'0');
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function today(){return ymd(new Date());}
function dowJp(s){return ['日','月','火','水','木','金','土'][new Date(s+'T00:00:00').getDay()];}
function fmtYmd(s){if(!s)return '—';const [y,m,d]=String(s).slice(0,10).split('-');return `${y}/${m}/${d}`;}
function fmtMd(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}月${d.getDate()}日（${dowJp(s)}）`;}
function yen(n){return '¥'+Math.round(n||0).toLocaleString('ja-JP');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function show(id){['boot','config','auth'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.getElementById('app').style.display=id==='app'?'block':'none';}
const METRICS=[['weight','体重','kg'],['body_fat','体脂肪率','%'],['waist','ウエスト','cm'],['hip','ヒップ','cm'],['thigh','太もも','cm'],['arm','二の腕','cm']];
const CATLABEL={training:'トレーニング',slimming:'痩身',bust:'バスト'};
function studioName(){return (store.studio&&store.studio.studio_name)||localStorage.getItem('studio_name_c')||'Pilates';}

/* ---------- 起動・ログイン ---------- */
async function boot(){
  document.getElementById('authLogo').textContent=localStorage.getItem('studio_name_c')||'Pilates';
  if(DEMO){sb=window.demoClient;await onAuthed();return;}
  const {url,key}=getConfig();if(!url||!key){show('config');return;}
  try{sb=supabase.createClient(url,key);}catch(e){show('config');return;}
  const {data}=await sb.auth.getSession();
  if(data.session)await onAuthed();else show('auth');
  sb.auth.onAuthStateChange((_e,s)=>{if(!s)show('auth');});
}
let _mode='login';
function authMode(m){_mode=m;document.getElementById('tabLogin').classList.toggle('on',m==='login');document.getElementById('tabSignup').classList.toggle('on',m==='signup');
  document.getElementById('auBtn').textContent=m==='login'?'ログイン':'登録する';
  document.getElementById('auPass').autocomplete=m==='login'?'current-password':'new-password';
  document.getElementById('auErr').textContent='';document.getElementById('auOk').textContent='';}
async function doAuth(){
  const email=document.getElementById('auEmail').value.trim(),pass=document.getElementById('auPass').value;
  const errEl=document.getElementById('auErr'),okEl=document.getElementById('auOk'),btn=document.getElementById('auBtn');
  errEl.textContent='';okEl.textContent='';if(!email||!pass){errEl.textContent='メールとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='処理中…';
  try{
    if(_mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
      if(!data.session){authMode('login');okEl.textContent='確認メールを送りました。メールのリンクを開いてから、ログインしてください。';}
      else await onAuthed();
    }else{const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;await onAuthed();}
  }catch(e){errEl.textContent=translateAuthErr(e.message);}
  finally{btn.disabled=false;btn.textContent=_mode==='login'?'ログイン':'登録する';}
}
function translateAuthErr(m){
  if(/Invalid login/i.test(m))return 'メールアドレスまたはパスワードが違います';
  if(/already registered/i.test(m))return 'このメールアドレスは登録済みです。「ログイン」からお進みください';
  if(/at least 6/i.test(m))return 'パスワードは6文字以上にしてください';
  if(/Email not confirmed/i.test(m))return 'メールの確認がまだです。届いたメールのリンクを開いてください';
  if(/fetch/i.test(m))return '接続できませんでした。通信状態を確認してください';
  return m;
}
async function onAuthed(){
  const {data:{user}}=await sb.auth.getUser();meUser=user;
  const [{data:rows},st]=await Promise.all([sb.from('customers').select('*'),sb.from('studio_settings').select('*').eq('id',1).maybeSingle()]);
  me=(rows&&rows[0])||null;store.studio=st&&!st.error?st.data:null;
  if(store.studio&&store.studio.studio_name){try{localStorage.setItem('studio_name_c',store.studio.studio_name);}catch(e){}}
  document.title='マイページ — '+studioName();
  show('app');
  if(!me){renderNotLinked();return;}
  await loadMine();render();
}
async function signOut(){if(DEMO){location.href=location.pathname;return;}await sb.auth.signOut();show('auth');document.getElementById('auPass').value='';}
function renderNotLinked(){
  document.getElementById('tabbar').innerHTML='';
  document.getElementById('view').innerHTML=`<div class="top"><div class="logo">${esc(studioName())}</div></div>
    <div class="card"><div class="ch"><h2>お客様情報が見つかりません</h2></div>
    <div class="note"><b>${esc(meUser.email)}</b> に対応するお客様情報が見つかりませんでした。<br>スタジオに登録したメールアドレスと<b>同じメールアドレス</b>でログインしているか、ご確認ください。わからない場合は、担当トレーナーにお声がけください。</div>
    <button class="btn wide" style="margin-top:16px" onclick="signOut()">別のメールアドレスでログインし直す</button></div>`;
}

/* ---------- データ ---------- */
async function loadMine(){
  const [m,s,r,c]=await Promise.all([
    sb.from('measurements').select('*').eq('customer_id',me.id).order('date',{ascending:true}),
    sb.from('sessions').select('*').eq('customer_id',me.id).order('date',{ascending:false}),
    sb.rpc('my_reservations'),sb.rpc('my_coupon_status')]);
  store.measurements=m.data||[];store.sessions=s.data||[];
  store.reservations=r&&!r.error?(r.data||[]):null;
  store.coupon=c&&!c.error&&c.data?c.data:null;
}
function measures(){return [...store.measurements].sort((a,b)=>a.date.localeCompare(b.date));}

/* ---------- 画面 ---------- */
const TABS=[['home','ホーム'],['record','記録'],['mypage','マイページ']];
function go(v){ui.view=v;render();window.scrollTo(0,0);}
function render(){
  document.getElementById('tabbar').innerHTML=TABS.map(([k,l])=>`<button class="${ui.view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const v=document.getElementById('view');
  v.innerHTML=(ui.view==='record'?viewRecord:ui.view==='mypage'?viewMypage:viewHome)();
  if(ui.view==='record')drawChart(ui.metric);
}
function topBar(){return `<div class="top"><div class="logo">${esc(studioName())}</div><div class="d">${fmtMd(today())}</div></div>`;}
function viewHome(){
  const ms=measures(),last=ms[ms.length-1],prev=ms[ms.length-2];
  const rv=store.reservations,next=rv&&rv[0];
  const c=store.coupon;
  let stampHtml='';
  if(c){const every=Math.max(1,+c.every||3),qty=+c.qty||0,stamps=qty%every,avail=Math.max(0,Math.floor(qty/every)-(+c.used||0));
    stampHtml=`<div class="card"><div class="k">プロテイン スタンプ</div>
      <div class="stamps">${Array.from({length:every},(_,i)=>`<i class="${i<stamps?'on':''}">${i+1}</i>`).join('')}</div>
      <div style="font-size:13px;color:var(--ink2)">あと <b>${every-stamps}個</b> で ${yen(c.amount)} の割引券</div>
      ${avail?`<div class="coupon"><span>使える割引券</span><b>${yen(c.amount)}${avail>1?` × ${avail}枚`:''}</b></div><div class="muted" style="font-size:12px;margin-top:8px">次回のお会計でスタッフにお伝えください。</div>`:''}</div>`;}
  const diff=k=>last&&prev&&last[k]!=null&&prev[k]!=null?(+last[k]-(+prev[k])):null;
  return `${topBar()}
  <div class="hello">${me.withdrawn_at?'':'こんにちは'}<b>${esc(me.name)} さま</b></div>
  ${me.withdrawn_at?`<div class="banner">${fmtYmd(me.withdrawn_at)} に退会されています。これまでの記録はご覧いただけます。</div>`:''}
  ${rv?`<div class="card"><div class="k">次回のご予約</div>
    ${next?`<div class="next"><div class="day">${+next.date.slice(8,10)}</div><div class="meta">${fmtMd(next.date)} ${esc(next.time||'')}<br>${CATLABEL[next.category]||'レッスン'}${next.duration?`・${next.duration}分`:''}</div></div>
      ${rv.length>1?`<div class="more">その後のご予約：${rv.slice(1,4).map(r=>`${+r.date.slice(5,7)}/${+r.date.slice(8,10)} ${esc(r.time||'')}`).join('、')}${rv.length>4?' ほか':''}</div>`:''}`
      :'<div class="muted" style="font-size:13px;margin-top:6px">次回のご予約はまだありません</div>'}</div>`:''}
  ${stampHtml}
  <div class="card"><div class="k">${last?`前回の計測　${fmtYmd(last.date)}`:'計測'}</div>
    ${last?`<div class="mrow">${['weight','body_fat','waist'].map(k=>{const meta=METRICS.find(m=>m[0]===k),d=diff(k);
      return `<div><div class="l">${meta[1]}</div><div class="v">${last[k]!=null?last[k]:'—'}<small>${last[k]!=null?meta[2]:''}</small></div>
        <div class="d ${d==null?'muted':d<=0?'up':'dn'}">${d==null?'　':`${d<0?'▼':d>0?'▲':'±'} ${Math.abs(d).toFixed(1)}${meta[2]}`}</div></div>`;}).join('')}</div>
      <button class="btn wide" style="margin-top:14px" onclick="go('record')">推移を見る</button>`
      :'<div class="muted" style="font-size:13px;margin-top:6px">まだ計測の記録がありません</div>'}</div>
  ${me.goal?`<div class="card"><div class="k">目標</div><div class="goal">${esc(me.goal)}</div></div>`:''}`;
}
function viewRecord(){
  const ms=measures(),ss=store.sessions;
  const rows=[];const used=new Set();
  ss.forEach(s=>{const m=ms.find(x=>x.date===s.date&&!used.has(x.id));if(m)used.add(m.id);rows.push({date:s.date,s,m});});
  ms.filter(m=>!used.has(m.id)).forEach(m=>rows.push({date:m.date,s:null,m}));
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  return `${topBar()}
  <div class="card"><div class="ch"><h2>推移グラフ</h2></div>
    <div class="pills">${METRICS.map(m=>`<button class="${ui.metric===m[0]?'on':''}" onclick="ui.metric='${m[0]}';render()">${m[1]}</button>`).join('')}</div>
    <canvas id="chart" height="230"></canvas></div>
  <div class="card"><div class="ch"><h2>これまでの記録<span>${rows.length}件</span></h2></div>
    ${rows.length?rows.slice(0,60).map(({date,s,m})=>`<div class="rec"><div class="h"><span class="dt">${fmtYmd(date)}（${dowJp(date)}）</span>
        <span>${s?`<span class="tag">${CATLABEL[s.category]||'レッスン'}</span>`:'<span class="tag gray">計測</span>'}</span></div>
      ${s&&s.menu?`<div class="pl">${esc(s.menu)}${s.duration?`・${s.duration}分`:''}</div>`:''}
      ${m?`<div class="vals">${METRICS.filter(([k])=>m[k]!=null).map(([k,l,u])=>`<span>${l} <b>${m[k]}</b>${u}</span>`).join('')}</div>`:''}
      ${s&&s.note?`<div class="nt">${esc(s.note)}</div>`:''}</div>`).join('')
      :'<div class="empty">まだ記録がありません</div>'}</div>
  ${me.withdrawn_at?'':`<button class="btn primary wide" style="margin-top:16px" onclick="openMeasureForm()">自分で計測を記録する</button>`}`;
}

/* ---------- グラフ ---------- */
function drawChart(metric){
  const cv=document.getElementById('chart');if(!cv)return;
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||340,H=230;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const x=cv.getContext('2d');x.scale(dpr,dpr);
  const F='"Zen Kaku Gothic New",sans-serif',meta=METRICS.find(m=>m[0]===metric);
  const d=measures().filter(m=>m[metric]!=null).map(m=>({x:m.date,y:+m[metric]}));
  const P={l:38,r:12,t:24,b:28},cw=W-P.l-P.r,ch=H-P.t-P.b;
  x.font=`12px ${F}`;x.fillStyle='#a08a85';
  if(!d.length){x.textAlign='center';x.fillText('まだ記録がありません',W/2,H/2);return;}
  const ys=d.map(v=>v.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const pd=(mx-mn)*.18;mn-=pd;mx+=pd;
  const X=i=>d.length===1?P.l+cw/2:P.l+cw*i/(d.length-1),Y=v=>P.t+ch*(1-(v-mn)/(mx-mn));
  x.textAlign='left';x.fillText(`${meta[1]}（${meta[2]}）`,0,12);x.font=`10.5px ${F}`;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,yy=Y(v);x.strokeStyle='#f5edea';x.beginPath();x.moveTo(P.l,yy);x.lineTo(W-P.r,yy);x.stroke();x.textAlign='right';x.fillStyle='#a08a85';x.fillText(v.toFixed(1),P.l-5,yy+4);}
  const gr=x.createLinearGradient(0,P.t,0,P.t+ch);gr.addColorStop(0,'rgba(232,163,160,.28)');gr.addColorStop(1,'rgba(232,163,160,0)');
  x.beginPath();x.moveTo(X(0),Y(d[0].y));d.forEach((v,i)=>x.lineTo(X(i),Y(v.y)));x.lineTo(X(d.length-1),P.t+ch);x.lineTo(X(0),P.t+ch);x.closePath();x.fillStyle=gr;x.fill();
  x.beginPath();x.strokeStyle='#d98e8a';x.lineWidth=2.2;x.lineJoin='round';d.forEach((v,i)=>i?x.lineTo(X(i),Y(v.y)):x.moveTo(X(i),Y(v.y)));x.stroke();
  const every=Math.ceil(d.length/(W<420?6:12));
  d.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v.y),3.2,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=2;x.strokeStyle='#d98e8a';x.stroke();
    if((i%every===0&&d.length-1-i>=every*.6)||i===d.length-1){x.textAlign='center';x.fillStyle='#4f3d3a';x.font=`700 10.5px ${F}`;x.fillText(v.y,X(i),Y(v.y)-9);
      x.fillStyle='#a08a85';x.font=`10px ${F}`;const dd=new Date(v.x+'T00:00:00');x.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,X(i),P.t+ch+16);}});
}

/* ---------- 自分で計測を記録 ---------- */
function modal(inner){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function openMeasureForm(){
  modal(`<div class="modal-h"><h3>計測を記録</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form"><div class="fld full"><label>計測日</label><input id="m_date" type="date" value="${today()}"></div>
      ${METRICS.map(([k,l,u])=>`<div class="fld"><label>${l}</label><div class="unit"><input id="m_${k}" type="number" step="0.1" inputmode="decimal"><span class="u">${u}</span></div></div>`).join('')}
      <div class="fld full"><label>メモ</label><input id="m_note" placeholder="体調・気づきなど"></div></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" id="mbtn" onclick="saveMeasure()">記録する</button></div>`);
}
async function saveMeasure(){
  const date=document.getElementById('m_date').value;if(!date){toast('計測日を入力してください');return;}
  const row={customer_id:me.id,date,note:document.getElementById('m_note').value.trim()||null};let any=false;
  METRICS.forEach(([k])=>{const v=document.getElementById('m_'+k).value;row[k]=v===''?null:parseFloat(v);if(v!=='')any=true;});
  if(!any){toast('どれか1つは入力してください');return;}
  const btn=document.getElementById('mbtn');btn.disabled=true;
  const {error}=await sb.from('measurements').insert(row);
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  await loadMine();closeModal();toast('記録しました');render();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(ui.view==='record')drawChart(ui.metric);},150);});
boot();
</script>
