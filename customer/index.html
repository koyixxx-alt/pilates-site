<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilates マイページ — お客様用</title>
<style>
  :root{
    --bg:#fbf1ed;--panel:#ffffff;--ink:#5a423c;--sub:#a98d84;--faint:#cbb4ac;--accent:#f47a68;--accent-d:#e05e4b;
    --line:#f3e2db;--soft:#fdf3ef;--danger:#c0392b;--chip:#fce7e1;--gold:#eda58f;
    --shadow:0 8px 24px rgba(200,120,100,.10);--radius:20px;
  }
  .ico{display:block}
  .logo{color:var(--accent)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:16px}
  .hidden{display:none!important}
  .cover{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:400px;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:38px 30px;text-align:center}
  .logo{font-size:34px}.brand{font-size:22px;font-weight:700;margin-top:6px}
  .brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:2px;margin-top:2px}
  .badge{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:20px;background:var(--chip);color:var(--accent-d);font-size:12px;font-weight:700}
  .role-tabs{display:flex;gap:8px;margin:24px 0 18px;background:var(--soft);padding:5px;border-radius:12px}
  .role-tabs button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:var(--sub)}
  .role-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .field{text-align:left;margin-bottom:14px}.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
  .field input:focus{outline:none;border-color:var(--accent);background:#fff}
  .btn-primary{width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:11px;font-weight:700;font-size:15px;margin-top:6px;transition:.15s}
  .btn-primary:hover{background:var(--accent-d)}.btn-primary:disabled{opacity:.6;cursor:default}
  .hint{font-size:12px;color:var(--sub);margin-top:16px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}.ok{color:var(--accent-d);font-size:13px;margin-top:10px;min-height:18px}
  /* shell */
  #app{display:none}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  .topbar .logo{font-size:20px}.topbar .title{font-weight:700;font-size:15px}
  .topbar .who{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}.topbar .who b{color:var(--ink);display:block}
  .logout{padding:7px 12px;border:1px solid var(--line);border-radius:9px;font-size:12px;font-weight:600;color:var(--sub)}
  .logout:hover{border-color:var(--danger);color:var(--danger)}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 90px}
  .greet{font-size:20px;font-weight:800;margin-bottom:2px}.greet-sub{color:var(--sub);font-size:13px;margin-bottom:20px}
  .goal-box{background:var(--panel);border-left:4px solid var(--accent);padding:14px 16px;border-radius:14px;margin-bottom:20px;box-shadow:var(--shadow)}
  .goal-box .l{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:3px}.goal-box .t{font-size:15px;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
  .stat{background:var(--panel);border-radius:var(--radius);padding:16px 14px;box-shadow:var(--shadow);text-align:center}
  .stat .k{font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap}.stat .v{font-size:24px;font-weight:800;margin-top:3px;white-space:nowrap}
  .stat .v small{font-size:12px;color:var(--sub)}.stat .d{font-size:11px;font-weight:700;margin-top:2px}
  .panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;margin-bottom:18px}
  .panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel h3 .count{font-size:12px;color:var(--sub);font-weight:600;background:var(--chip);padding:2px 9px;border-radius:20px;margin-left:auto}
  .metric-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .metric-pills button{padding:6px 12px;border-radius:20px;background:var(--chip);font-size:13px;font-weight:600;color:var(--sub)}
  .metric-pills button.on{background:var(--accent);color:#fff}
  .chart-wrap{width:100%;overflow-x:auto}canvas{display:block;max-width:100%}
  .btn{padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--accent);color:#fff;transition:.15s}
  .btn:hover{background:var(--accent-d)}.btn.ghost{background:var(--chip);color:var(--ink)}.btn.sm{padding:7px 13px;font-size:13px}
  .btn.block{width:100%}
  table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
  th{font-size:11px;color:var(--sub);font-weight:700}tr:last-child td{border-bottom:none}
  .muted{color:var(--sub)}.right{text-align:right}.center{text-align:center}
  .empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px}.empty .big{display:flex;justify-content:center;margin-bottom:10px;opacity:.55}
  .sess{padding:12px 0;border-bottom:1px solid var(--line)}.sess:last-child{border-bottom:none}
  .sess .top{display:flex;justify-content:space-between;align-items:center}.sess .dt{font-size:12px;color:var(--sub)}
  .sess .mn{font-weight:700;font-size:14px}.sess .nt{font-size:13px;color:var(--sub);margin-top:4px;background:var(--soft);padding:8px 11px;border-radius:9px}
  .tabbar{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:6px;z-index:30;padding:10px 10px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(200,120,100,.07)}
  .tabbar button{flex:1;padding:11px 0;font-size:13px;font-weight:800;color:var(--sub);border-radius:13px;transition:.15s}
  .tabbar button.on{color:#fff;background:var(--accent)}
  .modal-bg{position:fixed;inset:0;background:rgba(45,40,35,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
  .modal{background:var(--panel);border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:92vh;overflow-y:auto}
  @media(min-width:520px){.modal-bg{align-items:center}.modal{border-radius:20px}}
  .modal-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{font-size:16px}.modal-h .x{font-size:22px;color:var(--sub);width:32px;height:32px;border-radius:8px}
  .modal-b{padding:18px 20px}.modal-f{padding:14px 20px calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
  .fld label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px}
  .fld input,.fld textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);background:#fff}
  .fld textarea{resize:vertical;min-height:64px}
  .unit-in{position:relative}.unit-in .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(160%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;transition:.3s;box-shadow:var(--shadow)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}
  .notice{background:var(--soft);border-radius:12px;padding:16px;font-size:13px;color:var(--sub);text-align:center;line-height:1.7}
  .notice b{color:var(--ink)}
  /* 小さめのスマホ（iPhone SE / Android 360px など） */
  @media(max-width:400px){
    .topbar{padding:10px 12px;gap:8px}
    .topbar .title{white-space:nowrap;font-size:14px}
    .topbar .who{max-width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
    .topbar .who span{display:none}
    .logout{padding:6px 9px;font-size:11px;white-space:nowrap}
    .wrap{padding:16px 12px 92px}
    .greet{font-size:18px}
    .cards{gap:8px}
    .stat{padding:12px 6px}
    .stat .k{font-size:10px}
    .stat .v{font-size:19px}.stat .v small{font-size:10px}
    .stat .d{font-size:10px}
    .panel{padding:14px 12px}
    .metric-pills button{padding:5px 10px;font-size:12px}
  }
</style>
</head>
<body>

<div id="boot" class="loading">読み込み中…</div>

<!-- CONFIG -->
<div id="config" class="cover hidden">
  <div class="card"><div class="logo"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.6M12 18.8v2.6M4.2 7.5l2.2 1.3M17.6 15.2l2.2 1.3M4.2 16.5l2.2-1.3M17.6 8.8l2.2-1.3"/></svg></div><div class="brand">初期設定<small>SUPABASE</small></div>
    <p class="hint" style="margin:16px 0 4px">スタジオから案内されたURLとanonキーを入力してください。</p>
    <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>anon public key</label><input id="cfgKey" placeholder="eyJhbGci..."></div>
    <button class="btn-primary" onclick="saveConfig()">保存して開始</button><div class="err" id="cfgErr"></div></div>
</div>

<!-- AUTH -->
<div id="auth" class="cover hidden">
  <div class="card"><div class="logo"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto"><path d="M20 4C11 4 4.5 9.5 4.5 17.5c0 0 0 2 0 2s2 0 2 0C14.5 19.5 20 13 20 4z"/><path d="M5 19C9 13.5 13 9.5 18.5 7"/></svg></div><div class="brand">Pilates マイページ<small>CUSTOMER — お客様用</small></div>
    <span class="badge">お客様用</span>
    <div class="role-tabs"><button id="tabLogin" class="on" onclick="authMode('login')">ログイン</button>
      <button id="tabSignup" onclick="authMode('signup')">はじめての方</button></div>
    <div class="field"><label>メールアドレス</label><input id="auEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>パスワード</label><input id="auPass" type="password" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <button class="btn-primary" id="auBtn" onclick="doAuth()">ログイン</button>
    <div class="err" id="auErr"></div><div class="ok" id="auOk"></div>
    <div class="hint" id="authHint"><b>スタジオに登録したメールアドレス</b>で「はじめての方」から登録してください。</div></div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar"><span class="title">マイページ</span>
    <div class="who"><b id="whoName"></b><span id="whoEmail"></span></div>
    <button class="logout" onclick="signOut()">ログアウト</button></div>
  <div class="wrap" id="view"></div>
  <div class="tabbar" id="tabbar"></div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG =================
   ↓ここに直接書けば設定画面をスキップできます（お客様配布時は書き込んでおくと親切）。 */
let SUPABASE_URL="https://jedhznwwspoeoztokqad.supabase.co";
let SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZGh6bnd3c3BvZW96dG9rcWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNjMzNTQsImV4cCI6MjA5ODYzOTM1NH0.41y_csW3FKEjXRlsXfBydA4TPXwbJBKrHUlOsQNgoFc";

let sb=null,meUser=null,me=null;                 // me = 自分のcustomer行
const store={measurements:[],sessions:[]};
let ui={view:'data',metric:'weight'};

function getConfig(){return{url:SUPABASE_URL||localStorage.getItem('sb_url')||'',key:SUPABASE_ANON_KEY||localStorage.getItem('sb_key')||''};}
function saveConfig(){const u=document.getElementById('cfgUrl').value.trim(),k=document.getElementById('cfgKey').value.trim();
  if(!u||!k){document.getElementById('cfgErr').textContent='両方入力してください';return;}
  localStorage.setItem('sb_url',u);localStorage.setItem('sb_key',k);location.reload();}

/* utils */
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function initials(n){const p=(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'')||(n||'?')[0];}
function fmtDate(d){if(!d)return '—';const t=new Date(d);return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;}
function today(){return new Date().toISOString().slice(0,10);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function show(id){['boot','config','auth'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.getElementById('app').style.display=id==='app'?'block':'none';}
const METRICS=[['weight','体重','kg'],['body_fat','体脂肪率','%'],['waist','ウエスト','cm'],['hip','ヒップ','cm'],['thigh','太もも','cm'],['arm','二の腕','cm']];
/* 単色・線画アイコン */
const ICONS={
  user:'<circle cx="12" cy="8" r="3.4"/><path d="M5.5 19.5c0-3.3 2.9-5.6 6.5-5.6s6.5 2.3 6.5 5.6"/>',
  chart:'<path d="M4 4v16h16"/><path d="M7 14l3.5-3.5 3 2L20 6"/>',
  note:'<rect x="5" y="4" width="14" height="17" rx="2.2"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4.5"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.3"/>',
  search:'<circle cx="11" cy="11" r="6.4"/><path d="M20 20l-4.3-4.3"/>'
};
function icon(n,s){s=s||20;return `<svg class="ico" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;}

/* boot */
async function boot(){
  const {url,key}=getConfig();if(!url||!key){show('config');return;}
  try{sb=supabase.createClient(url,key);}catch(e){show('config');return;}
  const {data}=await sb.auth.getSession();
  if(data.session){await onAuthed();}else{show('auth');}
  sb.auth.onAuthStateChange((_e,s)=>{if(!s)show('auth');});
}

/* auth */
let _mode='login';
function authMode(m){_mode=m;document.getElementById('tabLogin').classList.toggle('on',m==='login');
  document.getElementById('tabSignup').classList.toggle('on',m==='signup');
  document.getElementById('auBtn').textContent=m==='login'?'ログイン':'登録する';
  document.getElementById('auErr').textContent='';document.getElementById('auOk').textContent='';}
async function doAuth(){
  const email=document.getElementById('auEmail').value.trim(),pass=document.getElementById('auPass').value;
  const errEl=document.getElementById('auErr'),okEl=document.getElementById('auOk'),btn=document.getElementById('auBtn');
  errEl.textContent='';okEl.textContent='';if(!email||!pass){errEl.textContent='メールとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='処理中…';
  try{
    if(_mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass});if(error)throw error;
      if(!data.session){okEl.textContent='確認メールを送信しました。承認後にログインしてください。';authMode('login');}
      else await onAuthed();
    }else{const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)throw error;await onAuthed();}
  }catch(e){errEl.textContent=translateAuthErr(e.message);}
  finally{btn.disabled=false;btn.textContent=_mode==='login'?'ログイン':'登録する';}
}
function translateAuthErr(m){
  if(/Invalid login/i.test(m))return 'メールまたはパスワードが違います';
  if(/already registered/i.test(m))return 'このメールは既に登録済みです。「ログイン」からお進みください';
  if(/at least 6/i.test(m))return 'パスワードは6文字以上にしてください';
  if(/Email not confirmed/i.test(m))return 'メール確認が未完了です。受信メールのリンクを承認してください';
  return m;
}
async function onAuthed(){
  const {data:{user}}=await sb.auth.getUser();meUser=user;
  // 自分のcustomer行を取得（RLSでメール一致の行のみ返る）
  const {data:rows}=await sb.from('customers').select('*');
  me=(rows&&rows[0])||null;
  document.getElementById('whoEmail').textContent=user.email;
  show('app');
  if(!me){ renderNotLinked(); return; }
  document.getElementById('whoName').textContent=me.name;
  await loadMine();renderTabs();render();
}
async function signOut(){await sb.auth.signOut();show('auth');document.getElementById('auPass').value='';}

function renderNotLinked(){
  document.getElementById('tabbar').innerHTML='';
  document.getElementById('view').innerHTML=`<div style="padding:40px 6px"><div class="notice">
    <div style="margin-bottom:10px;display:flex;justify-content:center;color:var(--accent)">${icon('search',36)}</div>
    <b>${esc(meUser.email)}</b> に対応するお客様情報が見つかりませんでした。<br><br>
    スタジオに登録されているメールアドレスと、<b>同じメール</b>でログインしているかご確認ください。<br>
    ご不明な場合は担当トレーナーにお問い合わせください。<br><br>
    <button class="btn ghost sm" onclick="signOut()">別のメールでログインし直す</button></div></div>`;
}

/* data */
async function loadMine(){
  const [m,s]=await Promise.all([
    sb.from('measurements').select('*').eq('customer_id',me.id).order('date',{ascending:true}),
    sb.from('sessions').select('*').eq('customer_id',me.id).order('date',{ascending:false})]);
  store.measurements=m.data||[];store.sessions=s.data||[];
}
function measures(){return [...store.measurements].sort((a,b)=>a.date.localeCompare(b.date));}

/* tabs */
function renderTabs(){
  const items=[['data','計測'],['sessions','レッスン'],['profile','プロフィール']];
  document.getElementById('tabbar').innerHTML=items.map(([k,l])=>
    `<button class="${ui.view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(v){ui.view=v;renderTabs();render();}
function render(){const v=document.getElementById('view');
  ({data:()=>{v.innerHTML=viewData();drawChart(ui.metric);},sessions:()=>v.innerHTML=viewSessions(),profile:()=>v.innerHTML=viewProfile()}[ui.view])();}

/* view: data */
function viewData(){
  const ms=measures(),first=ms[0],last=ms[ms.length-1];
  const diff=k=>(first&&last&&first[k]!=null&&last[k]!=null)?(last[k]-first[k]):null;
  const cards=['weight','body_fat','waist'].map(k=>{const meta=METRICS.find(x=>x[0]===k);const d=diff(k);
    const cur=last&&last[k]!=null?last[k]:null;const sign=d==null?'':(d<0?'':'+');
    const col=d==null?'var(--sub)':(d<0?'var(--accent)':(d>0?'var(--danger)':'var(--sub)'));
    return `<div class="stat"><div class="k">${meta[1]}</div><div class="v">${cur!=null?cur:'—'}<small> ${cur!=null?meta[2]:''}</small></div>
      <div class="d" style="color:${col}">${d!=null?`${sign}${(+d).toFixed(1)}`:'—'}</div></div>`;}).join('');
  return `<div class="greet">こんにちは、${esc(me.name)} さん</div>
  <div class="greet-sub">あなたの計測データ${last?` · 最終計測 ${fmtDate(last.date)}`:''}</div>
  ${me.goal?`<div class="goal-box"><div class="l" style="display:flex;align-items:center;gap:5px">${icon('target',13)} 目標</div><div class="t">${esc(me.goal)}</div></div>`:''}
  <div class="cards">${cards}</div>
  <div class="panel"><h3>推移グラフ</h3><div class="metric-pills">
    ${METRICS.map(m=>`<button class="${ui.metric===m[0]?'on':''}" onclick="ui.metric='${m[0]}';render()">${m[1]}</button>`).join('')}</div>
    <div class="chart-wrap"><canvas id="chart" width="640" height="260"></canvas></div></div>
  <div class="panel"><h3>計測履歴 <span class="count">${ms.length}</span></h3>
    ${ms.length?`<div style="overflow-x:auto"><table><thead><tr><th>日付</th><th>体重</th><th>体脂肪%</th><th>ウエスト</th><th>ヒップ</th></tr></thead><tbody>
      ${[...ms].reverse().map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${m.weight??'—'}</td><td>${m.body_fat??'—'}</td><td>${m.waist??'—'}</td><td>${m.hip??'—'}</td></tr>`).join('')}
    </tbody></table></div>`:`<div class="empty"><span class="big">${icon('chart',38)}</span>まだ計測データがありません</div>`}</div>
  <button class="btn block" onclick="openMeasureForm()">＋ 自分で計測を記録する</button>`;
}

/* chart */
function drawChart(metric){
  const canvas=document.getElementById('chart');if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,W=canvas.clientWidth||640,H=260;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.height=H+'px';ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const meta=METRICS.find(m=>m[0]===metric);
  const data=measures().filter(m=>m[metric]!=null).map(m=>({x:m.date,y:+m[metric]}));
  const pad={l:44,r:16,t:20,b:32},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  ctx.font='12px sans-serif';
  if(!data.length){ctx.fillStyle='#ad8d84';ctx.textAlign='center';ctx.fillText('データがありません',W/2,H/2);return;}
  const ys=data.map(d=>d.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const p=(mx-mn)*.15;mn-=p;mx+=p;
  const X=i=>data.length===1?pad.l+cw/2:pad.l+cw*i/(data.length-1),Y=v=>pad.t+ch*(1-(v-mn)/(mx-mn));
  ctx.strokeStyle='#f1ded7';ctx.fillStyle='#d8b8ac';ctx.textAlign='right';ctx.font='11px sans-serif';
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,y=Y(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillText(v.toFixed(1),pad.l-8,y+4);}
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);grad.addColorStop(0,'rgba(244,122,104,.28)');grad.addColorStop(1,'rgba(244,122,104,0)');
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0].y));data.forEach((d,i)=>ctx.lineTo(X(i),Y(d.y)));ctx.lineTo(X(data.length-1),pad.t+ch);ctx.lineTo(X(0),pad.t+ch);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#e05e4b';ctx.lineWidth=2.5;ctx.lineJoin='round';data.forEach((d,i)=>i===0?ctx.moveTo(X(i),Y(d.y)):ctx.lineTo(X(i),Y(d.y)));ctx.stroke();
  ctx.textAlign='center';data.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.y),4,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#e05e4b';ctx.stroke();
    ctx.fillStyle='#5a423c';ctx.font='bold 11px sans-serif';ctx.fillText(d.y,X(i),Y(d.y)-12);
    ctx.fillStyle='#d8b8ac';ctx.font='10px sans-serif';const dd=new Date(d.x);ctx.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,X(i),pad.t+ch+18);});
  ctx.fillStyle='#ad8d84';ctx.textAlign='left';ctx.font='12px sans-serif';ctx.fillText(`${meta[1]} (${meta[2]})`,pad.l,14);
}

/* measure form (customer self-record) */
function modal(h){document.getElementById('modalRoot').innerHTML=h;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function openMeasureForm(){
  modal(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-h"><h3>計測を記録</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form-grid"><div class="fld full"><label>計測日 *</label><input id="m_date" type="date" value="${today()}"></div>
      ${[['weight','体重','kg'],['body_fat','体脂肪率','%'],['waist','ウエスト','cm'],['hip','ヒップ','cm'],['thigh','太もも','cm'],['arm','二の腕','cm']]
        .map(([k,l,u])=>`<div class="fld"><label>${l}</label><div class="unit-in"><input id="m_${k}" type="number" step="0.1" inputmode="decimal"><span class="u">${u}</span></div></div>`).join('')}
      <div class="fld full"><label>メモ</label><textarea id="m_note" placeholder="体調・気づきなど"></textarea></div></div></div>
    <div class="modal-f"><button class="btn ghost" style="flex:1" onclick="closeModal()">キャンセル</button>
      <button class="btn" style="flex:1" id="mbtn" onclick="saveMeasure()">記録する</button></div></div></div>`);
  setTimeout(()=>document.getElementById('m_weight').focus(),50);
}
async function saveMeasure(){
  const num=k=>{const v=document.getElementById('m_'+k).value;return v===''?null:parseFloat(v);};
  const date=document.getElementById('m_date').value;if(!date){toast('計測日を入力してください');return;}
  const row={customer_id:me.id,date,weight:num('weight'),body_fat:num('body_fat'),waist:num('waist'),hip:num('hip'),thigh:num('thigh'),arm:num('arm'),note:document.getElementById('m_note').value.trim()||null};
  const btn=document.getElementById('mbtn');btn.disabled=true;btn.textContent='保存中…';
  const {error}=await sb.from('measurements').insert(row);
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  await loadMine();closeModal();toast('記録しました');render();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
boot();
