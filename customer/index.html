<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f3f1">
<title>マイページ — Pilates</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="Noailles">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== デザイントークン（お店側と共通） ===== */
  :root{
    color-scheme:light;
    --bg:#f8f3f1;--paper:#fff;--tile:#fcf7f6;--pill:#f4ebe8;
    --ink:#4a3936;--ink2:#665350;--sub:#7f6a65;--faint:#c5b4af;
    --line:#ece0dc;--line2:#f4ebe8;
    --accent:#e8a3a0;--accent-h:#e09793;--accent-soft:#fbeeec;--accent-ink:#4a3936;--accent-d:#9c5551;--on-dark:#fff;--hover:#fdf8f7;--off:#faf6f5;--ph:#b8a7a2;
    --up:#3f7a5e;--down:#a5504a;--danger:#b0443c;
    --font:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;
    --fs-xs:11.5px;--fs-sm:12.5px;--fs-md:14px;--fs-lg:15.5px;--fs-xl:18px;--fs-2xl:22px;--fs-3xl:26px;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
    --r-sm:10px;--r-md:14px;--r:18px;--r-lg:22px;--r-pill:999px;
    --shadow:0 1px 2px rgba(110,70,60,.05),0 10px 28px -18px rgba(140,85,75,.24);
    --shadow-2:0 2px 8px rgba(110,70,60,.06),0 28px 70px -24px rgba(90,50,40,.38);
    --ease:cubic-bezier(.22,.9,.3,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --t-fast:.14s;--t-med:.26s;--t-slow:.6s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;font-size:var(--fs-md);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
  h1,h2,h3,.logo,.hello b,.nt-title{font-feature-settings:"palt";text-wrap:balance}
  .note,.empty,.hw,.nt-body{text-wrap:pretty}
  button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input,textarea{font:inherit;font-size:16px;color:var(--ink)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent-d)!important;box-shadow:0 0 0 3px var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent-d);outline-offset:2px}
  input:focus-visible,textarea:focus-visible{outline:none}
  ::placeholder{color:var(--ph);opacity:1}
  ::selection{background:var(--accent-soft)}
  .hidden{display:none!important}
  .up{color:var(--up)}.dn{color:var(--down)}.muted{color:var(--sub)}

  /* 読み込み中 */
  .loading{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--sub);font-size:13px;letter-spacing:.08em}
  .loading .bar{width:120px;height:2px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
  .loading .bar::after{content:'';position:absolute;inset:0;width:40%;background:var(--accent);border-radius:2px;animation:slide 1.1s var(--ease) infinite}

  /* ログイン */
  .cover{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--s6)}
  .cover-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:40px 28px 32px;animation:rise var(--t-slow) var(--ease-out) both}
  .cover-card .logo{font-size:var(--fs-3xl);font-weight:700;letter-spacing:.06em;text-align:center}
  .cover-card .cap{font-size:10px;letter-spacing:.32em;color:var(--sub);text-align:center;margin:var(--s2) 0 var(--s6)}
  .seg{display:flex;background:var(--tile);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:2px;margin-bottom:22px}
  .seg button{flex:1;min-height:40px;font-size:var(--fs-md);color:var(--ink2);padding:9px 0;border-radius:var(--r-pill);transition:background var(--t-med) var(--ease),color var(--t-fast)}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .field{margin-bottom:var(--s4)}
  .field label,.fld label{display:block;font-size:var(--fs-sm);color:var(--sub);margin-bottom:6px;letter-spacing:.04em}
  .field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
  .btn-block{width:100%;min-height:48px;padding:13px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;letter-spacing:.08em;
    transition:background var(--t-fast),transform var(--t-fast) var(--ease)}
  .btn-block:active{transform:scale(.98)}
  .btn-block:disabled{opacity:.6;cursor:default;transform:none}
  .err{color:var(--danger);font-size:13px;margin-top:var(--s3);min-height:18px;text-align:center}
  .ok{color:var(--up);font-size:13px;margin-top:var(--s3);text-align:center}
  .hint{font-size:var(--fs-sm);color:var(--sub);margin-top:var(--s4);line-height:1.8;text-align:center}

  /* 本体 */
  #app{display:none}
  .wrap{max-width:560px;margin:0 auto;padding:var(--s5) var(--s4) calc(110px + env(safe-area-inset-bottom))}
  .top{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 18px}
  .top .logo{font-size:var(--fs-xl);font-weight:700;letter-spacing:.06em}
  .top .d{font-size:var(--fs-sm);color:var(--sub)}
  .hello{font-size:var(--fs-sm);color:var(--sub);padding:0 4px;margin-bottom:6px;letter-spacing:.04em}
  .hello b{display:block;font-size:var(--fs-2xl);color:var(--ink);margin-top:2px;letter-spacing:.04em}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px var(--s5);margin-top:14px}
  .card .k{font-size:var(--fs-xs);color:var(--sub);letter-spacing:.14em}
  .card .k span{margin-left:var(--s2);letter-spacing:0;color:var(--sub);opacity:.8}
  .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
  .ch h2{font-size:15px;font-weight:700;letter-spacing:.06em}
  .ch h2 span{font-weight:400;font-size:var(--fs-sm);color:var(--sub);margin-left:var(--s2)}
  .banner{background:var(--accent-soft);color:var(--accent-d);border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:13px;margin-top:14px;line-height:1.8}
  .next{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s2)}
  .next .day{font-size:42px;font-weight:700;line-height:1;min-width:56px;text-align:center;letter-spacing:-.02em}
  .next .meta{font-size:var(--fs-md);color:var(--ink2);line-height:1.7}
  .more{font-size:var(--fs-sm);color:var(--sub);margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
  .stamps{display:flex;gap:10px;margin:var(--s3) 0 10px;flex-wrap:wrap}
  .stamps i{width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--faint);display:grid;place-items:center;font-style:normal;font-size:var(--fs-sm);color:var(--sub)}
  .stamps i.on{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;animation:pop var(--t-slow) var(--ease-out) both}
  .stamps i.on:nth-child(2){animation-delay:.08s}.stamps i.on:nth-child(3){animation-delay:.16s}
  .coupon{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:var(--r-sm);padding:var(--s3) 14px;margin-top:var(--s3)}
  .coupon b{font-size:20px;color:var(--accent-d)}
  .coupon span{font-size:var(--fs-sm);color:var(--accent-d)}
  .coupon small{display:block;font-size:var(--fs-xs);color:var(--ink2);margin-top:2px}
  .tk+.tk{margin-top:var(--s4);padding-top:14px;border-top:1px solid var(--line2)}
  .tk-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
  .tk-h span{font-size:var(--fs-sm);color:var(--ink2)}
  .tk-h b{font-size:24px;font-weight:700;letter-spacing:.02em}.tk-h small{font-size:var(--fs-sm);font-weight:500;color:var(--sub);margin-left:2px}
  .tk-dots{display:flex;gap:6px;margin:10px 0 8px}
  .tk-dots i{flex:1;height:8px;border-radius:var(--r-pill);background:var(--line2)}
  .tk-dots i.on{background:var(--accent)}
  .tk-f{font-size:var(--fs-xs);color:var(--sub)}.tk-f.hotv{color:var(--accent-d);font-weight:700}
  .mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:var(--s2)}
  .mrow .l{font-size:var(--fs-xs);color:var(--sub)}
  .mrow .v{font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .mrow .v small{font-size:var(--fs-sm);color:var(--sub);margin-left:2px;font-weight:500}
  .mrow .d{font-size:var(--fs-xs);font-weight:700}
  .goal{font-size:15px;font-weight:500;margin-top:4px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s3)}
  .pills button{min-height:36px;padding:6px 14px;border-radius:var(--r-pill);background:var(--pill);font-size:var(--fs-sm);color:var(--ink2);transition:background var(--t-fast),color var(--t-fast)}
  .pills button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
  canvas{display:block;width:100%}
  .rec{padding:14px 0;border-top:1px solid var(--line2)}
  .rec:first-child{border-top:0;padding-top:0}
  .rec .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .rec .dt{font-size:13px;font-weight:700}
  .rec .pl{font-size:var(--fs-sm);color:var(--sub)}
  .rec .vals{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:4px;color:var(--ink2)}
  .rec .nt{font-size:13px;color:var(--ink2);background:var(--tile);border-radius:var(--r-sm);padding:9px var(--s3);margin-top:var(--s2);line-height:1.8}
  .tag{display:inline-block;font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .tag.gray{background:var(--pill);color:var(--ink2)}
  .list{list-style:none}
  .list li{display:flex;justify-content:space-between;gap:var(--s4);padding:11px 0;border-top:1px solid var(--line2);font-size:var(--fs-md)}
  .list li:first-child{border-top:0;padding-top:0}
  .list li span:first-child{color:var(--sub);white-space:nowrap}
  .list li span:last-child{text-align:right;word-break:break-all}
  .list a{display:inline-block;padding:8px 0;margin:-8px 0;color:var(--accent-d);font-weight:700}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;font-size:13px;font-weight:700;border-radius:var(--r-pill);padding:9px 20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);white-space:nowrap;
    transition:transform var(--t-fast) var(--ease),background var(--t-fast)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--on-dark)}
  .btn.wide{width:100%;min-height:48px;padding:13px}
  .empty{text-align:center;color:var(--sub);padding:22px 10px;font-size:13.5px;line-height:1.9}
  .note{background:var(--tile);border:1px solid var(--line2);border-radius:var(--r-sm);padding:var(--s3) 14px;font-size:13px;color:var(--ink2);line-height:1.85}
  .pt{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);margin-top:var(--s2)}
  .pt .l{font-size:var(--fs-xs);color:var(--sub)}
  .pt .v{font-size:var(--fs-2xl);font-weight:700;line-height:1.35}
  .pt .v small{font-size:var(--fs-sm);color:var(--sub);font-weight:500;margin-left:2px}
  .pt .hotv .v{color:var(--danger)}
  .gauge{height:8px;border-radius:var(--r-pill);background:var(--pill);overflow:hidden;margin:var(--s3) 0 6px}
  .gauge i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);transform-origin:left;animation:grow .9s var(--ease-out) .15s both}
  .gauge.low i{background:var(--danger)}
  .gl{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm);color:var(--sub)}
  .gl b{color:var(--ink);font-weight:700}
  .goalbar{margin-top:14px}
  .sub-sec{margin-top:var(--s4);padding-top:14px;border-top:1px solid var(--line2)}
  .hw{font-size:var(--fs-md);line-height:1.9;margin-top:6px;white-space:pre-wrap}
  .news .nt-title{font-size:15px;font-weight:700;margin-top:6px}
  .news .nt-body{font-size:13px;color:var(--ink2);line-height:1.85;margin-top:4px;white-space:pre-wrap}
  .nd{border-top:1px solid var(--line2);padding:10px 0}
  .nd:first-of-type{border-top:0}
  .nd summary{list-style:none;display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-md);cursor:pointer;min-height:28px;align-items:center}
  .nd summary::-webkit-details-marker{display:none}
  .nd summary em{font-style:normal;font-size:var(--fs-sm);color:var(--sub);white-space:nowrap}
  .nd[open] summary span{font-weight:700}
  .nd[open] .nt-body{animation:rise var(--t-med) var(--ease-out) both}
  .linkbtn{display:inline-block;min-height:32px;font-size:13px;color:var(--accent-d);font-weight:700;margin-top:var(--s3);text-decoration:underline;text-underline-offset:3px}
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:532px;bottom:calc(14px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r-pill);display:flex;padding:5px;z-index:40;box-shadow:var(--shadow-2)}
  .tabbar button{flex:1;min-height:44px;font-size:13.5px;padding:11px 0;border-radius:var(--r-pill);color:var(--ink2);transition:background var(--t-med) var(--ease),color var(--t-fast)}
  .tabbar button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

  /* 入力・確認（下から出るシート） */
  .modal-bg{position:fixed;inset:0;background:rgba(60,40,36,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade var(--t-med) ease both}
  .modal{background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-2);animation:sheet .34s var(--ease-out) both}
  .modal::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex-shrink:0}
  #dialogRoot .modal-bg{z-index:70}
  #dialogRoot .modal-h h3{font-size:var(--fs-lg);line-height:1.6;text-wrap:pretty;word-break:auto-phrase}
  .dlg-body{font-size:var(--fs-md);color:var(--ink2);line-height:1.85;white-space:pre-line}
  @media(min-width:600px){.modal-bg{align-items:center;padding:var(--s5)}.modal{border-radius:var(--r-lg);animation:pop var(--t-med) var(--ease-out) both}.modal::before{display:none}}
  .modal-h{padding:var(--s3) var(--s5) var(--s2);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .modal-h h3{font-size:var(--fs-xl);letter-spacing:.06em}
  .modal-h .x{font-size:22px;color:var(--sub);width:40px;height:40px;border-radius:50%;flex-shrink:0}
  .modal-b{padding:var(--s2) var(--s5) var(--s4);overflow-y:auto;overscroll-behavior:contain}
  .modal-f{padding:var(--s3) var(--s5) calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line2)}
  .modal-f .btn{flex:1;min-height:46px;padding:12px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
  .form .full{grid-column:1/-1}
  .fld input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
  .unit{position:relative}
  .unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:var(--fs-sm);pointer-events:none}
  .unit input{padding-right:36px}
  .toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--on-dark);
    padding:var(--s3) 22px;border-radius:var(--r-pill);font-size:13.5px;z-index:90;transition:transform var(--t-med) var(--ease-out),opacity var(--t-med);max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow-2)}
  .toast.show{transform:translate(-50%,0);opacity:1}

  /* マウスのある端末だけのホバー */
  @media (hover:hover){
    .btn:hover{background:var(--pill)}
    .btn.primary:hover,.btn-block:hover{background:var(--accent-h)}
    .modal-h .x:hover{background:var(--pill)}
  }

  /* 動き */
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:none}}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .wrap>*{animation:rise .42s var(--ease-out) both}
  .wrap>*:nth-child(2){animation-delay:.04s}.wrap>*:nth-child(3){animation-delay:.08s}
  .wrap>*:nth-child(4){animation-delay:.12s}.wrap>*:nth-child(n+5){animation-delay:.16s}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  @media(max-width:360px){.mrow .v{font-size:20px}.stamps i{width:34px;height:34px}}
  .pwbox{position:relative;display:block}
  .pwbox input{width:100%;padding-right:48px}
  .pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:var(--r-sm,10px);color:var(--sub);cursor:pointer}
  @media(hover:hover){.pweye:hover{color:var(--ink)}}
</style>
</head>
<body>

<div id="boot" class="loading" role="status"><div class="bar"></div><span>読み込み中</span></div>

<div id="config" class="cover hidden">
  <div class="cover-card"><div class="logo">初期設定</div><div class="cap">CONNECTION</div>
    <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>anon public key</label><input id="cfgKey" placeholder="eyJhbGci..."></div>
    <button class="btn-block" onclick="saveConfig()">保存して開始</button><div class="err" id="cfgErr"></div></div>
</div>

<div id="auth" class="cover hidden">
  <div class="cover-card">
    <div class="logo" id="authLogo">Pilates</div><div class="cap">MY PAGE</div>
    <div class="seg"><button id="tabLogin" class="on" onclick="authMode('login')">ログイン</button><button id="tabSignup" onclick="authMode('signup')">はじめての方</button></div>
    <div class="field"><label>メールアドレス</label><input id="auEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>パスワード</label><input id="auPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <button class="btn-block" id="auBtn" onclick="doAuth()">ログイン</button>
    <div class="err" id="auErr"></div><div class="ok" id="auOk"></div>
    <div class="hint" id="authHint">はじめての方は、<b>スタジオに登録したメールアドレス</b>で「はじめての方」から登録してください。</div>
  </div>
</div>

<div id="app">

function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
/* プロテイン：次の購入の目安と残り */
function proteinInfo(){
  const p=store.protein;if(!p||!p.purchase_date)return null;
  const vol=+p.volume_g||500,serv=+p.serving_g||20,perDay=+p.per_day||1;
  const servings=Math.floor(vol/serv),days=servings/perDay,runOut=addDays(p.purchase_date,Math.round(days));
  const left=daysBetween(today(),runOut),usedDays=Math.max(0,daysBetween(p.purchase_date,today()));
  return {product:p.product_name||'プロテイン',perDay,servings,runOut,left,remain:Math.max(0,Math.round(servings-usedDays*perDay)),pct:Math.max(0,Math.min(100,left/days*100))};
}
/* 通った記録：今月・通算・連続週 */
function weekKey(s){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function visitStats(){
  const ss=store.sessions,ym=today().slice(0,7),weeks=new Set(ss.map(s=>weekKey(s.date)));
  let w=weekKey(today()),streak=0;
  if(!weeks.has(w))w=addDays(w,-7);          /* 今週まだなら、先週から数える */
  while(weeks.has(w)){streak++;w=addDays(w,-7);}
  return {month:ss.filter(s=>(s.date||'').slice(0,7)===ym).length,total:ss.length,streak};
}
/* 目標までの進み具合 */
function goalProgress(k,goal){
  if(goal==null||goal==='')return null;
  const ms=measures().filter(m=>m[k]!=null);if(!ms.length)return null;
  const start=+ms[0][k],cur=+ms[ms.length-1][k],g=+goal;
  const rem=cur-g,whole=start-g;
  return {goal:g,cur,rem,done:rem<=0,pct:whole>0?Math.max(0,Math.min(100,(start-cur)/whole*100)):(rem<=0?100:0)};
}

  const s=store.studio||{},title=`${studioName()} ${CATLABEL[cat]||'レッスン'}`;
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pilates MyPage//JA','BEGIN:VEVENT',`UID:${date}${time}@mypage`,`DTSTAMP:${f(new Date())}`,
    `DTSTART:${f(st)}`,`DTEND:${f(en)}`,`SUMMARY:${title}`,s.address?`LOCATION:${s.address}`:'',
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY',`DESCRIPTION:${title}`,'END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download=`予約_${date}.ics`;a.click();

  ss.forEach(s=>{const m=ms.find(x=>x.date===s.date&&!used.has(x.id));if(m)used.add(m.id);rows.push({date:s.date,s,m});});
  ms.filter(m=>!used.has(m.id)).forEach(m=>rows.push({date:m.date,s:null,m}));
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  return `${topBar()}
  <div class="card"><div class="ch"><h2>推移グラフ</h2></div>
    <div class="pills">${METRICS.map(m=>`<button class="${ui.metric===m[0]?'on':''}" onclick="ui.metric='${m[0]}';render()">${m[1]}</button>`).join('')}</div>
    <canvas id="chart" height="230"></canvas></div>
  <div class="card"><div class="ch"><h2>これまでの記録<span>${rows.length}件</span></h2></div>
    ${rows.length?rows.slice(0,60).map(({date,s,m})=>`<div class="rec"><div class="h"><span class="dt">${fmtYmd(date)}（${dowJp(date)}）</span>
        <span>${s?`<span class="tag">${CATLABEL[s.category]||'レッスン'}</span>`:'<span class="tag gray">計測</span>'}</span></div>
      ${s&&s.menu?`<div class="pl">${esc(s.menu)}${s.duration?`・${s.duration}分`:''}</div>`:''}
      ${m?`<div class="vals">${METRICS.filter(([k])=>m[k]!=null).map(([k,l,u])=>`<span>${l} <b>${m[k]}</b>${u}</span>`).join('')}</div>`:''}
      ${s&&s.note?`<div class="nt">${esc(s.note)}</div>`:''}
      ${s&&s.homework?`<div class="nt"><b>セルフケア</b>　${esc(s.homework)}</div>`:''}</div>`).join('')
      :'<div class="empty">まだ記録がありません</div>'}</div>
  ${me.withdrawn_at?'':`<button class="btn primary wide" style="margin-top:16px" onclick="openMeasureForm()">自分で計測を記録する</button>`}`;
}

/* ---------- グラフ ---------- */
function drawChart(metric){
  const cv=document.getElementById('chart');if(!cv)return;
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||340,H=230;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const x=cv.getContext('2d');x.scale(dpr,dpr);
  const F='"Zen Kaku Gothic New",sans-serif',meta=METRICS.find(m=>m[0]===metric);
  const d=measures().filter(m=>m[metric]!=null).map(m=>({x:m.date,y:+m[metric]}));
  const P={l:38,r:12,t:24,b:28},cw=W-P.l-P.r,ch=H-P.t-P.b;
  x.font=`12px ${F}`;x.fillStyle='#7f6a65';
  if(!d.length){x.textAlign='center';x.fillText('まだ記録がありません',W/2,H/2);return;}
  const ys=d.map(v=>v.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const pd=(mx-mn)*.18;mn-=pd;mx+=pd;
  const X=i=>d.length===1?P.l+cw/2:P.l+cw*i/(d.length-1),Y=v=>P.t+ch*(1-(v-mn)/(mx-mn));
  x.textAlign='left';x.fillText(`${meta[1]}（${meta[2]}）`,0,12);x.font=`10.5px ${F}`;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,yy=Y(v);x.strokeStyle='#f5edea';x.beginPath();x.moveTo(P.l,yy);x.lineTo(W-P.r,yy);x.stroke();x.textAlign='right';x.fillStyle='#7f6a65';x.fillText(v.toFixed(1),P.l-5,yy+4);}
  const gr=x.createLinearGradient(0,P.t,0,P.t+ch);gr.addColorStop(0,'rgba(232,163,160,.28)');gr.addColorStop(1,'rgba(232,163,160,0)');
  x.beginPath();x.moveTo(X(0),Y(d[0].y));d.forEach((v,i)=>x.lineTo(X(i),Y(v.y)));x.lineTo(X(d.length-1),P.t+ch);x.lineTo(X(0),P.t+ch);x.closePath();x.fillStyle=gr;x.fill();
  x.beginPath();x.strokeStyle='#d98e8a';x.lineWidth=2.2;x.lineJoin='round';d.forEach((v,i)=>i?x.lineTo(X(i),Y(v.y)):x.moveTo(X(i),Y(v.y)));x.stroke();
  const every=Math.ceil(d.length/(W<420?6:12));
  d.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v.y),3.2,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=2;x.strokeStyle='#d98e8a';x.stroke();
    if((i%every===0&&d.length-1-i>=every*.6)||i===d.length-1){x.textAlign='center';x.fillStyle='#4a3936';x.font=`700 10.5px ${F}`;x.fillText(v.y,X(i),Y(v.y)-9);
      x.fillStyle='#7f6a65';x.font=`10px ${F}`;const dd=new Date(v.x+'T00:00:00');x.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,X(i),P.t+ch+16);}});
}

/* ---------- 自分で計測を記録 ---------- */
function modal(inner){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
/* 確認のダイアログ（ブラウザ標準の小窓の代わり） → true / false */
let _dlg=null;
function dlgClose(v){document.getElementById('dialogRoot').innerHTML='';if(_dlg){const r=_dlg;_dlg=null;r(v);}}
function ask(text,o){
  o=o||{};
  return new Promise(done=>{_dlg=done;
    document.getElementById('dialogRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)dlgClose(false)"><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dlgT">
      <div class="modal-h"><h3 id="dlgT">${esc(text)}</h3></div>${o.body?`<div class="modal-b"><div class="dlg-body">${esc(o.body)}</div></div>`:''}
      <div class="modal-f"><button class="btn" onclick="dlgClose(false)">${esc(o.cancel||'キャンセル')}</button><button class="btn ${o.danger?'danger-fill':'primary'}" id="dlgOk" onclick="dlgClose(true)">${esc(o.ok||'OK')}</button></div></div></div>`;
    setTimeout(()=>{const b=document.getElementById('dlgOk');if(b)b.focus();},40);});
}
/* 時間帯に合わせたあいさつ */
function greeting(){const h=new Date().getHours();return h>=5&&h<11?'おはようございます':h>=11&&h<17?'こんにちは':'こんばんは';}
function openMeasureForm(){
  modal(`<div class="modal-h"><h3>計測を記録</h3><button class="x" aria-label="閉じる" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form"><div class="fld full"><label>計測日</label><input id="m_date" type="date" value="${today()}"></div>
      ${METRICS.map(([k,l,u])=>`<div class="fld"><label>${l}</label><div class="unit"><input id="m_${k}" type="number" step="0.1" inputmode="decimal"><span class="u">${u}</span></div></div>`).join('')}
      <div class="fld full"><label>メモ</label><input id="m_note" placeholder="体調・気づきなど"></div></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" id="mbtn" onclick="saveMeasure()">記録する</button></div>`);
}
async function saveMeasure(){
  const date=document.getElementById('m_date').value;if(!date){toast('計測日を入力してください');return;}
  const row={customer_id:me.id,date,note:document.getElementById('m_note').value.trim()||null};let any=false;
  METRICS.forEach(([k])=>{const v=document.getElementById('m_'+k).value;row[k]=v===''?null:parseFloat(v);if(v!=='')any=true;});
  if(!any){toast('どれか1つは入力してください');return;}
  const btn=document.getElementById('mbtn');btn.disabled=true;
  const {error}=await sb.from('measurements').insert(row);
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  await loadMine();closeModal();toast('記録しました');render();
}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(_dlg){dlgClose(false);return;}closeModal();});
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(ui.view==='record')drawChart(ui.metric);},150);});
boot();
/* パスワード欄の「表示／非表示」ボタン（あとから出る入力欄にも自動で付く） */
const EYE_ON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function pwEye(inp){
  inp.dataset.eye=1;const w=document.createElement('span');w.className='pwbox';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const b=document.createElement('button');b.type='button';b.className='pweye';b.innerHTML=EYE_ON;
  b.setAttribute('aria-label','パスワードを表示');b.setAttribute('aria-pressed','false');
  b.onclick=()=>{const on=inp.type==='password';inp.type=on?'text':'password';b.innerHTML=on?EYE_OFF:EYE_ON;
    b.setAttribute('aria-label',on?'パスワードを隠す':'パスワードを表示');b.setAttribute('aria-pressed',String(on));inp.focus();};
  w.appendChild(b);
}
function pwEyes(){document.querySelectorAll('input[type=password]:not([data-eye])').forEach(pwEye);}
/* 画面を離れたら必ず隠す */
function pwHideAll(){document.querySelectorAll('input[data-eye]').forEach(i=>{if(i.type==='text'){i.type='password';const b=i.nextElementSibling;if(b){b.innerHTML=EYE_ON;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','パスワードを表示');}}});}
new MutationObserver(pwEyes).observe(document.body,{childList:true,subtree:true});pwEyes();
document.addEventListener('visibilitychange',()=>{if(document.hidden)pwHideAll();});
</script>
