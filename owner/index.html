<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilates Studio — お店側（顧客・計測管理）</title>
<style>
  :root{
    --bg:#fbf1ed;--panel:#ffffff;--ink:#5a423c;--sub:#a98d84;--faint:#cbb4ac;--accent:#f47a68;--accent-d:#e05e4b;
    --line:#f3e2db;--soft:#fdf3ef;--danger:#c0392b;--chip:#fce7e1;--gold:#eda58f;
    --shadow:0 10px 30px rgba(200,120,100,.10);--radius:22px;
  }
  .ico{display:block}
  .logo{color:var(--accent)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  .hidden{display:none!important}
  /* auth / config */
  .cover{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:410px;background:var(--panel);border-radius:24px;box-shadow:var(--shadow);padding:38px 32px;text-align:center}
  .logo{font-size:34px}
  .brand{font-size:22px;font-weight:700;margin-top:6px}
  .brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:2px;margin-top:2px}
  .badge{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:20px;background:var(--chip);color:var(--accent-d);font-size:12px;font-weight:700}
  .role-tabs{display:flex;gap:8px;margin:24px 0 18px;background:var(--soft);padding:5px;border-radius:12px}
  .role-tabs button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:var(--sub)}
  .role-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .field{text-align:left;margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
  .field input:focus{outline:none;border-color:var(--accent);background:#fff}
  .btn-primary{width:100%;padding:13px;background:var(--accent);color:#fff;border-radius:11px;font-weight:700;font-size:15px;margin-top:6px;transition:.15s}
  .btn-primary:hover{background:var(--accent-d)}
  .btn-primary:disabled{opacity:.6;cursor:default}
  .hint{font-size:12px;color:var(--sub);margin-top:16px}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  .ok{color:var(--accent-d);font-size:13px;margin-top:10px;min-height:18px}
  /* shell */
  #app{display:none;min-height:100vh}
  .layout{display:flex;max-width:1240px;margin:0 auto}
  .side{width:234px;flex-shrink:0;padding:28px 18px;display:flex;flex-direction:column;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
  .side .brand{font-size:17px;font-weight:800;letter-spacing:.01em;padding:2px 10px 4px;line-height:1.3}
  .side .glabel{font-size:10px;letter-spacing:.14em;color:var(--faint);font-weight:800;padding:17px 12px 7px}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side nav button{width:100%;text-align:left;padding:11px 16px;border-radius:14px;color:var(--sub);font-weight:700;font-size:13.5px}
  .side nav button:hover{background:var(--soft);color:var(--ink)}
  .side nav button.on{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(244,122,104,.30)}
  .side .acct{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}
  .side .acct .em{font-size:12px;color:var(--sub);margin-bottom:9px;word-break:break-all;padding:0 10px;font-weight:600}
  .side .acct .lo{width:100%;padding:10px;border-radius:12px;background:var(--soft);color:var(--sub);font-weight:700;font-size:12.5px}
  .side .acct .lo:hover{color:var(--danger)}
  .main{flex:1;min-width:0;padding:30px 34px 72px}
  h2.page-title{font-size:22px;margin-bottom:4px}.page-sub{color:var(--sub);font-size:14px;margin-bottom:22px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:26px}
  .stat{background:var(--panel);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--sub);font-weight:600}.stat .v{font-size:28px;font-weight:800;margin-top:4px;white-space:nowrap}
  .stat .v small{font-size:14px;color:var(--sub);font-weight:600}
  .stat.tot{background:var(--accent);color:#fff}
  .stat.tot .k{color:rgba(255,255,255,.85)}.stat.tot .v small{color:rgba(255,255,255,.78)}
  .panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
  .panel h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h3 .count{font-size:12px;color:var(--sub);font-weight:600;background:var(--chip);padding:2px 9px;border-radius:20px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.bar .grow{flex:1}
  .search{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--soft);width:100%;max-width:320px}
  .search:focus{outline:none;border-color:var(--accent);background:#fff}
  .btn{padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;background:var(--accent);color:#fff;transition:.15s}
  .btn:hover{background:var(--accent-d)}.btn.ghost{background:var(--chip);color:var(--ink)}.btn.ghost:hover{background:#f7d8cf}
  .btn.sm{padding:6px 12px;font-size:13px}.btn.danger{background:var(--danger)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px}
  th{font-size:12px;color:var(--sub);font-weight:700}tr:last-child td{border-bottom:none}
  tbody tr.clickable:hover{background:var(--soft);cursor:pointer}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
  .cust-cell{display:flex;align-items:center;gap:10px}.cust-cell small{color:var(--sub);font-size:12px}
  .tag{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--chip);font-size:12px;font-weight:600;color:var(--accent-d)}
  .muted{color:var(--sub)}.right{text-align:right}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}.empty .big{display:flex;justify-content:center;margin-bottom:10px;opacity:.55}
  .rowlink{color:var(--accent-d);font-weight:700;font-size:13px}.rowlink:hover{text-decoration:underline}
  .del{color:var(--sub);font-size:13px}.del:hover{color:var(--danger)}
  .back{color:var(--sub);font-size:13px;font-weight:600;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}.back:hover{color:var(--ink)}
  .profile-head{display:flex;gap:16px;align-items:center;margin-bottom:6px}
  .profile-head .avatar{width:54px;height:54px;font-size:20px}.profile-head .nm{font-size:22px;font-weight:800}.profile-head .kn{color:var(--sub);font-size:13px}
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:14px}
  .meta-grid .m .l{font-size:11px;color:var(--sub);font-weight:600}.meta-grid .m .d{font-size:14px;font-weight:600}
  .goal-box{background:var(--soft);border-left:3px solid var(--gold);padding:12px 14px;border-radius:8px;margin-top:14px;font-size:14px}
  .goal-box .l{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:3px}
  .tabs{display:flex;gap:6px;margin:20px 0 16px;border-bottom:1px solid var(--line)}
  .tabs button{padding:10px 16px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--accent-d);border-bottom-color:var(--accent)}
  .chart-wrap{position:relative;width:100%;overflow-x:auto}canvas{display:block;max-width:100%}
  .metric-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .metric-pills button{padding:6px 13px;border-radius:20px;background:var(--chip);font-size:13px;font-weight:600;color:var(--sub)}
  .metric-pills button.on{background:var(--accent);color:#fff}
  .modal-bg{position:fixed;inset:0;background:rgba(45,40,35,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
  .modal{background:var(--panel);border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{font-size:17px}.modal-h .x{font-size:22px;color:var(--sub);width:32px;height:32px;border-radius:8px}.modal-h .x:hover{background:var(--chip);color:var(--ink)}
  .modal-b{padding:22px 24px}.modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
  .fld label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);background:#fff}
  .fld textarea{resize:vertical;min-height:70px}
  .unit-in{position:relative}.unit-in .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px}
  .note-inline{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--sub);margin-bottom:14px}
  .note-inline b{color:var(--ink)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;transition:.3s;box-shadow:var(--shadow)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}
  code.k{background:var(--chip);padding:2px 6px;border-radius:5px;font-size:12px}
  /* calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cal-dow{background:var(--soft);text-align:center;padding:8px 0;font-size:12px;font-weight:700}
  .cal-cell{background:var(--panel);min-height:96px;padding:5px 5px 6px;cursor:pointer;transition:.1s;display:flex;flex-direction:column;gap:2px}
  .cal-cell:hover{background:var(--soft)}
  .cal-cell.other{background:#faf3ef;cursor:default}
  .cal-cell .dnum{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink)}
  .cal-cell.today .dnum{background:var(--accent);color:#fff;border-radius:50%}
  .cal-cell .rv{display:block;font-size:11px;line-height:1.5;padding:1px 6px;border-radius:5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  .cal-cell .rv:hover{filter:brightness(.95)}
  .cal-cell .rv-more{background:none;color:var(--sub);font-weight:600;padding:0 6px}
  .cal-cell .rv-t{font-weight:700}.cal-cell .rv-n{margin-left:3px}
  /* 誕生日は予約と区別（点線枠＋ゴールド） */
  .cal-cell .rv.bd{background:#fdf1d8;color:#8a6a2c;border:1px dashed #e3bd6a;font-weight:700}
  /* 横スクロールするテーブル用ラッパー */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* 会計：商品明細行 */
  .pay-line{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .pay-line select{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);font-size:14px}
  .pay-line input{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);width:100%;font-size:14px}
  .pay-line .unit-in .u{font-size:11px}
  .linedel{width:30px;height:30px;border-radius:8px;color:var(--sub);font-size:18px;flex-shrink:0;transition:.15s}
  .linedel:hover{background:#f7dcd6;color:var(--danger);transform:rotate(90deg)}
  /* ===== アニメーション ===== */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes modalUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes bgFade{from{opacity:0}to{opacity:1}}
  .fade-in{animation:fadeUp .38s cubic-bezier(.22,.9,.3,1) both}
  .pop{animation:popIn .34s cubic-bezier(.22,.9,.3,1) both}
  .slide-in{animation:slideIn .22s ease both}
  .pulse{animation:pulseSoft 1.6s ease-in-out infinite}
  .main>*{animation:fadeUp .34s cubic-bezier(.22,.9,.3,1) both}
  .cards .stat:nth-child(2){animation-delay:.04s}
  .cards .stat:nth-child(3){animation-delay:.08s}
  .cards .stat:nth-child(4){animation-delay:.12s}
  .cards .stat:nth-child(5){animation-delay:.16s}
  .cards .stat:nth-child(6){animation-delay:.2s}
  .modal-bg{animation:bgFade .2s ease both}
  .modal{animation:modalUp .3s cubic-bezier(.22,.9,.3,1) both}
  .stat{transition:transform .18s ease,box-shadow .18s ease}
  .stat:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(200,110,90,.18)}
  .btn{transition:transform .12s ease,background .15s ease,box-shadow .15s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(224,94,75,.28)}
  .btn:active{transform:translateY(0) scale(.97)}
  .side nav button{transition:background .15s ease,color .15s ease,transform .12s ease}
  .side nav button:active{transform:scale(.96)}
  .cal-cell{transition:background .14s ease}
  .cal-cell .rv{transition:transform .12s ease,filter .12s ease}
  .cal-cell .rv:hover{transform:translateX(2px)}
  .tag{transition:transform .12s ease}
  tbody tr.clickable{transition:background .14s ease}
  .metric-pills button,.tabs button{transition:background .15s ease,color .15s ease,transform .12s ease}
  .metric-pills button:active{transform:scale(.95)}
  .toast{will-change:transform}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:760px){
    .layout{flex-direction:column;max-width:100%}
    .main{padding:16px 12px 70px;min-width:0;width:100%}
    h2.page-title{font-size:19px}.page-sub{font-size:13px;margin-bottom:16px}
    /* メニュー：上部に横スクロールのバー（文字のみ） */
    .side{width:auto;max-width:100%;min-width:0;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;gap:6px;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
    .side::-webkit-scrollbar{height:0}
    .side .brand{display:none}
    .side .glabel{display:none}
    .side #navMenu{display:flex;gap:6px;min-width:0;align-items:center}
    .side nav{flex-direction:row;gap:6px}
    .side nav button{width:auto;flex:0 0 auto;white-space:nowrap;padding:8px 13px;font-size:12.5px}
    .side .acct{display:none}
    /* カードは2列 */
    .cards{grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
    .stat{padding:14px 12px}.stat .k{font-size:11px}.stat .v{font-size:22px}
    /* パネル・テーブル */
    .panel{padding:14px 12px;margin-bottom:14px}
    .panel table{min-width:460px}
    th,td{padding:9px 8px;font-size:13px}
    .search{max-width:none}
    .tabs button{padding:9px 10px;font-size:13px}
    /* モーダル */
    .modal-h{padding:16px}.modal-b{padding:16px}.modal-f{padding:14px 16px}
    .form-grid{grid-template-columns:1fr}
    /* カレンダー：狭い画面では時刻のみ表示 */
    .cal-dow{padding:6px 0;font-size:11px}
    .cal-cell{min-height:62px;padding:3px}
    .cal-cell .rv{font-size:9.5px;padding:1px 3px}
    .cal-cell .rv-n{display:none}
    .cal-cell .dnum{width:18px;height:18px;font-size:11px}
  }
  /* 小さめのスマホ：見出しとボタンを行分けして折り返しを防ぐ */
  @media(max-width:400px){
    .bar .grow{flex:1 0 100%}
    .panel h3{font-size:15px}
    .stat .v{font-size:20px}
  }
</style>
</head>
<body>

<div id="boot" class="loading">読み込み中…</div>

<!-- CONFIG（初回のみ: Supabase接続情報の入力） -->
<div id="config" class="cover hidden">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v2.6M12 18.8v2.6M4.2 7.5l2.2 1.3M17.6 15.2l2.2 1.3M4.2 16.5l2.2-1.3M17.6 8.8l2.2-1.3"/></svg></div>
    <div class="brand">初期設定<small>SUPABASE CONNECTION</small></div>
    <p class="hint" style="margin:16px 0 4px">SupabaseプロジェクトのURLとanonキーを入力してください（README参照）。この端末に保存されます。</p>
    <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>anon public key</label><input id="cfgKey" placeholder="eyJhbGci..."></div>
    <button class="btn-primary" onclick="saveConfig()">保存して開始</button>
    <div class="err" id="cfgErr"></div>
  </div>
</div>

<!-- AUTH（ログイン） -->
<div id="auth" class="cover hidden">
  <div class="card">
    <div class="logo"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto"><path d="M20 4C11 4 4.5 9.5 4.5 17.5c0 0 0 2 0 2s2 0 2 0C14.5 19.5 20 13 20 4z"/><path d="M5 19C9 13.5 13 9.5 18.5 7"/></svg></div>
    <div class="brand">Pilates Studio<small>OWNER — お店側</small></div>
    <div class="field" style="margin-top:26px"><label>メールアドレス</label><input id="auEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>パスワード</label><input id="auPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);cursor:pointer;margin:2px 0 6px">
      <input type="checkbox" id="auRemember" checked style="width:16px;height:16px;accent-color:var(--accent)"> この端末で次回から自動ログイン</label>
    <button class="btn-primary" id="auBtn" onclick="doAuth()">ログイン</button>
    <div class="err" id="auErr"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <aside class="side">
      <div class="brand" id="topStudio"></div>
      <div id="navMenu"></div>
      <div class="acct">
        <div class="em" id="whoEmail"></div>
        <button class="lo" onclick="signOut()">ログアウト</button>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG ================= */
/*  ↓↓↓ ここに直接書いてもOK（書けば設定画面をスキップ）。空ならアプリ内で入力できます。 */
let SUPABASE_URL  = "https://jedhznwwspoeoztokqad.supabase.co";
let SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplZGh6bnd3c3BvZW96dG9rcWFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNjMzNTQsImV4cCI6MjA5ODYzOTM1NH0.41y_csW3FKEjXRlsXfBydA4TPXwbJBKrHUlOsQNgoFc";

let sb=null, meProfile=null, meUser=null, isAdmin=false;
const store={customers:[],measurements:[],sessions:[],payments:[],proteins:[],reservations:[],products:[],planPrices:[]};
let ui={view:'dashboard',selectedCustomer:null,detailTab:'measure',metric:'weight',calMonth:null,salesMode:'month',salesCat:'',prodTab:'protein'};

function getConfig(){

function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function initials(n){const p=(n||'').trim().split(/\s+/);return ((p[0]||'')[0]||'')+((p[1]||'')[0]||'')||(n||'?')[0];}
function fmtDate(d){if(!d)return '—';const t=new Date(d);return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;}
function today(){return new Date().toISOString().slice(0,10);}
function ageOf(bd){if(!bd)return null;const b=new Date(bd),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ================= BOOT ================= */
/* 自動ログイン用の認証情報（この端末のみ・localStorage保存） */
function saveCreds(email,pass){try{localStorage.setItem('owner_auto',btoa(unescape(encodeURIComponent(JSON.stringify({email,pass})))));}catch(e){}}
function getCreds(){try{const r=localStorage.getItem('owner_auto');if(!r)return null;return JSON.parse(decodeURIComponent(escape(atob(r))));}catch(e){return null;}}
function clearCreds(){localStorage.removeItem('owner_auto');}
async function boot(){
  const {url,key}=getConfig();
  if(!url||!key){ show('config'); return; }
  try{ sb=supabase.createClient(url,key); }catch(e){ show('config'); return; }
  const {data}=await sb.auth.getSession();
  if(data.session){ await onAuthed(); }
  else {
    const c=getCreds();
    if(c&&c.email&&c.pass){
      document.getElementById('boot').textContent='自動ログイン中…'; show('boot');
      const {error}=await sb.auth.signInWithPassword({email:c.email,password:c.pass});
      if(!error){ await onAuthed(); }
      else { clearCreds(); show('auth'); document.getElementById('auErr').textContent='自動ログインに失敗しました。もう一度ログインしてください。'; }
    } else { show('auth'); }
  }
  sb.auth.onAuthStateChange((_e,s)=>{ if(!s){ show('auth'); } });
}
function show(id){ ['boot','config','auth'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
  document.getElementById('app').style.display = id==='app'?'block':'none'; }

/* ================= AUTH（ログインのみ） ================= */
async function doAuth(){
  const email=document.getElementById('auEmail').value.trim();
  const pass=document.getElementById('auPass').value;
  const errEl=document.getElementById('auErr'),btn=document.getElementById('auBtn');
  errEl.textContent='';
  if(!email||!pass){errEl.textContent='メールとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='ログイン中…';
  try{
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    if(document.getElementById('auRemember').checked) saveCreds(email,pass); else clearCreds();
    await onAuthed();
  }catch(e){ errEl.textContent = translateAuthErr(e.message); }
  finally{ btn.disabled=false; btn.textContent='ログイン'; }
}
function translateAuthErr(m){
  if(/Invalid login/i.test(m))return 'メールまたはパスワードが違います';
  if(/already registered/i.test(m))return 'このメールは既に登録されています';
  if(/at least 6/i.test(m))return 'パスワードは6文字以上にしてください';
  if(/Email not confirmed/i.test(m))return 'メール確認が完了していません。受信メールのリンクを承認してください';
  return m;
}
async function onAuthed(){
  const {data:{user}}=await sb.auth.getUser(); meUser=user;
  /* オーナー(店舗) or 管理者(開発者) を判定。RPCが未導入(migration-5前)なら role=owner でフォールバック */
  let ok=false; isAdmin=false;
  try{ const r=await sb.rpc('am_i_owner'); if(!r.error) ok=!!r.data; }catch(e){}
  try{ const r=await sb.rpc('am_i_admin'); if(!r.error) isAdmin=!!r.data; }catch(e){}
  const {data:prof}=await sb.from('profiles').select('role').eq('id',user.id).maybeSingle();
  meProfile=prof;
  if(!ok) ok = !!prof && prof.role==='owner';   // フォールバック
  if(!ok){
    show('auth');
    document.getElementById('auErr').textContent='このアプリはお店（オーナー）専用です。お客様は「お客様用アプリ」をご利用ください。';
    await sb.auth.signOut(); return;
  }
  document.getElementById('topStudio').textContent=studioName();
  document.getElementById('whoEmail').textContent=user.email;
  show('app');
  await loadAll(); renderNav(); render();
}
async function signOut(){ clearCreds(); await sb.auth.signOut(); show('auth'); document.getElementById('auPass').value=''; }

/* プラン3種・金額・プロテイン計算 */
const CATS=[['training','トレーニング'],['slimming','痩身'],['bust','バスト']];
const CATLABEL={training:'トレーニング',slimming:'痩身',bust:'バスト',protein:'プロテイン',beauty:'美容',goods:'美容',other:'その他'};
function catLabel(k){return CATLABEL[k]||k||'—';}
function custCats(c){return CATS.filter(([k])=>c['cat_'+k]).map(([k,l])=>l);}
function yen(n){return n==null?'—':'¥'+Math.round(n).toLocaleString('ja-JP');}
function totalSpend(cid){return custPayments(cid).reduce((s,p)=>s+(+p.amount||0),0);}
function addDays(dateStr,days){const d=new Date(dateStr);d.setDate(d.getDate()+Math.round(days));return d.toISOString().slice(0,10);}
/* 日付表示を 0000/00/00 に統一 */
function fmtYmd(d){if(!d)return '—';const t=new Date(d+'T00:00:00');return `${t.getFullYear()}/${String(t.getMonth()+1).padStart(2,'0')}/${String(t.getDate()).padStart(2,'0')}`;}
/* プロテイン既定：1袋500g / 1杯20g */
const PROTEIN_BAG_G=500, PROTEIN_SERVING_G=20;
function productById(id){return store.products.find(p=>p.id===id)||null;}
function proteinProducts(){return store.products.filter(p=>p.kind==='protein'&&p.active!==false);}
function otherProducts(){return store.products.filter(p=>p.kind!=='protein'&&p.active!==false);}
function proteinCalc(p){
  if(!p)return null;
  const prod=p.product_id?productById(p.product_id):null;
  const vol=(+p.volume_g)||(prod&&+prod.volume_g)||PROTEIN_BAG_G;
  const serv=(+p.serving_g)||(prod&&+prod.serving_g)||PROTEIN_SERVING_G;
  if(!vol||!serv)return null;
  const perDay=(+p.per_day)||1;
  const servings=Math.floor(vol/serv);                      // 総杯数
  const days=perDay>0?servings/perDay:0;                    // もつ日数
  const runOut=addDays(p.purchase_date,days);               // 使い切り予定日＝次回購入目安
  const left=Math.ceil((new Date(runOut)-new Date(today()))/86400000);
  return {servings,days:Math.round(days),runOut,left,vol,serv};
}

function currentPlanPrice(c,cat){const h=planHistory(c.id,cat);return h.length?+h[0].price:(c['price_'+cat]!=null?+c['price_'+cat]:null);}

/* ================= CHART ================= */
function drawChart(cid,metric){
  const canvas=document.getElementById('chart');if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,W=canvas.clientWidth||720,H=280;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.height=H+'px';ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const meta=METRICS.find(m=>m[0]===metric);
  const data=custMeasures(cid).filter(m=>m[metric]!=null).map(m=>({x:m.date,y:+m[metric]}));
  const pad={l:46,r:20,t:20,b:34},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  ctx.font='12px sans-serif';
  if(!data.length){ctx.fillStyle='#ad8d84';ctx.textAlign='center';ctx.fillText('データがありません',W/2,H/2);return;}
  const ys=data.map(d=>d.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const p=(mx-mn)*.15;mn-=p;mx+=p;
  const X=i=>data.length===1?pad.l+cw/2:pad.l+cw*i/(data.length-1),Y=v=>pad.t+ch*(1-(v-mn)/(mx-mn));
  ctx.strokeStyle='#f1ded7';ctx.fillStyle='#d8b8ac';ctx.textAlign='right';ctx.font='11px sans-serif';
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,y=Y(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillText(v.toFixed(1),pad.l-8,y+4);}
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);grad.addColorStop(0,'rgba(244,122,104,.28)');grad.addColorStop(1,'rgba(244,122,104,0)');
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0].y));data.forEach((d,i)=>ctx.lineTo(X(i),Y(d.y)));ctx.lineTo(X(data.length-1),pad.t+ch);ctx.lineTo(X(0),pad.t+ch);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#e05e4b';ctx.lineWidth=2.5;ctx.lineJoin='round';data.forEach((d,i)=>i===0?ctx.moveTo(X(i),Y(d.y)):ctx.lineTo(X(i),Y(d.y)));ctx.stroke();
  ctx.textAlign='center';data.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.y),4,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#e05e4b';ctx.stroke();
    ctx.fillStyle='#5a423c';ctx.font='bold 11px sans-serif';ctx.fillText(d.y,X(i),Y(d.y)-12);
    ctx.fillStyle='#d8b8ac';ctx.font='10px sans-serif';const dd=new Date(d.x);ctx.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,X(i),pad.t+ch+18);});
  ctx.fillStyle='#ad8d84';ctx.textAlign='left';ctx.font='12px sans-serif';ctx.fillText(`${meta[1]} (${meta[2]})`,pad.l,14);
}

function buildCalendar(ym){
  const [y,m]=ym.split('-').map(Number);
  const startDow=new Date(y,m-1,1).getDay();
  const daysIn=new Date(y,m,0).getDate();
  const cells=Math.ceil((startDow+daysIn)/7)*7;
  const cmap=Object.fromEntries(store.customers.map(c=>[c.id,c]));
  const bdMap={};
  store.customers.forEach(c=>{if(c.birthday){const k=c.birthday.slice(5,10);(bdMap[k]=bdMap[k]||[]).push(c);}});
  const td=today();
  const dow=['日','月','火','水','木','金','土'];
  let html='<div class="cal-grid">'+dow.map((d,i)=>`<div class="cal-dow" style="color:${i===0?'#d9776a':i===6?'#7a93c4':'var(--sub)'}">${d}</div>`).join('');
  for(let i=0;i<cells;i++){
    const dayNum=i-startDow+1, inMonth=dayNum>=1&&dayNum<=daysIn;
    const ds=inMonth?`${y}-${String(m).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`:'';
    const bds=inMonth?(bdMap[ds.slice(5,10)]||[]):[];
    const bdChips=bds.map(c=>`<span class="rv bd" title="${esc(c.name)} 誕生日" onclick="event.stopPropagation();openCustomer('${c.id}')"><span class="rv-t">誕生日</span><span class="rv-n">${esc(c.name)}</span></span>`).join('');
    const rvs=inMonth?store.reservations.filter(r=>r.date===ds&&r.status!=='cancelled').sort((a,b)=>(a.time||'').localeCompare(b.time||'')):[];
    const chips=rvs.slice(0,3).map(r=>{const c=cmap[r.customer_id];return `<span class="rv" style="background:${catColorSoft(r.category)}" title="${r.time||''} ${c?esc(c.name):''}" onclick="event.stopPropagation();openReservationForm('${ds}','${r.id}')">${r.time?`<span class="rv-t">${esc(r.time)}</span>`:''}<span class="rv-n">${c?esc(c.name):'予約'}</span></span>`}).join('');
    const more=rvs.length>3?`<span class="rv rv-more">＋${rvs.length-3}件</span>`:'';
    html+=`<div class="cal-cell ${inMonth?'':'other'} ${ds===td?'today':''}" ${inMonth?`onclick="openReservationForm('${ds}')"`:''}>
      ${inMonth?`<span class="dnum">${dayNum}</span>`:''}${bdChips}${chips}${more}</div>`;
  }
  return html+'</div>';
}
function calNav(d){let [y,m]=ui.calMonth.split('-').map(Number);m+=d;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}ui.calMonth=`${y}-${String(m).padStart(2,'0')}`;render();}

async function saveReservation(id){
  const cid=document.getElementById('rv_cust').value;

    category:document.getElementById('rv_category').value||null,
    duration:parseInt(document.getElementById('rv_duration').value)||null,
    note:document.getElementById('rv_note').value.trim()||null};
  const btn=document.getElementById('rvbtn');btn.disabled=true;btn.textContent='保存中…';
  let error;
  if(id){({error}=await sb.from('reservations').update(row).eq('id',id));}

function drawSalesBar(){
  const canvas=document.getElementById('salesChart');if(!canvas)return;
  const ctx=canvas.getContext('2d'),dpr=window.devicePixelRatio||1,W=canvas.clientWidth||720,H=240;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.height=H+'px';ctx.scale(dpr,dpr);ctx.clearRect(0,0,W,H);
  const data=salesChartData,pad={l:58,r:12,t:18,b:30},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  ctx.font='11px sans-serif';
  if(!data.length){ctx.fillStyle='#ad8d84';ctx.textAlign='center';ctx.fillText('データがありません',W/2,H/2);return;}
  const mx=Math.max(...data.map(d=>d.value),1);
  ctx.strokeStyle='#f1ded7';ctx.fillStyle='#ad8d84';ctx.textAlign='right';
  for(let g=0;g<=4;g++){const v=mx*g/4,y=pad.t+ch*(1-g/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillText('¥'+shortYen(v),pad.l-6,y+4);}
  const n=data.length,gap=cw/n,bw=Math.min(46,gap*0.62);
  data.forEach((d,i)=>{
    const x=pad.l+gap*i+(gap-bw)/2,bh=ch*(d.value/mx),y=pad.t+ch-bh,r=Math.min(5,bw/2);
    ctx.fillStyle='#f47a68';ctx.beginPath();ctx.moveTo(x,y+bh);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.lineTo(x+bw-r,y);ctx.arcTo(x+bw,y,x+bw,y+r,r);ctx.lineTo(x+bw,y+bh);ctx.closePath();ctx.fill();
    if(d.value>0){ctx.fillStyle='#5a423c';ctx.textAlign='center';ctx.font='bold 10px sans-serif';ctx.fillText(shortYen(d.value),x+bw/2,y-4);}
    ctx.fillStyle='#ad8d84';ctx.textAlign='center';ctx.font='10px sans-serif';ctx.fillText(d.label,x+bw/2,pad.t+ch+16);
  });
}

async function saveCustomer(id){
  const c0=id?store.customers.find(x=>x.id===id):null;
  const g=k=>document.getElementById('f_'+k).value.trim();
  const chk=k=>document.getElementById('f_cat_'+k).checked;
  const price=k=>{const v=document.getElementById('f_price_'+k).value;return v===''?null:parseFloat(v);};
  const name=g('name');if(!name){toast('お名前を入力してください');return;}
  const row={name,kana:g('kana')||null,email:g('email')||null,phone:g('phone')||null,birthday:g('birthday')||null,
    address:g('address')||null,gender:g('gender')||null,joined:g('joined')||null,goal:g('goal')||null,notes:g('notes')||null,
    cat_training:chk('training'),cat_slimming:chk('slimming'),cat_bust:chk('bust'),
    price_training:price('training'),price_slimming:price('slimming'),price_bust:price('bust')};
  const btn=document.getElementById('cbtn');btn.disabled=true;btn.textContent='保存中…';
  let error,cid=id;
  if(id){({error}=await sb.from('customers').update(row).eq('id',id));}
  else{row.owner_id=meUser.id;const r=await sb.from('customers').insert(row).select('id').single();error=r.error;cid=r.data&&r.data.id;}
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  /* 料金は上書きせず、変更があれば履歴として追加 */
  if(cid){
    const hist=[];
    for(const [k] of CATS){
      const np=price(k);
      if(np==null||!chk(k))continue;
      const cur=id?(planHistory(id,k)[0]?+planHistory(id,k)[0].price:(c0&&c0['price_'+k]!=null?+c0['price_'+k]:null)):null;
      if(cur===null||+cur!==+np) hist.push({customer_id:cid,category:k,price:np,effective_date:today()});
    }
    if(hist.length){const {error:e2}=await sb.from('plan_prices').insert(hist);if(e2)toast('料金履歴の保存に失敗: '+e2.message);}
  }
  await loadAll();closeModal();toast(id?'更新しました':'登録しました');render();
}

function payLineChange(i,field,val){
  const L=payLines[i];if(!L)return;
  if(field==='product'){const p=productById(val);if(p){L.product_id=p.id;L.name=p.name;L.price=+p.price||0;L.kind=p.kind||'other';}}
  else if(field==='qty') L.qty=Math.max(1,parseInt(val)||1);
  else if(field==='price') L.price=parseFloat(val)||0;
  payRenderLines();
}
function payDelLine(i){payLines.splice(i,1);payRenderLines();}
function payRenderLines(){
  const box=document.getElementById('p_lines');if(!box)return;
  const list=store.products.filter(p=>p.active!==false);
  box.innerHTML=payLines.length?payLines.map((L,i)=>`<div class="pay-line slide-in">
    <select onchange="payLineChange(${i},'product',this.value)">
      ${list.map(p=>`<option value="${p.id}" ${L.product_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <div class="unit-in" style="width:96px"><input type="number" value="${L.price}" oninput="payLineChange(${i},'price',this.value)"><span class="u">円</span></div>
    <div class="unit-in" style="width:74px"><input type="number" min="1" value="${L.qty}" oninput="payLineChange(${i},'qty',this.value)"><span class="u">個</span></div>
    <button class="linedel" onclick="payDelLine(${i})" title="削除">×</button></div>`).join('')
    :`<p class="muted" style="font-size:12px">商品の購入がある場合は「＋ 商品を追加」を押してください。</p>`;
  payRecalc();
}
function payCalcTotal(){
  const base=parseFloat(document.getElementById('p_amount').value)||0;
  const items=payLines.reduce((s,L)=>s+(+L.price||0)*(+L.qty||1),0);
  const sub=base+items;
  const t=document.getElementById('p_disctype').value;
  const v=parseFloat(document.getElementById('p_discval').value)||0;
  let adj=0;
  if(t==='minus')adj=-v; else if(t==='plus')adj=v;
  else if(t==='minus_pct')adj=-sub*v/100; else if(t==='plus_pct')adj=sub*v/100;
  return {base,items,sub,adj,total:Math.round(sub+adj)};
}
function payRecalc(){
  const el=document.getElementById('p_total');if(!el)return;
  const {base,items,sub,adj,total}=payCalcTotal();
  el.innerHTML=`基本 <b>${yen(base)}</b>${items?` ＋ 商品 <b>${yen(items)}</b>`:''}${adj?` ${adj<0?'−':'＋'} 調整 <b>${yen(Math.abs(adj))}</b>`:''}
    　→　合計 <b style="font-size:17px;color:var(--accent-d)">${yen(total)}</b>`;
}
async function savePayment(cid){
  const date=document.getElementById('p_date').value;
  const {total}=payCalcTotal();
  if(!date){toast('会計日を入力してください');return;}
  if(!total&&!payLines.length){toast('金額を入力してください');return;}
  const dt=document.getElementById('p_disctype').value;
  const row={customer_id:cid,date,amount:total,category:document.getElementById('p_category').value||null,
    items:payLines.length?payLines:null,discount_type:dt||null,
    discount_value:dt?(parseFloat(document.getElementById('p_discval').value)||0):null,
    note:document.getElementById('p_note').value.trim()||null};
  const btn=document.getElementById('pbtn');btn.disabled=true;btn.textContent='保存中…';
  const {error}=await sb.from('payments').insert(row);
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  await loadAll();closeModal();toast('会計を記録しました');render();
}
async function delPayment(id){if(!confirm('この会計記録を削除しますか？'))return;
  const {error}=await sb.from('payments').delete().eq('id',id);if(error){toast('エラー: '+error.message);return;}
  await loadAll();toast('削除しました');render();}

/* ---- 商品マスタ（products） ---- */
function openProductForm(id){
  const p=id?store.products.find(x=>x.id===id):null;
  modal(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-h"><h3>${p?'商品を編集':'商品を追加'}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form-grid">
      <div class="fld full"><label>商品名 *</label><input id="pd_name" value="${p?esc(p.name):''}" placeholder="例: プロテイン / 美容ドリンク"></div>
      <div class="fld"><label>種別 *</label><select id="pd_kind" onchange="pdKindChange()">
        <option value="other" ${p&&p.kind!=='protein'?'selected':''}>その他の商品</option>
        <option value="protein" ${p&&p.kind==='protein'?'selected':''}>プロテイン</option></select></div>
      <div class="fld"><label>金額 *</label><div class="unit-in"><input id="pd_price" type="number" inputmode="numeric" value="${p?(p.price??''):''}" placeholder="0"><span class="u">円</span></div></div>
      <div class="fld" id="pd_volwrap"><label>1袋の内容量</label><div class="unit-in"><input id="pd_volume" type="number" value="${p&&p.volume_g!=null?p.volume_g:PROTEIN_BAG_G}"><span class="u">g</span></div></div>
      <div class="fld" id="pd_servwrap"><label>1杯に使う量</label><div class="unit-in"><input id="pd_serving" type="number" value="${p&&p.serving_g!=null?p.serving_g:PROTEIN_SERVING_G}"><span class="u">g</span></div></div>
      <div class="fld full"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="pd_active" ${!p||p.active!==false?'checked':''} style="width:18px;height:18px;accent-color:var(--accent)"> 販売中（チェックを外すと選択肢に出ません）</label></div>
    </div></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn" id="pdbtn" onclick="saveProduct('${id||''}')">${p?'更新する':'追加する'}</button></div></div></div>`);
  pdKindChange();
  setTimeout(()=>document.getElementById('pd_name').focus(),50);
}
function pdKindChange(){
  const isP=document.getElementById('pd_kind').value==='protein';
  document.getElementById('pd_volwrap').style.display=isP?'':'none';
  document.getElementById('pd_servwrap').style.display=isP?'':'none';
}
async function saveProduct(id){
  const name=document.getElementById('pd_name').value.trim();
  const price=parseFloat(document.getElementById('pd_price').value);
  const kind=document.getElementById('pd_kind').value;
  if(!name||isNaN(price)){toast('商品名と金額を入力してください');return;}
  const row={name,price,kind,active:document.getElementById('pd_active').checked,
    volume_g:kind==='protein'?(parseFloat(document.getElementById('pd_volume').value)||PROTEIN_BAG_G):null,
    serving_g:kind==='protein'?(parseFloat(document.getElementById('pd_serving').value)||PROTEIN_SERVING_G):null};
  const btn=document.getElementById('pdbtn');btn.disabled=true;btn.textContent='保存中…';
  let error;
  if(id){({error}=await sb.from('products').update(row).eq('id',id));}
  else{({error}=await sb.from('products').insert(row));}
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  await loadAll();closeModal();toast(id?'更新しました':'追加しました');render();
}
async function delProduct(id){
  const p=store.products.find(x=>x.id===id);
  if(!confirm(`商品「${p.name}」を削除しますか？\n（過去の会計記録は残ります）`))return;
  const {error}=await sb.from('products').delete().eq('id',id);
  if(error){toast('エラー: '+error.message);return;}
  await loadAll();toast('削除しました');render();
}

/* ---- プロテイン（proteins） ---- */
function openProteinForm(cid){
  const c=store.customers.find(x=>x.id===cid);
  const list=proteinProducts();
  if(!list.length){toast('先に設定画面でプロテイン商品を登録してください');return;}
  modal(`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-h"><h3>プロテイン購入を記録 — ${esc(c.name)}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form-grid">
      <div class="fld full"><label>商品 *</label><select id="pr_product" onchange="prProdInfo()">
        ${list.map(p=>`<option value="${p.id}">${esc(p.name)}（${yen(p.price)}）</option>`).join('')}</select></div>
      <div class="fld"><label>購入日 *</label><input id="pr_date" type="date" value="${today()}"></div>
      <div class="fld"><label>1日の杯数 *</label><div class="unit-in"><input id="pr_perday" type="number" step="0.5" inputmode="decimal" value="1" oninput="prProdInfo()"><span class="u">杯</span></div></div>
      <div class="fld full"><label>メモ</label><input id="pr_note" placeholder="味・備考など"></div></div>
      <div class="note-inline" id="pr_info" style="margin:12px 0 0"></div></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">キャンセル</button>
      <button class="btn" id="prbtn" onclick="saveProtein('${cid}')">記録する</button></div></div></div>`);
  prProdInfo();
}
function prProdInfo(){
  const el=document.getElementById('pr_info');if(!el)return;
  const p=productById(document.getElementById('pr_product').value);
  const vol=(p&&+p.volume_g)||PROTEIN_BAG_G, serv=(p&&+p.serving_g)||PROTEIN_SERVING_G;
  const perday=parseFloat(document.getElementById('pr_perday').value)||1;
  const servings=Math.floor(vol/serv), days=Math.round(servings/perday);
  const date=document.getElementById('pr_date').value||today();
  el.innerHTML=`1袋 <b>${vol}g</b> ／ 1杯 <b>${serv}g</b> → 約 <b>${servings}杯</b>・<b>${days}日分</b>　次回購入の目安：<b>${fmtYmd(addDays(date,servings/perday))}</b> 頃`;
}
async function saveProtein(cid){
  const date=document.getElementById('pr_date').value;
  const pid=document.getElementById('pr_product').value;
  const perday=parseFloat(document.getElementById('pr_perday').value)||1;
  const p=productById(pid);
  if(!date||!pid){toast('商品と購入日を選択してください');return;}
  const row={customer_id:cid,purchase_date:date,product_id:pid,
    volume_g:(p&&+p.volume_g)||PROTEIN_BAG_G, serving_g:(p&&+p.serving_g)||PROTEIN_SERVING_G,
    per_day:perday,note:document.getElementById('pr_note').value.trim()||null};
  const btn=document.getElementById('prbtn');btn.disabled=true;btn.textContent='保存中…';
  const {error}=await sb.from('proteins').insert(row);
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  await loadAll();closeModal();toast('プロテインを記録しました');render();
}
async function delProtein(id){if(!confirm('このプロテイン記録を削除しますか？'))return;
  const {error}=await sb.from('proteins').delete().eq('id',id);if(error){toast('エラー: '+error.message);return;}
  await loadAll();toast('削除しました');render();}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
boot();
</script>
