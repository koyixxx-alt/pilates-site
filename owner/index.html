<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f3f1">
<title>Pilates Studio — お店側</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="店舗管理">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     デザイントークン（色・文字・余白・角丸・影・動き）
     ========================================================= */
  :root{
    color-scheme:light;
    /* 色：文字はすべて背景に対して 4.5:1 以上 */
    --bg:#f8f3f1;--paper:#fff;--tile:#fcf7f6;--pill:#f4ebe8;
    --ink:#4a3936;--ink2:#665350;--sub:#7f6a65;--faint:#c5b4af;
    --line:#ece0dc;--line2:#f4ebe8;
    --accent:#e8a3a0;--accent-h:#e09793;--accent-soft:#fbeeec;--accent-ink:#4a3936;--accent-d:#9c5551;--on-dark:#fff;--hover:#fdf8f7;--off:#faf6f5;--ph:#b8a7a2;
    --up:#3f7a5e;--down:#a5504a;--danger:#b0443c;
    /* 文字 */
    --font:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;
    --fs-xs:11.5px;--fs-sm:12.5px;--fs-md:14px;--fs-lg:15.5px;--fs-xl:18px;--fs-2xl:22px;--fs-3xl:26px;
    /* 余白（4の倍数） */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;
    /* 角丸 */
    --r-sm:10px;--r-md:14px;--r:16px;--r-lg:20px;--r-pill:999px;
    /* 影 */
    --shadow:0 1px 2px rgba(110,70,60,.05),0 10px 28px -18px rgba(140,85,75,.24);
    --shadow-2:0 2px 8px rgba(110,70,60,.06),0 28px 70px -24px rgba(90,50,40,.38);
    /* 動き */
    --ease:cubic-bezier(.22,.9,.3,1);--ease-out:cubic-bezier(.16,1,.3,1);
    --t-fast:.14s;--t-med:.26s;--t-slow:.6s;
  }

  /* ---------- 基本 ---------- */
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;font-size:var(--fs-md);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
  h1,h2,h3,.logo,.nm{font-feature-settings:"palt";text-wrap:balance}
  p,.note,.empty{text-wrap:pretty}
  button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input,select,textarea{font:inherit;font-size:15px;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-d)!important;box-shadow:0 0 0 3px var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent-d);outline-offset:2px}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
  ::placeholder{color:var(--ph);opacity:1}
  ::selection{background:var(--accent-soft)}
  .hidden{display:none!important}
  .muted{color:var(--sub)}

  /* ---------- ログイン・初期設定 ---------- */
  .cover{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--s6)}
  .cover-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:42px 32px 34px;animation:rise var(--t-slow) var(--ease-out) both}
  .cover-card .logo{font-size:var(--fs-3xl);font-weight:700;letter-spacing:.06em;text-align:center}
  .cover-card .cap{font-size:10px;letter-spacing:.32em;color:var(--sub);text-align:center;margin:var(--s2) 0 30px}
  .field{margin-bottom:var(--s4)}
  .field label,.fld label{display:block;font-size:var(--fs-sm);color:var(--sub);margin-bottom:6px;letter-spacing:.04em}
  .field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
  .check{display:flex;align-items:center;gap:var(--s2);font-size:13px;color:var(--ink2);cursor:pointer;margin:4px 0 var(--s4)}
  .check input{width:18px;height:18px;accent-color:var(--accent-d)}
  .btn-block{width:100%;min-height:48px;padding:13px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;letter-spacing:.08em;
    transition:background var(--t-fast),transform var(--t-fast) var(--ease)}
  .btn-block:active{transform:scale(.98)}
  .btn-block:disabled{opacity:.6;cursor:default;transform:none}
  .err{color:var(--danger);font-size:13px;margin-top:var(--s3);min-height:18px;text-align:center}

  /* 読み込み中 */
  .loading{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--sub);font-size:13px;letter-spacing:.08em}
  .loading .bar{width:120px;height:2px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
  .loading .bar::after{content:'';position:absolute;inset:0;width:40%;background:var(--accent);border-radius:2px;animation:slide 1.1s var(--ease) infinite}

  /* ---------- 骨組み ---------- */
  #app{display:none}
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;max-width:1320px;margin:0 auto}
  .side{position:sticky;top:0;height:100vh;padding:34px 18px 26px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .brand{padding:0 var(--s3)}
  .brand .logo{font-size:var(--fs-2xl);font-weight:700;letter-spacing:.06em;line-height:1.25;word-break:break-word}
  .brand .cap{font-size:10px;letter-spacing:.32em;color:var(--sub);margin-top:var(--s2)}
  .demo-badge{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .nav{margin-top:var(--s8);display:flex;flex-direction:column;gap:2px}
  .nav button{position:relative;text-align:left;font-size:15px;color:var(--ink2);padding:11px var(--s4);border-radius:var(--r-pill);letter-spacing:.06em;
    transition:background var(--t-fast),color var(--t-fast),transform var(--t-fast) var(--ease)}
  .nav button:active{transform:scale(.98)}
  .nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .nav .sep{height:1px;background:var(--line);margin:10px var(--s4)}
  .acct{margin-top:auto;padding:0 var(--s3);font-size:var(--fs-sm);color:var(--sub);line-height:1.8;word-break:break-all}
  .acct button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:var(--fs-sm)}
  .main{padding:36px 44px 80px;min-width:0}
  .mtop{display:none}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:var(--s6);flex-wrap:wrap}
  .eyebrow{font-size:var(--fs-sm);color:var(--sub);letter-spacing:.12em;margin-bottom:4px}
  h1{font-size:var(--fs-3xl);font-weight:700;letter-spacing:.08em;line-height:1.3}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ---------- ボタン・部品 ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;font-size:13px;font-weight:700;border-radius:var(--r-pill);padding:9px 20px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);letter-spacing:.04em;white-space:nowrap;text-decoration:none;
    transition:transform var(--t-fast) var(--ease),background var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.sm{min-height:34px;padding:6px 14px;font-size:var(--fs-sm)}
  .btn.danger{color:var(--danger)}
  .btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--on-dark)}
  .btn:disabled{opacity:.55;cursor:default;transform:none}
  .link{display:inline-block;padding:10px 6px;margin:-10px -6px;font-size:var(--fs-sm);color:var(--sub);white-space:nowrap;transition:color var(--t-fast)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:22px;min-width:0}
  .ch{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:14px;flex-wrap:wrap}
  .ch h2{font-size:15px;font-weight:700;letter-spacing:.06em}
  .ch h2 span{font-weight:400;color:var(--sub);font-size:var(--fs-sm);margin-left:var(--s2);letter-spacing:.02em}
  .golden{display:grid;grid-template-columns:minmax(0,1.618fr) minmax(0,1fr);gap:22px;align-items:start}
  .empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:13.5px;line-height:1.9}
  .tag{display:inline-block;font-size:var(--fs-xs);padding:2px 9px;border-radius:var(--r-pill);background:var(--accent-soft);color:var(--accent-d);font-weight:700;white-space:nowrap;vertical-align:1px}
  .tag.gray{background:var(--pill);color:var(--ink2)}
  .tags{display:inline-flex;gap:4px;flex-wrap:wrap}
  .note{background:var(--tile);border:1px solid var(--line2);border-radius:var(--r-sm);padding:var(--s3) 14px;font-size:13px;color:var(--ink2);line-height:1.85}
  .note b{color:var(--ink)}
  .banner{background:var(--accent-soft);color:var(--accent-d);border-radius:var(--r-sm);padding:var(--s3) var(--s4);font-size:13px;margin-bottom:18px;line-height:1.8}
  .seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-pill);padding:4px;gap:2px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{font-size:13.5px;color:var(--ink2);padding:9px 18px;border-radius:var(--r-pill);white-space:nowrap;letter-spacing:.04em;transition:background var(--t-med) var(--ease),color var(--t-fast)}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .seg.sm button{padding:6px 14px;font-size:var(--fs-sm)}
  .seg.kinds button{padding:11px 22px;font-size:14.5px}
  .navbadge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:var(--r-pill);background:var(--danger);color:var(--on-dark);font-size:10.5px;font-weight:700;text-align:center;padding:0 5px;margin-left:6px;vertical-align:1px;animation:pop var(--t-med) var(--ease-out) both}
  .notice-list{list-style:none}
  .notice-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:10px 0;border-top:1px solid var(--line2);font-size:var(--fs-md)}
  .notice-list li:first-child{border-top:0;padding-top:0}
  .notice-list .kind{font-size:var(--fs-xs);font-weight:700;padding:2px 9px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-ink);white-space:nowrap}
  .notice-list .kind.cx{background:var(--pill);color:var(--danger)}
  .qrbox{display:flex;gap:var(--s6);align-items:center;flex-wrap:wrap}
  .qrbox .qr{width:180px;height:180px;padding:var(--s3);background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
  .qrbox .qr img,.qrbox .qr svg{width:100%;height:100%;display:block}
  .daychips{display:flex;gap:6px;flex-wrap:wrap}
  .search{padding:10px var(--s4);border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);width:100%;max-width:300px;font-size:var(--fs-md);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
  select.plain{padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--paper);font-size:13px}

  /* 受付モード（お客様入力） */
  #kiosk{display:none;min-height:100vh;background:var(--bg)}
  .kiosk-wrap{max-width:640px;margin:0 auto;padding:34px var(--s5) 60px;animation:rise var(--t-slow) var(--ease-out) both}
  .kiosk-wrap .logo{font-size:var(--fs-2xl);font-weight:700;letter-spacing:.06em;text-align:center}
  .kiosk-wrap .cap{font-size:10px;letter-spacing:.32em;color:var(--sub);text-align:center;margin:var(--s2) 0 var(--s6)}
  .kiosk-wrap .fld input,.kiosk-wrap .fld select,.kiosk-wrap .fld textarea{font-size:16px;padding:13px 14px}
  .req{color:var(--danger);font-size:var(--fs-xs);margin-left:4px}

  /* ---------- 表 ---------- */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .pbar td:first-child i{display:block;height:3px;border-radius:2px;background:var(--accent);width:var(--w);max-width:100%;margin-top:6px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{font-size:var(--fs-xs);color:var(--sub);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em}
  .tbl td{padding:var(--s3) 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl .r{text-align:right;white-space:nowrap}
  .tbl .nw{white-space:nowrap}
  .tbl td.b{font-weight:700}
  .tbl tbody tr.click{cursor:pointer;transition:background var(--t-fast)}
  .tbl tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;padding-top:var(--s3)}
  .tbl tr.void td{color:var(--faint)}
  .tbl tr.void td.amt{text-decoration:line-through}
  .up{color:var(--up);font-weight:700}.dn{color:var(--down);font-weight:700}

  /* ---------- ホーム ---------- */
  .count4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
  .count4>div{background:var(--tile);border-radius:var(--r-md);padding:14px var(--s4)}
  .count4 .k{font-size:var(--fs-sm);color:var(--sub)}
  .count4 .v{font-size:28px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
  .count4 .v small{font-size:var(--fs-sm);color:var(--sub);font-weight:500;margin-left:3px}
  .count4 .tot{background:var(--accent)}
  .count4 .tot .k,.count4 .tot .v,.count4 .tot .v small{color:var(--accent-ink)}
  .today{list-style:none}
  .today li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}
  .today li:first-child{border-top:0;padding-top:2px}
  .today .t{font-size:17px;font-weight:700}
  .today .n{font-size:15px;font-weight:700;cursor:pointer;transition:color var(--t-fast)}
  .today .p{font-size:var(--fs-sm);color:var(--sub);margin-top:2px}
  .today li.fin .t,.today li.fin .n{color:var(--sub);font-weight:500}
  .flow{display:flex;align-items:center;gap:3px}
  .flow .arr{color:var(--sub);font-size:var(--fs-xs)}
  .step{min-height:34px;font-size:var(--fs-sm);font-weight:700;border-radius:var(--r-pill);padding:6px 13px;border:1px solid var(--line);color:var(--ink2);background:var(--paper);white-space:nowrap;
    transition:transform var(--t-fast) var(--ease),background var(--t-fast),border-color var(--t-fast)}
  .step:active{transform:scale(.96)}
  .step.done{background:var(--pill);border-color:transparent;color:var(--ink2);font-weight:500}
  .step.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .upc{list-style:none}
  .upc li{display:grid;grid-template-columns:104px 50px minmax(0,1fr) auto;gap:var(--s3);padding:11px 0;border-top:1px solid var(--line2);font-size:13.5px;align-items:center;cursor:pointer}
  .upc li:first-child{border-top:0;padding-top:0}
  .upc .pl{font-size:var(--fs-sm);color:var(--sub)}
  .nums{list-style:none}
  .nums li{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line2);font-size:var(--fs-md)}
  .nums li:first-child{border-top:0;padding-top:0}
  .nums li b{font-size:var(--fs-lg);font-weight:700}
  .nums li.total{background:var(--accent);color:var(--accent-ink);border-radius:var(--r-sm);padding:11px 14px;margin-top:10px;border:0}
  .nums li.total b{font-size:20px}
  .cmp{font-size:var(--fs-sm);color:var(--sub);text-align:right;margin-top:var(--s2)}
  .soon{list-style:none}
  .soon li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s4);align-items:center;padding:11px 0;border-top:1px solid var(--line2);font-size:var(--fs-md);cursor:pointer}
  .soon li:first-child{border-top:0;padding-top:0}
  .soon em{font-style:normal;font-size:var(--fs-sm);color:var(--sub)}
  .hot{color:var(--danger);font-weight:700}

  /* ---------- 売上 ---------- */
  .kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:22px}
  .kgrid .card{margin:0}
  .kgrid .k{font-size:var(--fs-sm);color:var(--sub);letter-spacing:.04em}
  .kgrid .v{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
  .kgrid .d{font-size:var(--fs-sm);color:var(--sub);margin-top:4px}
  .legend{display:flex;gap:var(--s4);font-size:var(--fs-sm);color:var(--sub);align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:-1px}
  .legend i.l{background:none;border-top:2px solid var(--ink2);height:0;border-radius:0;vertical-align:3px}
  .chart-wrap{position:relative;width:100%}
  canvas{display:block;width:100%}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--on-dark);font-size:var(--fs-sm);padding:7px 10px;border-radius:var(--r-sm);white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity var(--t-fast);line-height:1.6}
  .periodnav{display:flex;align-items:center;gap:var(--s2)}
  .periodnav b{font-size:var(--fs-md);min-width:96px;text-align:center}

  /* ---------- カレンダー ---------- */
  .cal-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:14px;flex-wrap:wrap}
  .cal-head h2{font-size:var(--fs-xl);min-width:110px;text-align:center;letter-spacing:.04em}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--line);gap:1px}
  .cal-dow{background:var(--tile);text-align:center;padding:var(--s2) 0;font-size:var(--fs-sm);color:var(--sub)}
  .cal-cell{background:var(--paper);min-height:98px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background var(--t-fast)}
  .cal-cell.other{background:var(--off);cursor:default}
  .cal-cell .dn{font-size:var(--fs-sm);font-weight:700;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
  .cal-cell.today .dn{background:var(--accent);color:var(--accent-ink)}
  .rv{display:block;font-size:var(--fs-xs);padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform var(--t-fast) var(--ease)}
  .rv b{font-weight:700;margin-right:3px}
  .rv.bd{background:var(--paper);border:1px dashed var(--accent);color:var(--accent-d)}
  .rv.app{box-shadow:inset 3px 0 0 var(--accent)}
  .rv.blk{background:var(--pill);color:var(--ink2)}
  .rv.more{background:none;color:var(--sub)}
  .rv.moved{background:var(--paper);border:1px dashed var(--faint);color:var(--sub)}
  .rv.moved s{text-decoration-thickness:1px;text-decoration-color:var(--sub)}
  .rv em{font-style:normal;font-weight:700;color:var(--accent-d);margin-left:4px;letter-spacing:-.01em}
  .rv.chg em{margin:0 4px 0 0}
  .rv.chg{box-shadow:inset 3px 0 0 var(--accent-d)}
  .legend2 i.mv{background:var(--paper);border:1px dashed var(--faint)}
  .legend2{margin-top:var(--s3);display:flex;gap:18px;font-size:var(--fs-sm);color:var(--sub)}
  .legend2 span{display:inline-flex;align-items:center;gap:6px}
  .legend2 i{width:11px;height:11px;border-radius:3px;background:var(--accent-soft)}
  .legend2 i.bd{background:var(--paper);border:1px dashed var(--accent)}

  /* ---------- 顧客詳細 ---------- */
  .back{font-size:13px;color:var(--sub);margin-bottom:14px;display:inline-block;transition:color var(--t-fast),transform var(--t-fast) var(--ease)}
  .prof{display:flex;gap:var(--s4);align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .prof .nm{font-size:var(--fs-2xl);font-weight:700;letter-spacing:.04em}
  .prof .kn{color:var(--sub);font-size:13px}
  .meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s3);margin-top:var(--s4)}
  .meta .l{font-size:var(--fs-xs);color:var(--sub)}
  .meta .d{font-size:var(--fs-md);word-break:break-all}
  .mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-bottom:22px}
  .mini3>div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px var(--s4);box-shadow:var(--shadow)}
  .mini3 .k{font-size:var(--fs-sm);color:var(--sub)}
  .mini3 .v{font-size:var(--fs-2xl);font-weight:700}
  .mini3 .v small{font-size:var(--fs-sm);color:var(--sub);font-weight:500;margin-left:3px}
  .mini3 .d{font-size:var(--fs-sm)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s3)}
  .pills button{min-height:32px;padding:6px 13px;border-radius:var(--r-pill);background:var(--pill);font-size:var(--fs-sm);color:var(--ink2);transition:background var(--t-fast),color var(--t-fast)}
  .pills button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
  .stamps{display:inline-flex;gap:6px;align-items:center;vertical-align:middle}
  .stamps i{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--faint);display:grid;place-items:center;font-style:normal;font-size:var(--fs-xs);color:var(--sub)}
  .stamps i.on{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
  .tkt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
  .tkt{border:1px solid var(--line);border-radius:var(--r-md);padding:14px var(--s4)}
  .tkt.done{opacity:.6}
  .tkt-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:var(--fs-sm);flex-wrap:wrap}
  .tkt-h b{font-size:15px}
  .tkt-dots{display:flex;align-items:center;gap:6px;margin:10px 0 6px}
  .tkt-dots i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--accent)}
  .tkt-dots i.on{background:var(--accent)}
  .tkt-dots span{margin-left:auto;font-size:13px;color:var(--ink2)}
  .tkt-dots b{font-size:18px;color:var(--ink)}
  .tkt-exp{font-size:13px;color:var(--ink2)}
  .tkt-log{font-size:var(--fs-sm);color:var(--ink2);margin-top:6px}
  .tkt-log summary{cursor:pointer;color:var(--sub);min-height:28px;display:flex;align-items:center}
  .tkt-log div{padding:3px 0}
  .plancards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--s3)}
  .plancards>div{border:1px solid var(--line);border-radius:var(--r-md);padding:14px var(--s4)}
  .hist{font-size:var(--fs-sm);color:var(--sub);margin-top:6px}
  .hist div{display:flex;justify-content:space-between;padding:2px 0}

  /* ---------- モーダル・確認ダイアログ・フォーム ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(60,40,36,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50;padding:var(--s5);animation:fade var(--t-med) ease both}
  .modal{background:var(--paper);border-radius:var(--r-lg);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-2);animation:pop var(--t-med) var(--ease-out) both}
  .modal.wide{max-width:660px}
  #dialogRoot .modal-bg{z-index:70}
  #dialogRoot .modal{max-width:420px}
  #dialogRoot .modal-h h3{font-size:var(--fs-lg);line-height:1.6;text-wrap:pretty;word-break:auto-phrase}
  .modal-h{padding:var(--s5) var(--s6) 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .modal-h h3{font-size:var(--fs-xl);letter-spacing:.06em}
  .modal-h .x{font-size:22px;color:var(--sub);width:40px;height:40px;border-radius:50%;flex-shrink:0;transition:background var(--t-fast)}
  .modal-sub{padding:0 var(--s6);font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .modal-b{padding:10px var(--s6) 18px;overflow-y:auto;overscroll-behavior:contain}
  .modal-f{padding:14px var(--s6) var(--s5);display:flex;gap:10px;justify-content:flex-end;align-items:center;border-top:1px solid var(--line2);flex-wrap:wrap}
  .modal-f .grow{flex:1;font-size:var(--fs-sm);color:var(--sub)}
  .dlg-body{font-size:var(--fs-md);color:var(--ink2);line-height:1.85;white-space:pre-line}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form .full{grid-column:1/-1}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
  .fld textarea{resize:vertical;min-height:70px}
  .unit{position:relative}
  .unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:var(--fs-sm);pointer-events:none}
  .unit input{padding-right:34px}
  .sec{font-size:var(--fs-sm);color:var(--sub);letter-spacing:.1em;margin:18px 0 var(--s2)}
  .sec:first-child{margin-top:4px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{min-height:38px;font-size:13px;padding:8px 15px;border-radius:var(--r-pill);border:1px solid var(--line);color:var(--ink2);background:var(--paper);transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast) var(--ease)}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d);font-weight:700}
  .lines{list-style:none;border-top:1px solid var(--line2)}
  .lines li{display:grid;grid-template-columns:minmax(0,1fr) 62px 108px 32px;gap:var(--s2);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line2);font-size:var(--fs-md);animation:rise var(--t-med) var(--ease-out) both}
  .lines select,.lines input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);font-size:var(--fs-md)}
  .lines .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lines .x{color:var(--sub);font-size:18px;width:32px;height:32px;border-radius:50%;transition:background var(--t-fast),color var(--t-fast)}
  .addline{font-size:13px;color:var(--accent-d);font-weight:700;margin-top:10px;min-height:32px}
  .coupon-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);background:var(--accent-soft);border-radius:var(--r-sm);padding:var(--s3) var(--s4);margin-top:14px;font-size:13px;color:var(--accent-d)}
  .switch{position:relative;width:44px;height:26px;flex-shrink:0;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;border-radius:var(--r-pill);background:var(--faint);transition:background var(--t-med);cursor:pointer}
  .switch span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform var(--t-med) var(--ease-out)}
  .switch input:checked+span{background:var(--accent-d)}
  .switch input:checked+span::after{transform:translateX(18px)}
  .switch input:focus-visible+span{outline:2px solid var(--accent-d);outline-offset:2px}
  .adj{display:grid;grid-template-columns:1fr 140px;gap:var(--s2)}
  .adj select,.adj input{padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);font-size:var(--fs-md);width:100%}
  .sum{margin-top:var(--s4);border-top:1px solid var(--line);padding-top:10px}
  .sum div{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:3px 0}
  .sum .grand{font-size:15px;color:var(--ink);font-weight:700;padding-top:var(--s2);align-items:baseline}
  .sum .grand b{font-size:26px;color:var(--accent-d);letter-spacing:-.01em}
  /* 会計：メニューの箱・商品の選択 */
  .pbox{border:1px solid var(--line);border-radius:var(--r-md);padding:14px var(--s4);margin-top:10px;background:var(--tile);animation:rise var(--t-med) var(--ease-out) both}
  .pbox-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:var(--s2);font-size:var(--fs-sm)}
  .pbox-h b{font-size:15px}
  .pbox .note{background:var(--paper)}
  .plist{list-style:none;display:flex;flex-direction:column;gap:6px}
  .plist li{display:flex;align-items:center;gap:var(--s2);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 6px 4px 4px;transition:border-color var(--t-fast)}
  .plist li.on{border-color:var(--accent)}
  .plist .pick{flex:1;display:flex;align-items:center;gap:10px;min-height:42px;padding:6px 8px;text-align:left}
  .plist .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);flex-shrink:0;position:relative;transition:background var(--t-fast),border-color var(--t-fast)}
  .plist li.on .ck{background:var(--accent-d);border-color:var(--accent-d)}
  .plist li.on .ck::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .plist .pn{flex:1;font-size:var(--fs-md)}
  .plist .pp{font-size:13px;color:var(--ink2);font-weight:700}
  .qty{display:inline-flex;align-items:center;gap:2px;background:var(--pill);border-radius:var(--r-pill);padding:2px}
  .qty button{width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--ink2)}
  .qty b{min-width:22px;text-align:center}
  /* 会計：お客様に見せる確認画面 */
  .cf{padding:34px 30px 22px!important;text-align:left}
  .cf-studio{font-size:var(--fs-sm);letter-spacing:.24em;color:var(--sub);text-align:center}
  .cf-name{font-size:var(--fs-xl);font-weight:700;text-align:center;margin:6px 0 22px;letter-spacing:.04em}
  .cf-lines{list-style:none;border-top:1px solid var(--line)}
  .cf-lines li{display:flex;justify-content:space-between;gap:var(--s4);padding:13px 2px;border-bottom:1px solid var(--line2);font-size:var(--fs-lg)}
  .cf-lines li b{font-weight:700;white-space:nowrap}
  .cf-lines li.dc{color:var(--accent-d)}
  .cf-total{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);margin-top:18px;padding-top:var(--s4);border-top:2px solid var(--ink)}
  .cf-total span{font-size:var(--fs-lg);font-weight:700}
  .cf-total b{font-size:40px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .cf-method{text-align:right;color:var(--sub);font-size:13px;margin-top:6px}
  .cf-done{text-align:center}
  .cf-done .cf-total{flex-direction:column;align-items:center}
  .cf-check{width:64px;height:64px;border-radius:50%;background:var(--accent);margin:4px auto 6px;position:relative;animation:pop .5s var(--ease-out) both}
  .cf-check::after{content:'';position:absolute;left:24px;top:15px;width:14px;height:26px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
  .morelist button{display:block;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line2);font-size:15px}
  .copyrow{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
  .copyrow code{font-family:inherit;background:var(--tile);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;font-size:var(--fs-md);word-break:break-all}

  /* ---------- 通知 ---------- */
  .toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--on-dark);padding:var(--s3) 22px;border-radius:var(--r-pill);font-size:13.5px;z-index:90;
    transition:transform var(--t-med) var(--ease-out),opacity var(--t-med);max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow-2)}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .tabbar{display:none}

  /* ---------- マウスのある端末だけのホバー（スマホで色が残らないように） ---------- */
  @media (hover:hover){
    .btn:hover{background:var(--pill)}
    .btn.primary:hover,.btn-block:hover,.step.next:hover{background:var(--accent-h)}
    .nav button:not(.on):hover{background:var(--pill)}
    .link:hover{color:var(--ink)}
    .link.del:hover{color:var(--danger)}
    .step:not(.next):hover,.chip:hover{background:var(--pill)}
    .chip.on:hover{background:var(--accent-soft)}
    .tbl tbody tr.click:hover,.cal-cell:not(.other):hover{background:var(--hover)}
    .today .n:hover{color:var(--accent-d)}
    .rv:hover{transform:translateX(2px)}
    .back:hover{color:var(--ink);transform:translateX(-2px)}
    .modal-h .x:hover,.lines .x:hover{background:var(--pill)}
    .lines .x:hover{color:var(--danger)}
  }

  /* ---------- 動き ---------- */
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
  @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .main>*{animation:rise .42s var(--ease-out) both}
  .main>*:nth-child(2){animation-delay:.04s}.main>*:nth-child(3){animation-delay:.08s}
  .main>*:nth-child(4){animation-delay:.12s}.main>*:nth-child(n+5){animation-delay:.16s}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* ---------- 画面幅ごと ---------- */
  @media(max-width:1060px){ .golden{grid-template-columns:1fr} }
  @media(max-width:760px){
    .layout{grid-template-columns:1fr}
    .side{display:none}
    .mtop{display:flex;justify-content:space-between;align-items:center;padding:var(--s4) 18px 2px}
    .mtop .logo{font-size:19px;font-weight:700;letter-spacing:.06em}
    .mtop .d{display:none}
    .main{padding:10px 14px 112px}
    .head{margin-bottom:var(--s4)}
    h1{font-size:var(--fs-2xl)}
    .card{padding:var(--s4);margin-bottom:14px;border-radius:var(--r-md)}
    .count4{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
    .count4 .v{font-size:24px}
    .kgrid{grid-template-columns:1fr;gap:10px;margin-bottom:14px}
    .mini3{gap:var(--s2);margin-bottom:14px}
    .mini3>div{padding:10px var(--s3)}
    .mini3 .v{font-size:var(--fs-xl)}
    .today li{grid-template-columns:44px minmax(0,1fr);gap:10px}
    .today .flow{grid-column:2}
    .step{min-height:40px;padding:8px 14px}
    .chip{min-height:42px}
    .upc li{grid-template-columns:88px 44px minmax(0,1fr)}
    .upc .pl{display:none}
    .form{grid-template-columns:1fr}
    .modal-bg{align-items:flex-end;padding:0}
    .modal,.modal.wide,#dialogRoot .modal{max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:94vh;animation:sheet .34s var(--ease-out) both}
    .modal::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex-shrink:0}
    .modal-h,.modal-b,.modal-f,.modal-sub{padding-left:18px;padding-right:18px}
    .modal-h{padding-top:var(--s3)}
    .modal-f{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    .lines li{grid-template-columns:minmax(0,1fr) 52px 90px 30px;gap:6px}
    .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      border:1px solid var(--line);border-radius:var(--r-pill);padding:5px;z-index:40;box-shadow:var(--shadow-2)}
    .tabbar button{flex:1;font-size:var(--fs-sm);padding:11px 0;min-height:44px;border-radius:var(--r-pill);color:var(--ink2);transition:background var(--t-med) var(--ease),color var(--t-fast)}
    .tabbar button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
    .tbl{font-size:13px}
    .tbl td{padding:10px var(--s2)}
    .tbl th{padding:var(--s2)}
    .seg button{padding:8px 13px;font-size:var(--fs-sm)}
    .seg.kinds{display:flex;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
    .search{max-width:none}
    .cal-cell{min-height:58px;padding:3px}
    .rv{font-size:9.5px;padding:1px 3px}
    .rv .nm{display:none}
    .cal-dow{font-size:var(--fs-xs);padding:6px 0}
    .toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  }
  .pwbox{position:relative;display:block}
  .pwbox input{width:100%;padding-right:48px}
  .pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:var(--r-sm,10px);color:var(--sub);cursor:pointer}
  @media(hover:hover){.pweye:hover{color:var(--ink)}}
</style>
</head>
<body>

<div id="boot" class="loading" role="status"><div class="bar"></div><span id="bootMsg">読み込み中</span></div>

<!-- 初期設定（Supabase接続） -->
<div id="config" class="cover hidden">
  <div class="cover-card">
    <div class="logo">初期設定</div><div class="cap">SUPABASE CONNECTION</div>
    <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>anon public key</label><input id="cfgKey" placeholder="eyJhbGci..."></div>
    <button class="btn-block" onclick="saveConfig()">保存して開始</button>
    <div class="err" id="cfgErr"></div>
  </div>
</div>

<!-- ログイン -->
<!-- はじめての設定：お店のアカウント（ID＋パスワード）を作る。お店のアカウントがまだ無いときだけ表示 -->
<div id="setup" class="cover hidden">
  <div class="cover-card">
    <div class="logo">はじめての設定</div><div class="cap">CREATE ACCOUNT</div>
    <p class="muted" style="font-size:13px;margin:-8px 0 22px;text-align:center;line-height:1.85">お店のアカウントを作成します。<br>ここで決めた ID とパスワードで、次回からログインします。</p>
    <div class="field"><label>スタジオ名</label><input id="suName" placeholder="例：Noailles"></div>
    <div class="field"><label>ID（半角の英字・数字 3〜30文字）</label><input id="suId" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="例：noailles"></div>
    <div class="field"><label>パスワード（8文字以上）</label><input id="suPw1" type="password" autocomplete="new-password"></div>
    <div class="field"><label>パスワード（もう一度）</label><input id="suPw2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSetup()"></div>
    <button class="btn-block" id="suBtn" onclick="doSetup()">アカウントを作成して始める</button>
    <div class="err" id="suErr"></div>
    <p class="muted" style="font-size:11.5px;margin-top:6px;text-align:center;line-height:1.8">ID とパスワードは忘れないよう控えておいてください。</p>
  </div>
</div>

<div id="auth" class="cover hidden">
  <div class="cover-card">
    <div class="logo" id="authLogo">Pilates Studio</div><div class="cap">OWNER LOGIN</div>
    <div class="field"><label>ID</label><input id="auEmail" type="text" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>パスワード</label><input id="auPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doAuth()"></div>
    <label class="check"><input type="checkbox" id="auRemember" checked> この端末で次回から自動ログイン</label>
    <button class="btn-block" id="auBtn" onclick="doAuth()">ログイン</button>
    <div class="err" id="auErr"></div>
  </div>
</div>

/* ================= 共通の小道具 ================= */
const pad=n=>String(n).padStart(2,'0');
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function today(){return ymd(new Date());}   /* 端末の日付（日本時間）で判定 */
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+Math.round(n));return ymd(d);}
function addYears(s,n){const d=new Date(s+'T00:00:00');d.setFullYear(d.getFullYear()+n);return ymd(d);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function dowJp(s){return ['日','月','火','水','木','金','土'][new Date(s+'T00:00:00').getDay()];}
function fmtYmd(s){if(!s)return '—';const [y,m,d]=String(s).slice(0,10).split('-');return `${y}/${m}/${d}`;}
function fmtMd(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}（${dowJp(s)}）`;}
function jpDate(s){const d=new Date(s+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${dowJp(s)}）`;}
function ageOf(bd){if(!bd)return null;const b=new Date(bd+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a;}
function yen(n){return n==null||isNaN(n)?'—':'¥'+Math.round(n).toLocaleString('ja-JP');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function pct(a,b){return b?(a-b)/b*100:null;}
function pctHtml(v){if(v==null)return '<span class="muted">—</span>';return `<span class="${v>=0?'up':'dn'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(1)}%</span>`;}
function byTime(a,b){return (a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99'));}

/* ================= データの書き込み =================
   データベースがまだ更新前（SQL⑥未実行）でも動くよう、無い列は外して保存し直す */
async function dbWrite(table,op,row,id){
  const r=Object.assign({},row);
  for(let i=0;i<15;i++){
    const q=sb.from(table);
    const res= op==='insert'? await q.insert(r).select().single() : await q.update(r).eq('id',id);
    if(!res.error) return res;
    const msg=res.error.message||'';
    const m=/Could not find the '([^']+)' column/.exec(msg)||/column "?([a-z_]+)"? of relation/.exec(msg);
    if(m&&(m[1] in r)){delete r[m[1]];continue;}
    return res;
  }
  return {error:{message:'保存できませんでした'}};
}

const BIO_KEY='owner_bio';
function bioGet(){try{return JSON.parse(localStorage.getItem(BIO_KEY)||'null');}catch(e){return null;}}
function b64u(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function bioSupported(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function bioRegister(){
  const email=meUser.email;
  const cred=await navigator.credentials.create({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    rp:{name:studioName()+'（お店側）',id:location.hostname},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:email,displayName:email},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
    timeout:60000,attestation:'none'}});
  localStorage.setItem(BIO_KEY,JSON.stringify({id:b64u(cred.rawId),email}));
}
async function bioCheck(){
  const b=bioGet();if(!b)return false;
  const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
    allowCredentials:[{type:'public-key',id:unb64u(b.id),transports:['internal']}],userVerification:'required',timeout:60000}});
  return !!r;
}

/* 退会から3年を過ぎた方は自動で削除（会計は名前つきで残る） */
async function purgeExpired(){
  if(!store.migr6)return;
  const lim=addYears(today(),-3);
  const exp=store.customers.filter(c=>c.withdrawn_at&&String(c.withdrawn_at).slice(0,10)<lim);
  for(const c of exp){const {error}=await sb.from('customers').delete().eq('id',c.id);if(!error)store.customers=store.customers.filter(x=>x.id!==c.id);}
  if(exp.length)toast(`保管期限（3年）を過ぎた退会者 ${exp.length}名 を削除しました`);
}

function actives(){return store.customers.filter(c=>!c.withdrawn_at);}
function nextReservation(cid){const t=today();return store.reservations.filter(r=>r.customer_id===cid&&r.date>=t&&activeRv(r)).sort(byTime)[0]||null;}
function kanaKey(c){return toKata(((c.last_kana||'')+(c.first_kana||''))||c.kana||c.name||'');}
/* ひらがな→カタカナ、全角数字→半角 */
function toKata(s){return String(s||'').replace(/[ぁ-ゖ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));}
function toHalfNum(s){return String(s||'').replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));}
/* 姓・名を分けて持つ（古いデータは空白で分ける） */
function nameParts(c){
  if(c.last_name||c.first_name)return {ln:c.last_name||'',fn:c.first_name||'',lk:c.last_kana||'',fk:c.first_kana||''};
  const n=String(c.name||'').trim().split(/[\s　]+/),k=String(c.kana||'').trim().split(/[\s　]+/);
  return {ln:n[0]||'',fn:n.slice(1).join(' '),lk:toKata(k[0]||''),fk:toKata(k.slice(1).join(' '))};
}
/* 郵便番号から住所（番地の前まで）を調べる */
async function zipLookup(zip){
  zip=toHalfNum(zip).replace(/[^0-9]/g,'');if(zip.length!==7)return null;
  try{const r=await fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+zip);const j=await r.json();const a=j.results&&j.results[0];return a?a.address1+a.address2+a.address3:null;}catch(e){return null;}
}
async function zipFill(zipId,addrId){
  const z=document.getElementById(zipId),a=document.getElementById(addrId);if(!z||!a)return;
  const digits=toHalfNum(z.value).replace(/[^0-9]/g,'');
  if(digits.length!==7)return;
  z.value=digits.slice(0,3)+'-'+digits.slice(3);
  const addr=await zipLookup(digits);
  if(!addr){toast('郵便番号から住所が見つかりませんでした');return;}
  if(!a.value||a.dataset.auto===a.value||!a.value.startsWith(addr)){a.value=addr;a.dataset.auto=addr;}
  a.focus();a.setSelectionRange(a.value.length,a.value.length);
}
function custCats(c){return CATS.filter(([k])=>c['cat_'+k]).map(([k])=>k);}
function custMeasures(cid){return store.measurements.filter(m=>m.customer_id===cid).sort((a,b)=>a.date.localeCompare(b.date));}
function custSessions(cid){return store.sessions.filter(s=>s.customer_id===cid).sort((a,b)=>b.date.localeCompare(a.date));}
function livePays(){return store.payments.filter(p=>!p.voided_at);}
function custPays(cid){return store.payments.filter(p=>p.customer_id===cid).sort((a,b)=>(b.date+(b.created_at||'')).localeCompare(a.date+(a.created_at||'')));}
function totalSpend(cid){return livePays().filter(p=>p.customer_id===cid).reduce((s,p)=>s+(+p.amount||0),0);}
function payName(p){const c=custById(p.customer_id);return c?c.name:(p.customer_name||'（削除済み）');}
function productById(id){return store.products.find(p=>p.id===id)||null;}
function productKind(p){return p&&p.kind==='protein'?'protein':'beauty';}
function productsOf(kind){return store.products.filter(p=>p.active!==false&&productKind(p)===kind);}
function planHistory(cid,cat){return store.planPrices.filter(p=>p.customer_id===cid&&p.category===cat)
  .sort((a,b)=>(b.effective_date+(b.created_at||'')).localeCompare(a.effective_date+(a.created_at||'')));}
function currentPlanPrice(c,cat){const h=planHistory(c.id,cat);return h.length?+h[0].price:(c['price_'+cat]!=null?+c['price_'+cat]:null);}
function payItems(p){try{return Array.isArray(p.items)?p.items:(p.items?JSON.parse(p.items):[]);}catch(e){return [];}}
/* 会計の明細（旧形式の会計も同じ形にそろえる） */
function payLinesOf(p){
  const it=payItems(p).map(i=>({kind:['training','slimming','bust','protein','beauty','other'].includes(i.kind)?i.kind:'beauty',
    name:i.name||'',price:+i.price||0,qty:+i.qty||1,product_id:i.product_id||null}));
  if(p.subtotal!=null)return it;
  const itemsSum=it.reduce((s,l)=>s+l.price*l.qty,0);
  let sub=+p.amount||0;const v=+p.discount_value||0;
  if(p.discount_type==='minus')sub+=v;else if(p.discount_type==='plus')sub-=v;
  else if(p.discount_type==='minus_pct'&&v<100)sub=sub/(1-v/100);else if(p.discount_type==='plus_pct')sub=sub/(1+v/100);
  const base=Math.round(sub-itemsSum);
  if(base>0){const k=p.category==='goods'?'beauty':(p.category||'other');it.unshift({kind:k,name:catLabel(k),price:base,qty:1});}
  return it;
}
/* 会計の金額を種別ごとに配分（割引は按分） */
function payBreakdown(p){
  const L=payLinesOf(p);const sum=L.reduce((s,l)=>s+l.price*l.qty,0);const out={};
  if(!sum){const k=(p.categories&&p.categories[0])||p.category||'other';out[k==='goods'?'beauty':k]=+p.amount||0;return out;}
  const f=(+p.amount||0)/sum;L.forEach(l=>{out[l.kind]=(out[l.kind]||0)+l.price*l.qty*f;});return out;
}
function payKinds(p){const b=payBreakdown(p);return KINDS.map(k=>k[0]).concat(['other']).filter(k=>b[k]);}
function extraDiscounts(p){const d=Array.isArray(p.discounts)?p.discounts:[];return d.reduce((s,x)=>s+(+x.amount||0),0);}
function payDiscount(p){
  if(p.subtotal!=null)return (+p.coupon_discount||0)+extraDiscounts(p)+Math.max(0,-(+p.adjust_amount||0));
  const v=+p.discount_value||0;
  if(p.discount_type==='minus')return v;
  if(p.discount_type==='minus_pct'){const L=payLinesOf(p);return L.reduce((s,l)=>s+l.price*l.qty,0)*v/100;}
  return 0;
}
function sumAmt(ps){return ps.reduce((s,p)=>s+(+p.amount||0),0);}
function sumKinds(ps){const o={};ps.forEach(p=>{const b=payBreakdown(p);for(const k in b)o[k]=(o[k]||0)+b[k];});return o;}
function inRange(p,a,b){return p.date>=a&&p.date<=b;}
/* 今月の1日〜今日 と、先月の同じ期間 */
function monthToDate(){const t=today();return [t.slice(0,8)+'01',t];}
function prevMonthSame(){const d=new Date();const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const last=new Date(d.getFullYear(),d.getMonth(),0).getDate();return [ymd(pm),ymd(new Date(pm.getFullYear(),pm.getMonth(),Math.min(d.getDate(),last)))];}

/* ---- 商品スタンプ（プロテイン・美容を合計◯個買うごとに◯円券） ---- */
const PLAN_KEYS=['training','slimming','bust'];
function isProductLine(l){return !PLAN_KEYS.includes(l.kind)&&l.kind!=='other';}
function couponCfg(){return {every:Math.max(1,+S().coupon_every||3),amount:+S().coupon_amount||1000};}
function couponState(cid){
  const {every,amount}=couponCfg();
  const ps=livePays().filter(p=>p.customer_id===cid);
  const qty=ps.reduce((s,p)=>s+payLinesOf(p).filter(isProductLine).reduce((a,l)=>a+l.qty,0),0);
  const used=ps.reduce((s,p)=>s+(+p.coupons_used||0),0);
  const earned=Math.floor(qty/every);
  return {qty,stamps:qty%every,every,amount,earned,used,avail:Math.max(0,earned-used)};
}
/* ---- 料金の設定 ---- */
function priceCfg(){const s=S();return {slim:+s.slimming_price||8000,size:Math.max(1,+s.set_size||5),referral:+s.referral_amount||1000,birthday:+s.birthday_amount||1500};}
/* 加圧の1回料金はお客様ごと、痩身は全員一律 */
function unitPrice(c,plan){if(plan==='slimming')return priceCfg().slim;const p=c?currentPlanPrice(c,plan):null;return p||0;}

/* ---- 回数券（5回で1セット・加圧と痩身で共用） ---- */
function setLive(s){const v=voidedIds();return !(s.payment_id&&v.has(s.payment_id));}
function setUses(s){const v=voidedIds();return (store.ticketUses||[]).filter(u=>u.set_id===s.id&&!(u.payment_id&&v.has(u.payment_id)));}
function setRemain(s){return Math.max(0,(+s.total||0)-setUses(s).length);}
function setExpired(s,on){return !!s.expires_on&&s.expires_on<(on||today());}
function custSets(cid){return (store.ticketSets||[]).filter(s=>s.customer_id===cid&&setLive(s));}
/* 使える回数券（期限が近いものから）。痩身のレッスンは痩身券→加圧券（差額）の順 */
function usableSets(cid,on){return custSets(cid).filter(s=>setRemain(s)>0&&!setExpired(s,on))
  .sort((a,b)=>(a.expires_on||'9999').localeCompare(b.expires_on||'9999')||a.purchased_on.localeCompare(b.purchased_on));}
function pickSet(cid,plan,on){const l=usableSets(cid,on);return l.find(s=>s.plan===plan)||l[0]||null;}
function surchargeFor(set,plan){if(!set||plan!=='slimming'||set.plan==='slimming')return 0;return Math.max(0,priceCfg().slim-(+set.unit_price||0));}
function ticketSummary(cid){const l=usableSets(cid);return {remain:l.reduce((a,s)=>a+setRemain(s),0),next:l[0]||null};}

/* ---- 紹介割・誕生日割 ---- */
function openCoupons(cid){const v=voidedIds();return (store.coupons||[]).filter(c=>c.customer_id===cid&&(!c.used_payment_id||v.has(c.used_payment_id))&&!(c.expires_on&&c.expires_on<today()));}
function birthdayAvail(c,on){
  on=on||today();if(!c||!c.birthday||String(c.birthday).slice(5,7)!==on.slice(5,7))return 0;
  const used=livePays().some(p=>p.customer_id===c.id&&(p.date||'').slice(0,4)===on.slice(0,4)&&(Array.isArray(p.discounts)?p.discounts:[]).some(d=>d.kind==='birthday'));
  return used?0:priceCfg().birthday;
}

/* ---- 予約・レッスンの複数プラン ---- */
function activeRv(r){return r.status!=='cancelled'&&r.status!=='moved';}
function rvCats(r){return (Array.isArray(r.categories)&&r.categories.length?r.categories:(r.category?[r.category]:[]));}
function sesCats(s){return (Array.isArray(s.categories)&&s.categories.length?s.categories:(s.category?[s.category]:[]));}
function catsLabel(a){return a.length?a.map(catLabel).join('・'):'—';}
function stampsHtml(cs){return `<span class="stamps">${Array.from({length:cs.every},(_,i)=>`<i class="${i<cs.stamps?'on':''}">${i+1}</i>`).join('')}</span>`;}

/* ---- プロテインの次回購入時期 ---- */
function voidedIds(){return new Set(store.payments.filter(p=>p.voided_at).map(p=>p.id));}
function custProteins(cid){const v=voidedIds();return store.proteins.filter(p=>p.customer_id===cid&&!(p.payment_id&&v.has(p.payment_id)))
  .sort((a,b)=>b.purchase_date.localeCompare(a.purchase_date));}
function proteinCalc(p){
  if(!p)return null;
  const prod=p.product_id?productById(p.product_id):null;
  const vol=(+p.volume_g)||(prod&&+prod.volume_g)||PROTEIN_BAG_G;
  const serv=(+p.serving_g)||(prod&&+prod.serving_g)||PROTEIN_SERVING_G;
  const perDay=(+p.per_day)||1;
  const servings=Math.floor(vol/serv),days=servings/perDay;
  const runOut=addDays(p.purchase_date,days);
  return {servings,days:Math.round(days),runOut,left:daysBetween(today(),runOut),vol,serv};
}
function proteinSoon(){
  return actives().map(c=>{const l=custProteins(c.id)[0];const calc=l&&proteinCalc(l);return calc?{c,calc}:null;})
    .filter(Boolean).filter(r=>r.calc.left<=14).sort((a,b)=>a.calc.left-b.calc.left);
}

/* ---- 予約：入店 → レッスン → 会計 ---- */
function rvState(r){return {checkin:!!r.checked_in_at,lesson:store.sessions.some(s=>s.reservation_id===r.id),pay:livePays().some(p=>p.reservation_id===r.id)};}
function isBirthday(c,ds){return c&&c.birthday&&String(c.birthday).slice(5,10)===ds.slice(5,10);}

/* 予約が入ったら、アプリを開いている間はすぐにお知らせ */
function subscribeReservations(){
  if(DEMO||window._rt)return;
  window._rt=sb.channel('reservations-watch').on('postgres_changes',{event:'*',schema:'public',table:'reservations'},async p=>{
    const r=p.new||{};
    await loadAll();
    if(kioskOn())return;   /* お客様が入力中は、ほかのお客様の名前を出さない */
    if(r.source==='customer'&&!r.seen_at){
      const c=custById(r.customer_id),cx=r.status==='cancelled';
      const title=cx?'予約のキャンセル':'新しい予約が入りました';

      <div class="cmp">先月の同じ期間より ${pctHtml(pct(total,prevTotal))}</div></section>
  </div></div>`;
}
function todayItem(r){
  if(!r.customer_id)return `<li><div class="t">${esc(r.time||'—')}</div><div><div class="n" onclick="openReservationForm('${r.date}','${r.id}')">${esc(r.note||'予定')}</div><div class="p">お客様なしの予定</div></div><div></div></li>`;
  const c=custById(r.customer_id),st=rvState(r),fin=st.checkin&&st.lesson&&st.pay;
  const next=!st.checkin?'checkin':!st.lesson?'lesson':!st.pay?'pay':'';
  const cs=c?couponState(c.id):null,tk=c?ticketSummary(c.id):null,cats=rvCats(r);
  const needsTicket=cats.some(k=>k==='training'||k==='slimming');
  const step=(k,label,done)=>`<button class="step ${done?'done':next===k?'next':''}" onclick="flowStep('${r.id}','${k}')">${label}</button>`;
  return `<li class="${fin?'fin':''}"><div class="t">${esc(r.time||'—')}</div>
    <div><div class="n" onclick="openCustomer('${r.customer_id}')">${c?esc(c.name):'—'}
      ${cs&&cs.avail?' <span class="tag">割引券あり</span>':''}${isBirthday(c,r.date)?' <span class="tag">誕生日</span>':''}
      ${needsTicket&&tk&&store.migr12?(tk.remain?` <span class="tag gray">回数券 残り${tk.remain}</span>`:' <span class="tag">回数券なし</span>'):''}</div>
      <div class="p">${catsLabel(cats)}${r.moved_from?'・日時変更あり':''}${r.note?'・'+esc(r.note):''}</div></div>
    <div class="flow">${step('checkin','入店',st.checkin)}<span class="arr" aria-hidden="true">›</span>${step('lesson',st.lesson?'レッスン':'レッスン記録',st.lesson)}<span class="arr" aria-hidden="true">›</span>${step('pay','会計',st.pay)}</div></li>`;
}
function upcItem(r){const c=custById(r.customer_id);
  return `<li onclick="openReservationForm('${r.date}','${r.id}')"><span>${fmtMd(r.date)}</span><span class="muted">${esc(r.time||'—')}</span>
    <span>${c?esc(c.name):`<span class="muted">${esc(r.note||'予定')}</span>`}</span><span class="pl">${catsLabel(rvCats(r))}</span></li>`;}
async function flowStep(rid,k){
  const r=store.reservations.find(x=>x.id===rid);if(!r)return;const st=rvState(r);
  if(k==='checkin'){
    if(needMigr6())return;
    if(st.checkin&&!await ask('入店を取り消しますか？'))return;
    const {error}=await dbWrite('reservations','update',{checked_in_at:st.checkin?null:new Date().toISOString()},rid);
    if(error){toast('エラー: '+error.message);return;}
    await loadAll();closeModal();render();toast(st.checkin?'入店を取り消しました':`${payNameById(r.customer_id)} さん 入店`);
  }else if(k==='lesson'){
    if(st.lesson){openCustomer(r.customer_id,'record');return;}
    openLessonForm(r.customer_id,{reservation:r});
  }else if(k==='pay'){
    if(st.pay){const p=livePays().find(p=>p.reservation_id===rid);if(p)openPayDetail(p.id);return;}
    openPayForm(r.customer_id,{reservation:r});
  }
}

/* ================= 予約（カレンダー） ================= */
function viewReservations(){
  if(!ui.calMonth)ui.calMonth=today().slice(0,7);
  const [y,m]=ui.calMonth.split('-').map(Number);
  return `${pageHead('RESERVATIONS','予約',`<button class="btn primary" onclick="openReservationForm()">＋ 予約</button>`)}
  <section class="card">
    <div class="cal-head"><button class="btn sm" onclick="calNav(-1)" aria-label="前の月">‹</button><h2>${y}年${m}月</h2><button class="btn sm" onclick="calNav(1)" aria-label="次の月">›</button>
      <button class="btn sm" onclick="ui.calMonth=today().slice(0,7);render()">今日</button></div>
    ${buildCalendar(ui.calMonth)}
    <div class="legend2" style="flex-wrap:wrap"><span><i></i>予約</span><span><i class="mv"></i>日時を変更した予約（行き先の日付つき）</span><span><i style="background:var(--pill)"></i>予定</span><span><i class="bd"></i>誕生日</span><span class="muted">日付を押すと予約を追加できます</span></div>
  </section>`;
}
function rvById(id){return store.reservations.find(x=>x.id===id)||null;}
function buildCalendar(ym){
  const [y,m]=ym.split('-').map(Number),startDow=new Date(y,m-1,1).getDay(),daysIn=new Date(y,m,0).getDate();
  const cells=Math.ceil((startDow+daysIn)/7)*7,td=today(),bdMap={};
  actives().forEach(c=>{if(c.birthday){const k=String(c.birthday).slice(5,10);(bdMap[k]=bdMap[k]||[]).push(c);}});
  let h='<div class="cal-grid">'+['日','月','火','水','木','金','土'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<cells;i++){
    const dn=i-startDow+1,inM=dn>=1&&dn<=daysIn,ds=inM?`${y}-${pad(m)}-${pad(dn)}`:'';
    const bds=inM?(bdMap[ds.slice(5)]||[]):[];
    /* 変更前の予約も「線で消して」行き先の日付と一緒に表示する */
    const rvs=inM?store.reservations.filter(r=>r.date===ds&&r.status!=='cancelled').sort((a,b)=>(a.status==='moved')-(b.status==='moved')||byTime(a,b)):[];
    h+=`<div class="cal-cell ${inM?'':'other'} ${ds===td?'today':''}" ${inM?`onclick="openReservationForm('${ds}')"`:''}>
      ${inM?`<span class="dn">${dn}</span>`:''}
      ${bds.map(c=>`<span class="rv bd" onclick="event.stopPropagation();openCustomer('${c.id}')"><b>誕生日</b><span class="nm">${esc(c.name)}</span></span>`).join('')}
      ${rvs.slice(0,3).map(calChip).join('')}
      ${rvs.length>3?`<span class="rv more">＋${rvs.length-3}件</span>`:''}</div>`;
  }
  return h+'</div>';
}
function calChip(r){
  const c=custById(r.customer_id),name=c?esc(c.name):esc(r.note||'予定');
  if(r.status==='moved'){
    const to=rvById(r.moved_to),lbl=to?`${+to.date.slice(5,7)}/${+to.date.slice(8)}`:'';
    return `<span class="rv moved" title="${name}：${to?fmtMd(to.date)+' '+esc(to.time||'')+' に変更':'変更済み'}" onclick="event.stopPropagation();openMovedInfo('${r.id}')"><s><b>${esc(r.time||'')}</b><span class="nm">${name}</span></s>${lbl?`<em>→${lbl}</em>`:''}</span>`;
  }
  const from=r.moved_from?rvById(r.moved_from):null;
  return `<span class="rv ${!r.customer_id?'blk':''} ${from?'chg':''}" ${from?`title="${fmtMd(from.date)} ${esc(from.time||'')} から変更"`:''} onclick="event.stopPropagation();openReservationForm('${r.date}','${r.id}')">${from?`<em>${+from.date.slice(5,7)}/${+from.date.slice(8)}→</em>`:''}<b>${esc(r.time||'')}</b><span class="nm">${name}</span></span>`;
}

function calNav(d){let [y,m]=ui.calMonth.split('-').map(Number);m+=d;if(m<1){m=12;y--;}if(m>12){m=1;y++;}ui.calMonth=`${y}-${pad(m)}`;render();}
function custOptions(sel,includeWithdrawn){
  const list=includeWithdrawn?store.customers:actives();
  return list.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)}${c.kana?'（'+esc(c.kana)+'）':''}</option>`).join('');
}
/* 予約時刻は30分刻み */
function timeOptions(sel){
  const out=[];for(let m=7*60;m<=22*60;m+=30)out.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`);
  if(sel&&!out.includes(sel))out.push(sel);
  return out.sort().map(t=>`<option ${t===sel?'selected':''}>${t}</option>`).join('');
}
function planChips(id,sel){return `<div class="chips" id="${id}">${CATS.map(([k,l])=>`<button type="button" class="chip ${sel.includes(k)?'on':''}" data-k="${k}" onclick="this.classList.toggle('on')">${l}</button>`).join('')}</div>`;}
function chipsVal(id){return [...document.querySelectorAll('#'+id+' .chip.on')].map(b=>b.dataset.k);}

    <div class="modal-f">${r?`<button class="btn danger" style="margin-right:auto" onclick="delReservation('${r.id}')">削除</button>`:''}

function rvCustChange(){const c=custById(document.getElementById('rv_cust').value);if(!c||chipsVal('rv_cats').length)return;
  const ks=custCats(c);document.querySelectorAll('#rv_cats .chip').forEach(b=>b.classList.toggle('on',ks.includes(b.dataset.k)));}
async function saveReservation(id){
  const cid=document.getElementById('rv_cust').value,date=document.getElementById('rv_date').value;
  if(!cid||!date){toast('お客様と予約日を入力してください');return;}
  const none=cid==='__none__',cats=none?[]:chipsVal('rv_cats');
  const row={customer_id:none?null:cid,date,time:document.getElementById('rv_time').value||null,category:cats[0]||null,categories:cats,
    duration:parseInt(document.getElementById('rv_duration').value)||null,note:document.getElementById('rv_note').value.trim()||(none?'予定':null)};
  const old=id?rvById(id):null;
  const btn=document.getElementById('rvbtn');btn.disabled=true;
  /* 日時が変わったら「変更」として、変更前を残して新しい予約を作る */
  if(old&&(old.date!==row.date||(old.time||'')!==(row.time||''))&&store.migr12){
    if(!await ask(`${fmtMd(old.date)} ${old.time||''} → ${fmtMd(row.date)} ${row.time||''}\nに日時を変更しますか？`,{ok:'変更する',danger:false})){btn.disabled=false;return;}
    const res=await dbWrite('reservations','insert',Object.assign({},row,{moved_from:old.id,checked_in_at:null}));
    if(res.error){toast('エラー: '+res.error.message);btn.disabled=false;return;}
    const r2=await dbWrite('reservations','update',{status:'moved',moved_to:res.data&&res.data.id},old.id);
    if(r2.error){toast('エラー: '+r2.error.message);btn.disabled=false;return;}
    await loadAll();closeModal();toast(`${fmtMd(row.date)} ${row.time||''} に変更しました`);render();return;
  }
  const {error}=id?await dbWrite('reservations','update',row,id):await dbWrite('reservations','insert',row);
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  await loadAll();closeModal();toast(id?'予約を更新しました':'予約を追加しました');render();
}
async function delReservation(id){if(!await ask('この予約を削除しますか？'))return;
  const {error}=await sb.from('reservations').delete().eq('id',id);if(error){toast('エラー: '+error.message);return;}
  await loadAll();closeModal();toast('削除しました');render();}

async function saveMeasure(cid){

  const row={customer_id:cid,date,note:document.getElementById('m_note').value.trim()||null};

async function delRecord(sid,mid){

  if(mid){const {error}=await sb.from('measurements').delete().eq('id',mid);if(error){toast('エラー: '+error.message);return;}}

}

async function voidPayment(id){

/* ---- 会計の入力 ----
   加圧・痩身：回数券を「使う」か「買う（5回）」。痩身を加圧の回数券で受けるときは差額を足す（痩身の利用として記録）
   バスト：毎回金額を入力。商品：プロテイン・美容を複数選択。
   割引：商品スタンプ券／紹介割／誕生日割／手入力の値引き。確定前にお客様向けの確認画面を出す。 */
let pay=null;
function openPayForm(cid,opts){
  opts=opts||{};const r=opts.reservation||null;
  if(!actives().length){toast('先に顧客を登録してください');return;}
  pay={cid:cid||'',fixed:!!cid,date:r?r.date:today(),r,rid:r?r.id:null,step:'edit',
    plans:{},products:[],openKinds:{},stamp:false,stampCount:1,referral:false,birthday:false,adjType:'',adjVal:'',method:'cash',note:''};
  if(cid)payInitPlans(r?rvCats(r):custCats(custById(cid)).slice(0,1));
  modal(`<div id="payModal"></div>`,'wide');payRender();
}
function payCust(){return pay.cid?custById(pay.cid):null;}
function payInitPlans(cats){
  pay.plans={};
  cats.forEach(k=>payPlanOn(k));
}
function payPlanOn(k){
  const c=payCust();
  if(k==='bust'){const last=livePays().filter(p=>p.customer_id===pay.cid).map(p=>payLinesOf(p).find(l=>l.kind==='bust')).find(Boolean);
    pay.plans.bust={on:true,price:last?last.price:(c?currentPlanPrice(c,'bust')||0:0)};return;}
  const usable=store.migr12&&pay.cid?pickSet(pay.cid,k,pay.date):null;
  const size=priceCfg().size,unit=unitPrice(c,k);
  pay.plans[k]={on:true,mode:usable?'use':'buy',useNow:true,price:unit*size,unit};
}
function payTogglePlan(k){if(pay.plans[k])delete pay.plans[k];else payPlanOn(k);payRender();}
function paySetPlan(k,f,v){const P=pay.plans[k];if(!P)return;if(f==='price'){P.price=parseFloat(v)||0;paySum();return;}P[f]=v;payRender();}
/* 明細を作る（回数券の残りは、同じ会計の中で使った分も引いて考える） */
function payLines(){
  const c=payCust(),out=[],taken={};
  const pick=plan=>{const l=usableSets(pay.cid,pay.date).filter(s=>setRemain(s)-(taken[s.id]||0)>0);return l.find(s=>s.plan===plan)||l[0]||null;};
  ['training','slimming'].forEach(k=>{const P=pay.plans[k];if(!P)return;
    if(!store.migr12){out.push({kind:k,name:catLabel(k)+'（契約料金）',price:unitPrice(c,k),qty:1});return;}
    if(P.mode==='use'){const s=pick(k);
      if(!s){out.push({kind:k,name:`${catLabel(k)}（使える回数券がありません）`,price:0,qty:1,warn:true});return;}
      taken[s.id]=(taken[s.id]||0)+1;const n=setUses(s).length+taken[s.id],sur=surchargeFor(s,k);
      out.push({kind:k,name:`${catLabel(k)}（回数券 ${n}/${s.total}回目${s.plan!==k?`・${catLabel(s.plan)}の券＋差額`:''}）`,price:sur,qty:1,ticket:{op:'use',set_id:s.id,plan:k,surcharge:sur}});
    }else{const size=priceCfg().size;
      out.push({kind:k,name:`${catLabel(k)} 回数券（${size}回）`,price:+P.price||0,qty:1,ticket:{op:'buy',plan:k,unit:P.unit,size}});
      if(P.useNow)out.push({kind:k,name:`${catLabel(k)}（回数券 1/${size}回目）`,price:0,qty:1,ticket:{op:'useNew',plan:k}});}
  });
  if(pay.plans.bust)out.push({kind:'bust',name:'バスト',price:+pay.plans.bust.price||0,qty:1});
  pay.products.forEach(l=>out.push(l));
  return out;
}
function payProductToggle(pid){
  const i=pay.products.findIndex(l=>l.product_id===pid);
  if(i>=0)pay.products.splice(i,1);else{const p=productById(pid);pay.products.push({kind:productKind(p),name:p.name,price:+p.price||0,qty:1,product_id:p.id});}
  payRender();
}
function payProductQty(pid,d){const l=pay.products.find(x=>x.product_id===pid);if(!l)return;l.qty=Math.max(1,l.qty+d);payRender();}
function payCalc(){
  const lines=payLines(),sub=lines.reduce((s,l)=>s+(+l.price||0)*(+l.qty||1),0);
  const v=parseFloat(pay.adjVal)||0;let adj=0;
  if(pay.adjType==='minus')adj=-v;else if(pay.adjType==='minus_pct')adj=-Math.round(sub*v/100);else if(pay.adjType==='plus')adj=v;
  const c=payCust(),cs=c?couponState(c.id):null,pc=priceCfg();
  const cnt=pay.stamp&&cs&&cs.avail?Math.min(pay.stampCount,cs.avail):0,stamp=cnt*couponCfg().amount;
  const ref=pay.referral&&c?openCoupons(c.id)[0]:null,refAmt=ref?+ref.amount:0;
  const bday=pay.birthday&&c?birthdayAvail(c,pay.date):0;
  const extras=[];if(ref)extras.push({kind:'referral',amount:refAmt,coupon_id:ref.id,label:'紹介割'});if(bday)extras.push({kind:'birthday',amount:bday,year:pay.date.slice(0,4),label:'誕生日割'});
  return {lines,sub,adj,cnt,stamp,extras,total:Math.max(0,Math.round(sub+adj-stamp-refAmt-bday))};
}

  const box=document.getElementById('payModal');if(!box)return;
  if(pay.step==='confirm')return payConfirmRender(box);

      <div class="unit" style="max-width:220px"><input type="number" inputmode="numeric" value="${P.price}" oninput="paySetPlan('bust','price',this.value)"><span class="u">円</span></div></div>`;
    if(!store.migr12)return `<div class="pbox"><div class="pbox-h"><b>${catLabel(k)}</b><span class="muted">契約料金 ${yen(unitPrice(c,k))}</span></div></div>`;
    const usable=pay.cid?usableSets(pay.cid,pay.date):[],s=usable.find(x=>x.plan===k)||usable[0],sur=s?surchargeFor(s,k):0;
    return `<div class="pbox"><div class="pbox-h"><b>${catLabel(k)}</b><span class="muted">1回 ${yen(unitPrice(c,k))}${k==='slimming'?'（全員一律）':''}</span></div>
      <div class="seg sm" style="margin:2px 0 10px">
        <button class="${P.mode==='use'?'on':''}" onclick="paySetPlan('${k}','mode','use')">回数券を使う${tk?`（残り${tk.remain}回）`:''}</button>

  const prodPicker=kind=>{const list=productsOf(kind);if(!pay.openKinds[kind])return '';
    return `<div class="pbox"><div class="pbox-h"><b>${catLabel(kind)}</b><span class="muted">複数選べます</span></div>

        return `<li class="${sel?'on':''}"><button class="pick" onclick="payProductToggle('${p.id}')"><span class="ck" aria-hidden="true"></span><span class="pn">${esc(p.name)}</span><span class="pp">${yen(p.price)}</span></button>
          ${sel?`<span class="qty"><button aria-label="減らす" onclick="payProductQty('${p.id}',-1)">−</button><b>${sel.qty}</b><button aria-label="増やす" onclick="payProductQty('${p.id}',1)">＋</button></span>`:''}</li>`;}).join('')}</ul>`
        :`<div class="muted" style="font-size:13px">設定 › 商品 で${catLabel(kind)}の商品を登録してください。</div>`}</div>`;};
  box.outerHTML=`<div id="payModal" style="display:contents">
    <div class="modal-h"><h3>会計</h3><button class="x" aria-label="閉じる" onclick="closeModal()">×</button></div>

/* 決済の音（その場で合成。音声ファイル不要） */
function payChime(){
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const a=new C(),t0=a.currentTime;
    [[1046.5,0],[1568,.11]].forEach(([f,t])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0+t);g.gain.exponentialRampToValueAtTime(.22,t0+t+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+t+.7);
      o.connect(g);g.connect(a.destination);o.start(t0+t);o.stop(t0+t+.75);});
    setTimeout(()=>a.close(),1400);}catch(e){}
}

    if(twoLine){x.font=`9.5px ${F}`;x.fillStyle=r.sub==='日'?'#c27672':r.sub==='土'?'#8a9bbd':'#cdbcb7';if(n<=16||i%2===0||r.cur)x.fillText(r.sub,cx,P.t+ch+28);}});
  /* 客数の線（これから先の期間は描かない） */
  const pts=d.map((r,i)=>({r,cx:P.l+gap*i+gap/2,cy:P.t+ch*(1-r.cust/maxC)})).filter(p=>!p.r.future);
  x.globalAlpha=prog;x.strokeStyle='#665350';x.lineWidth=1.6;x.lineJoin='round';x.beginPath();
  pts.forEach((p,i)=>i?x.lineTo(p.cx,p.cy):x.moveTo(p.cx,p.cy));x.stroke();
  pts.forEach(p=>{x.beginPath();x.arc(p.cx,p.cy,n>20?2.2:3,0,7);x.fillStyle='#fff';x.fill();x.stroke();});
  const tip=document.getElementById('salesTip');
  cv.onmousemove=e=>{const rc=cv.getBoundingClientRect(),mx=e.clientX-rc.left,i=Math.floor((mx-P.l)/gap);
    if(i<0||i>=n){tip.style.opacity=0;return;}const r=d[i];
    tip.innerHTML=`${r.title}<br>売上 <b>${yen(r.amt)}</b>　客数 <b>${r.cust}</b>人`;
    tip.style.left=Math.min(Math.max(P.l+gap*i+gap/2,70),W-70)+'px';tip.style.top=(P.t+ch*(1-r.amt/maxV))+'px';tip.style.opacity=1;};
  cv.onmouseleave=()=>tip.style.opacity=0;
  cv.onclick=e=>{const rc=cv.getBoundingClientRect(),i=Math.floor((e.clientX-rc.left-P.l)/gap);if(d[i]&&d[i].cnt)salesDetail(d[i].key);};
}

  if(!typed){exitKiosk();return;}

async function kioskSubmit(){
  const p=readPerson('k_'),err=document.getElementById('k_err');err.textContent='';
  const miss=[[p.last_name,'姓'],[p.first_name,'名'],[p.last_kana,'セイ'],[p.first_kana,'メイ'],[p.phone,'電話番号']].filter(x=>!x[0]).map(x=>x[1]);
  if(miss.length){err.textContent=miss.join('・')+' をご記入ください';return;}
  if(p.email&&!/.+@.+\..+/.test(p.email)){err.textContent='メールアドレスの形をご確認ください';return;}
  if(!document.getElementById('k_agree').checked){err.textContent='内容をご確認のうえ、同意にチェックしてください';return;}
  const health=document.getElementById('k_health').value.trim();
  const row=Object.assign(p,{owner_id:meUser.id,joined:today(),goal:document.getElementById('k_goal').value.trim()||null,
    notes:health?'【お客様記入】'+health:null});
  const btn=document.getElementById('k_btn');btn.disabled=true;btn.textContent='送信中…';
  const res=await dbWrite('customers','insert',row);

  /* お礼を表示して、少ししたら受付モードを終了してホームへ */

/* ---- 計測グラフ ---- */
function drawChart(cid,metric){
  const cv=document.getElementById('chart');if(!cv)return;
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||700,H=260;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const x=cv.getContext('2d');x.scale(dpr,dpr);
  const F='"Zen Kaku Gothic New",sans-serif',meta=METRICS.find(m=>m[0]===metric);
  const d=custMeasures(cid).filter(m=>m[metric]!=null).map(m=>({x:m.date,y:+m[metric]}));
  const P={l:44,r:20,t:26,b:30},cw=W-P.l-P.r,ch=H-P.t-P.b;
  x.font=`12px ${F}`;x.fillStyle='#7f6a65';
  if(!d.length){x.textAlign='center';x.fillText('まだ記録がありません',W/2,H/2);return;}
  const ys=d.map(v=>v.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const pd=(mx-mn)*.18;mn-=pd;mx+=pd;
  const X=i=>d.length===1?P.l+cw/2:P.l+cw*i/(d.length-1),Y=v=>P.t+ch*(1-(v-mn)/(mx-mn));
  x.textAlign='left';x.fillText(`${meta[1]}（${meta[2]}）`,0,12);
  x.font=`11px ${F}`;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,yy=Y(v);x.strokeStyle='#f5edea';x.beginPath();x.moveTo(P.l,yy);x.lineTo(W-P.r,yy);x.stroke();x.textAlign='right';x.fillStyle='#7f6a65';x.fillText(v.toFixed(1),P.l-6,yy+4);}
  const gr=x.createLinearGradient(0,P.t,0,P.t+ch);gr.addColorStop(0,'rgba(232,163,160,.28)');gr.addColorStop(1,'rgba(232,163,160,0)');
  x.beginPath();x.moveTo(X(0),Y(d[0].y));d.forEach((v,i)=>x.lineTo(X(i),Y(v.y)));x.lineTo(X(d.length-1),P.t+ch);x.lineTo(X(0),P.t+ch);x.closePath();x.fillStyle=gr;x.fill();
  x.beginPath();x.strokeStyle='#d98e8a';x.lineWidth=2.2;x.lineJoin='round';d.forEach((v,i)=>i?x.lineTo(X(i),Y(v.y)):x.moveTo(X(i),Y(v.y)));x.stroke();
  const every=Math.ceil(d.length/14);
  d.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v.y),3.5,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=2;x.strokeStyle='#d98e8a';x.stroke();
    if((i%every===0&&d.length-1-i>=every*.6)||i===d.length-1){x.textAlign='center';x.fillStyle='#4a3936';x.font=`700 11px ${F}`;x.fillText(v.y,X(i),Y(v.y)-10);
      x.fillStyle='#7f6a65';x.font=`10px ${F}`;const dd=new Date(v.x+'T00:00:00');x.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,X(i),P.t+ch+16);}});
}

  try{await loadQrLib();const q=qrcode(0,'M');q.addData(CUSTOMER_APP_URL);q.make();box.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});}
  catch(e){box.innerHTML='<div class="muted" style="font-size:12px">QRコードを表示できませんでした</div>';}
}
async function saveQr(){
  await loadQrLib();const q=qrcode(0,'M');q.addData(CUSTOMER_APP_URL);q.make();
  const n=q.getModuleCount(),cell=16,m=4,size=(n+m*2)*cell,cv=document.createElement('canvas');cv.width=cv.height=size;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+m)*cell,(r+m)*cell,cell,cell);
  const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=`お客様アプリQR_${studioName()}.png`;a.click();
}

        <p class="muted" style="font-size:13px;margin:12px 0">お客様のスマホのカメラでQRコードを読み取ると、お客様アプリが開きます。</p>

function copyText(s){(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('コピーしました')).catch(()=>askText({title:'コピーしてください',label:'長押し（または選択）してコピーできます',value:s,ok:'閉じる',noCancel:true}));}

      <div><div class="l">権限</div><div class="d">${isAdmin?'管理者（開発元）':'オーナー'}</div></div></div>

    <div class="note" style="margin-top:16px">${isAdmin?'この端末は<b>管理者（開発元）</b>としてログインしています。お店がパスワードを変更しても、管理者のアクセスは維持されます。':'パスワードはいつでも変更できます。変更してもデータはそのまま引き継がれます。パスワードを忘れたときは、開発元に再設定を依頼してください。'}</div>
    <div style="margin-top:14px" class="actions">${isAdmin?`<a class="btn sm" href="admin/">運営管理画面を開く</a>`:''}<a class="link" onclick="resetConn()">接続先（Supabase）を変更</a></div></section>
  <section class="card"><div class="ch"><h2>Face ID・指紋でログイン</h2></div><div id="bioBox" class="muted" style="font-size:13px">確認中…</div></section>`;}
async function fillBio(){
  const el=document.getElementById('bioBox');if(!el)return;
  if(DEMO){el.textContent='デモ表示では設定できません。';return;}
