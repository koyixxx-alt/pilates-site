<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f3f1">
<title>Pilates Studio — お店側</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f3f1;--paper:#ffffff;--ink:#4f3d3a;--ink2:#6e5955;--sub:#a08a85;--faint:#cdbcb7;
    --line:#eee2de;--line2:#f5edea;--accent:#e8a3a0;--accent-h:#df9692;--accent-d:#bf716d;--accent-soft:#fbeeec;
    --pill:#f4ebe8;--tile:#fcf7f6;--up:#6b9a83;--down:#bf716d;--danger:#c0574f;
    --shadow:0 1px 2px rgba(120,80,70,.04),0 10px 28px -18px rgba(150,90,80,.24);--r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Zen Kaku Gothic New',-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--ink);
    line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,select,textarea{font:inherit;font-size:15px;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)}
  .hidden{display:none!important}

  /* ---------- ログイン・初期設定 ---------- */
  .cover{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .cover-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:42px 32px 34px}
  .cover-card .logo{font-size:26px;font-weight:700;letter-spacing:.06em;text-align:center}
  .cover-card .cap{font-size:10px;letter-spacing:.3em;color:var(--sub);text-align:center;margin:8px 0 30px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;letter-spacing:.06em}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);cursor:pointer;margin:4px 0 16px}
  .check input{width:16px;height:16px;accent-color:var(--accent)}
  .btn-block{width:100%;padding:13px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;letter-spacing:.06em;transition:background .15s}
  .btn-block:hover{background:var(--accent-h)}
  .btn-block:disabled{opacity:.6;cursor:default}
  .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;text-align:center}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px}

  /* ---------- 骨組み ---------- */
  #app{display:none}
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;max-width:1320px;margin:0 auto}
  .side{position:sticky;top:0;height:100vh;padding:34px 18px 26px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .brand{padding:0 12px}
  .brand .logo{font-size:22px;font-weight:700;letter-spacing:.06em;line-height:1.25;word-break:break-word}
  .brand .cap{font-size:10px;letter-spacing:.3em;color:var(--sub);margin-top:8px}
  .demo-badge{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-d);font-weight:700}
  .nav{margin-top:32px;display:flex;flex-direction:column;gap:2px}
  .nav button{text-align:left;font-size:15px;color:var(--ink2);padding:11px 16px;border-radius:999px;letter-spacing:.06em;transition:background .15s,color .15s}
  .nav button:hover{background:var(--pill)}
  .nav button.on{background:var(--accent);color:#fff;font-weight:700}
  .nav .sep{height:1px;background:var(--line);margin:10px 16px}
  .acct{margin-top:auto;padding:0 12px;font-size:12px;color:var(--sub);line-height:1.8;word-break:break-all}
  .acct button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:12px}
  .main{padding:36px 44px 80px;min-width:0}
  .mtop{display:none}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:24px;flex-wrap:wrap}
  .eyebrow{font-size:12px;color:var(--sub);letter-spacing:.1em;margin-bottom:4px}
  h1{font-size:24px;font-weight:700;letter-spacing:.08em}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ---------- ボタン・部品 ---------- */
  .btn{font-size:13px;font-weight:700;border-radius:999px;padding:10px 20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    letter-spacing:.04em;white-space:nowrap;transition:transform .12s,background .15s}
  .btn:hover{background:var(--pill)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-h)}
  .btn.sm{padding:7px 14px;font-size:12px}
  .btn.danger{color:var(--danger)}
  .btn:disabled{opacity:.55;cursor:default;transform:none}
  .link{font-size:12px;color:var(--sub);white-space:nowrap}
  .link:hover{color:var(--ink)}
  .link.del:hover{color:var(--danger)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:22px;min-width:0}
  .ch{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .ch h2{font-size:15px;font-weight:700;letter-spacing:.06em}
  .ch h2 span{font-weight:400;color:var(--sub);font-size:12px;margin-left:8px;letter-spacing:.02em}
  .golden{display:grid;grid-template-columns:minmax(0,1.618fr) minmax(0,1fr);gap:22px;align-items:start}
  .muted{color:var(--sub)}
  .empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:13.5px;line-height:1.9}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-d);font-weight:700;white-space:nowrap;vertical-align:1px}
  .tag.gray{background:var(--pill);color:var(--sub)}
  .tags{display:inline-flex;gap:4px;flex-wrap:wrap}
  .note{background:var(--tile);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink2);line-height:1.85}
  .note b{color:var(--ink)}
  .banner{background:var(--accent-soft);color:var(--accent-d);border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:18px;line-height:1.8}
  .seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{font-size:13.5px;color:var(--ink2);padding:9px 18px;border-radius:999px;white-space:nowrap;letter-spacing:.04em;transition:background .15s,color .15s}
  .seg button.on{background:var(--accent);color:#fff;font-weight:700}
  .seg.sm button{padding:6px 14px;font-size:12.5px}
  .search{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:#fff;width:100%;max-width:300px;font-size:14px}
  select.plain{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}

  /* ---------- 表 ---------- */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{font-size:11.5px;color:var(--sub);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:12px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl .r{text-align:right;white-space:nowrap}
  .tbl .nw{white-space:nowrap}
  .tbl td.b{font-weight:700}
  .tbl tbody tr.click{cursor:pointer;transition:background .12s}
  .tbl tbody tr.click:hover{background:#fdf8f7}
  .tbl tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;padding-top:12px}
  .tbl tr.void td{color:var(--faint)}
  .tbl tr.void td.amt{text-decoration:line-through}
  .up{color:var(--up);font-weight:700}.dn{color:var(--down);font-weight:700}

  /* ---------- ホーム ---------- */
  .count4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .count4>div{background:var(--tile);border-radius:14px;padding:14px 16px}
  .count4 .k{font-size:12px;color:var(--sub)}
  .count4 .v{font-size:26px;font-weight:700;line-height:1.35}
  .count4 .v small{font-size:12px;color:var(--sub);font-weight:500;margin-left:3px}
  .count4 .tot{background:var(--accent)}
  .count4 .tot .k,.count4 .tot .v,.count4 .tot .v small{color:#fff}
  .today{list-style:none}
  .today li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}
  .today li:first-child{border-top:0;padding-top:2px}
  .today .t{font-size:17px;font-weight:700}
  .today .n{font-size:15px;font-weight:700;cursor:pointer}
  .today .n:hover{color:var(--accent-d)}
  .today .p{font-size:12px;color:var(--sub);margin-top:2px}
  .today li.fin .t,.today li.fin .n{color:var(--faint)}
  .flow{display:flex;align-items:center;gap:3px}
  .flow .arr{color:var(--faint);font-size:11px}
  .step{font-size:12px;font-weight:700;border-radius:999px;padding:7px 13px;border:1px solid var(--line);color:var(--ink2);background:var(--paper);white-space:nowrap;transition:transform .12s,background .15s}
  .step:hover{background:var(--pill)}
  .step:active{transform:scale(.96)}
  .step.done{background:var(--pill);border-color:transparent;color:var(--sub);font-weight:500}
  .step.next{background:var(--accent);border-color:var(--accent);color:#fff}
  .step.next:hover{background:var(--accent-h)}
  .upc{list-style:none}
  .upc li{display:grid;grid-template-columns:104px 50px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-top:1px solid var(--line2);font-size:13.5px;align-items:center;cursor:pointer}
  .upc li:first-child{border-top:0;padding-top:0}
  .upc .pl{font-size:12px;color:var(--sub)}
  .nums{list-style:none}
  .nums li{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
  .nums li:first-child{border-top:0;padding-top:0}
  .nums li b{font-size:15.5px;font-weight:700}
  .nums li.total{background:var(--accent);color:#fff;border-radius:12px;padding:11px 14px;margin-top:10px;border:0}
  .nums li.total b{font-size:19px}
  .cmp{font-size:12px;color:var(--sub);text-align:right;margin-top:8px}
  .soon{list-style:none}
  .soon li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:11px 0;border-top:1px solid var(--line2);font-size:14px;cursor:pointer}
  .soon li:first-child{border-top:0;padding-top:0}
  .soon em{font-style:normal;font-size:12px;color:var(--sub)}
  .hot{color:var(--danger);font-weight:700}

  /* ---------- 売上 ---------- */
  .kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:22px}
  .kgrid .card{margin:0}
  .kgrid .k{font-size:12px;color:var(--sub);letter-spacing:.04em}
  .kgrid .v{font-size:26px;font-weight:700;margin-top:4px}
  .kgrid .d{font-size:12px;color:var(--sub);margin-top:4px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--sub);align-items:center}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:-1px}
  .legend i.l{background:none;border-top:2px solid var(--ink2);height:0;border-radius:0;vertical-align:3px}
  .chart-wrap{position:relative;width:100%}
  canvas{display:block;width:100%}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;line-height:1.6}
  .periodnav{display:flex;align-items:center;gap:8px}
  .periodnav b{font-size:14px;min-width:96px;text-align:center}

  /* ---------- カレンダー ---------- */
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .cal-head h2{font-size:17px;min-width:110px;text-align:center;letter-spacing:.04em}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
  .cal-dow{background:var(--tile);text-align:center;padding:8px 0;font-size:12px;color:var(--sub)}
  .cal-cell{background:var(--paper);min-height:98px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .12s}
  .cal-cell:hover{background:#fdf8f7}
  .cal-cell.other{background:#faf6f5;cursor:default}
  .cal-cell .dn{font-size:12px;font-weight:700;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
  .cal-cell.today .dn{background:var(--accent);color:#fff}
  .rv{display:block;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--accent-soft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rv b{font-weight:700;margin-right:3px}
  .rv.bd{background:#fff;border:1px dashed var(--accent);color:var(--accent-d)}
  .rv.more{background:none;color:var(--sub)}
  .legend2{margin-top:12px;display:flex;gap:18px;font-size:12px;color:var(--sub)}
  .legend2 span{display:inline-flex;align-items:center;gap:6px}
  .legend2 i{width:11px;height:11px;border-radius:3px;background:var(--accent-soft)}
  .legend2 i.bd{background:#fff;border:1px dashed var(--accent)}

  /* ---------- 顧客詳細 ---------- */
  .back{font-size:13px;color:var(--sub);margin-bottom:14px;display:inline-block}
  .back:hover{color:var(--ink)}
  .prof{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .prof .nm{font-size:22px;font-weight:700;letter-spacing:.04em}
  .prof .kn{color:var(--sub);font-size:13px}
  .meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
  .meta .l{font-size:11px;color:var(--sub)}
  .meta .d{font-size:14px;word-break:break-all}
  .mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
  .mini3>div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .mini3 .k{font-size:12px;color:var(--sub)}
  .mini3 .v{font-size:22px;font-weight:700}
  .mini3 .v small{font-size:12px;color:var(--sub);font-weight:500;margin-left:3px}
  .mini3 .d{font-size:12px}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .pills button{padding:6px 13px;border-radius:999px;background:var(--pill);font-size:12.5px;color:var(--ink2)}
  .pills button.on{background:var(--accent);color:#fff;font-weight:700}
  .stamps{display:inline-flex;gap:6px;align-items:center;vertical-align:middle}
  .stamps i{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--faint);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--faint)}
  .stamps i.on{border:0;background:var(--accent);color:#fff;font-weight:700}
  .plancards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .plancards>div{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .hist{font-size:12px;color:var(--sub);margin-top:6px}
  .hist div{display:flex;justify-content:space-between;padding:2px 0}

  /* ---------- モーダル・フォーム ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(60,40,36,.3);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .18s ease both}
  .modal{background:var(--paper);border-radius:20px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px -20px rgba(60,30,20,.35);animation:up .26s cubic-bezier(.22,.9,.3,1) both}
  .modal.wide{max-width:660px}
  .modal-h{padding:20px 24px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .modal-h h3{font-size:17px;letter-spacing:.06em}
  .modal-h .x{font-size:22px;color:var(--sub);width:34px;height:34px;border-radius:50%;flex-shrink:0}
  .modal-h .x:hover{background:var(--pill)}
  .modal-sub{padding:0 24px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .modal-b{padding:10px 24px 18px;overflow-y:auto}
  .modal-f{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;align-items:center;border-top:1px solid var(--line2);flex-wrap:wrap}
  .modal-f .grow{flex:1;font-size:12px;color:var(--sub)}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form .full{grid-column:1/-1}
  .fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;letter-spacing:.04em}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
  .fld textarea{resize:vertical;min-height:70px}
  .unit{position:relative}
  .unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:12px;pointer-events:none}
  .unit input{padding-right:34px}
  .sec{font-size:12px;color:var(--sub);letter-spacing:.1em;margin:18px 0 8px}
  .sec:first-child{margin-top:4px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:13px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:#fff;transition:background .15s}
  .chip:hover{background:var(--pill)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d);font-weight:700}
  .lines{list-style:none;border-top:1px solid var(--line2)}
  .lines li{display:grid;grid-template-columns:minmax(0,1fr) 62px 108px 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
  .lines select,.lines input{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px}
  .lines .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lines .x{color:var(--faint);font-size:18px;width:28px;height:28px;border-radius:50%}
  .lines .x:hover{background:var(--pill);color:var(--danger)}
  .addline{font-size:13px;color:var(--accent-d);font-weight:700;margin-top:10px}
  .coupon-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-top:14px;font-size:13px;color:var(--accent-d)}
  .switch{position:relative;width:42px;height:24px;flex-shrink:0;display:inline-block}
  .switch input{opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;border-radius:999px;background:var(--faint);transition:.2s;cursor:pointer}
  .switch span::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked+span{background:var(--accent)}
  .switch input:checked+span::after{transform:translateX(18px)}
  .adj{display:grid;grid-template-columns:1fr 140px;gap:8px}
  .adj select,.adj input{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;width:100%}
  .sum{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
  .sum div{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:3px 0}
  .sum .grand{font-size:15px;color:var(--ink);font-weight:700;padding-top:8px;align-items:baseline}
  .sum .grand b{font-size:24px;color:var(--accent-d)}
  .morelist button{display:block;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line2);font-size:15px}

/* ================= 共通の小道具 ================= */
const pad=n=>String(n).padStart(2,'0');
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function today(){return ymd(new Date());}   /* 端末の日付（日本時間）で判定 */
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+Math.round(n));return ymd(d);}
function addYears(s,n){const d=new Date(s+'T00:00:00');d.setFullYear(d.getFullYear()+n);return ymd(d);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function dowJp(s){return ['日','月','火','水','木','金','土'][new Date(s+'T00:00:00').getDay()];}
function fmtYmd(s){if(!s)return '—';const [y,m,d]=String(s).slice(0,10).split('-');return `${y}/${m}/${d}`;}
function fmtMd(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}（${dowJp(s)}）`;}
function jpDate(s){const d=new Date(s+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${dowJp(s)}）`;}
function ageOf(bd){if(!bd)return null;const b=new Date(bd+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a;}
function yen(n){return n==null||isNaN(n)?'—':'¥'+Math.round(n).toLocaleString('ja-JP');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function pct(a,b){return b?(a-b)/b*100:null;}
function pctHtml(v){if(v==null)return '<span class="muted">—</span>';return `<span class="${v>=0?'up':'dn'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(1)}%</span>`;}
function byTime(a,b){return (a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99'));}

/* ================= データの書き込み =================
   データベースがまだ更新前（SQL⑥未実行）でも動くよう、無い列は外して保存し直す */
async function dbWrite(table,op,row,id){
  const r=Object.assign({},row);
  for(let i=0;i<15;i++){
    const q=sb.from(table);
    const res= op==='insert'? await q.insert(r).select().single() : await q.update(r).eq('id',id);
    if(!res.error) return res;
    const msg=res.error.message||'';
    const m=/Could not find the '([^']+)' column/.exec(msg)||/column "?([a-z_]+)"? of relation/.exec(msg);
    if(m&&(m[1] in r)){delete r[m[1]];continue;}
    return res;
  }
  return {error:{message:'保存できませんでした'}};
}
function needMigr6(){if(store.migr6)return false;toast('この機能はデータベースの更新（SQL⑥）後に使えます');return true;}

/* ================= 起動・ログイン ================= */
function saveCreds(email,pass){try{localStorage.setItem('owner_auto',btoa(unescape(encodeURIComponent(JSON.stringify({email,pass})))));}catch(e){}}
function getCreds(){try{const r=localStorage.getItem('owner_auto');if(!r)return null;return JSON.parse(decodeURIComponent(escape(atob(r))));}catch(e){return null;}}
function clearCreds(){localStorage.removeItem('owner_auto');}
async function boot(){

  sb.auth.onAuthStateChange((_e,s)=>{if(!s)show('auth');});
}
function show(id){['boot','config','auth'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
  document.getElementById('app').style.display=id==='app'?'block':'none';}
async function doAuth(){
  const email=document.getElementById('auEmail').value.trim(),pass=document.getElementById('auPass').value;
  const errEl=document.getElementById('auErr'),btn=document.getElementById('auBtn');errEl.textContent='';
  if(!email||!pass){errEl.textContent='メールとパスワードを入力してください';return;}

    const {error}=await sb.auth.signInWithPassword({email,password:pass});

    if(document.getElementById('auRemember').checked)saveCreds(email,pass);else clearCreds();
    await onAuthed();
  }catch(e){errEl.textContent=translateAuthErr(e.message);}
  finally{btn.disabled=false;btn.textContent='ログイン';}
}
function translateAuthErr(m){
  if(/Invalid login/i.test(m))return 'メールまたはパスワードが違います';
  if(/Email not confirmed/i.test(m))return 'メール確認が完了していません。受信メールのリンクを承認してください';
  if(/fetch/i.test(m))return '接続できませんでした。通信状態を確認してください';
  return m;
}

/* ================= データ読み込み ================= */
async function loadAll(){
  const [c,m,s,p,pr,rv,pd,pp,st]=await Promise.all([
    sb.from('customers').select('*').order('created_at',{ascending:true}),
    sb.from('measurements').select('*').order('date',{ascending:true}),
    sb.from('sessions').select('*').order('date',{ascending:false}),
    sb.from('payments').select('*').order('date',{ascending:false}),
    sb.from('proteins').select('*').order('purchase_date',{ascending:false}),
    sb.from('reservations').select('*').order('date',{ascending:true}),
    sb.from('products').select('*').order('created_at',{ascending:true}),
    sb.from('plan_prices').select('*').order('effective_date',{ascending:false}),
    sb.from('studio_settings').select('*').eq('id',1).maybeSingle(),
  ]);
  store.customers=c.data||[];store.measurements=m.data||[];store.sessions=s.data||[];
  store.payments=p.data||[];store.proteins=pr.data||[];store.reservations=rv.data||[];
  store.products=pd.data||[];store.planPrices=pp.data||[];
  store.migr6=!st.error;store.settings=st.data||null;
  await purgeExpired();
}
/* 退会から3年を過ぎた方は自動で削除（会計は名前つきで残る） */
async function purgeExpired(){
  if(!store.migr6)return;
  const lim=addYears(today(),-3);
  const exp=store.customers.filter(c=>c.withdrawn_at&&String(c.withdrawn_at).slice(0,10)<lim);
  for(const c of exp){const {error}=await sb.from('customers').delete().eq('id',c.id);if(!error)store.customers=store.customers.filter(x=>x.id!==c.id);}
  if(exp.length)toast(`保管期限（3年）を過ぎた退会者 ${exp.length}名 を削除しました`);
}
function applyStudio(){
  const n=studioName();
  ['sideName','mName'].forEach(i=>document.getElementById(i).textContent=n);
  document.getElementById('mDate').textContent=fmtMd(today());
  document.title=n+' — お店側';
  try{localStorage.setItem('studio_name',n);}catch(e){}
}
function S(){return store.settings||{};}
function studioName(){return S().studio_name||localStorage.getItem('studio_name')||'Pilates Studio';}

/* ================= データの見方 ================= */
const CATS=[['training','トレーニング'],['slimming','痩身'],['bust','バスト']];
const KINDS=[['training','トレーニング'],['slimming','痩身'],['bust','バスト'],['protein','プロテイン'],['beauty','美容']];
const CATLABEL={training:'トレーニング',slimming:'痩身',bust:'バスト',protein:'プロテイン',beauty:'美容',goods:'美容',other:'その他'};
const METHODS=[['cash','現金'],['card','クレジット'],['qr','QR決済'],['other','その他']];
const METRICS=[['weight','体重','kg'],['body_fat','体脂肪率','%'],['waist','ウエスト','cm'],['hip','ヒップ','cm'],['thigh','太もも','cm'],['arm','二の腕','cm']];
const PROTEIN_BAG_G=500,PROTEIN_SERVING_G=20;
function catLabel(k){return CATLABEL[k]||k||'—';}
function methodLabel(k){const m=METHODS.find(x=>x[0]===k);return m?m[1]:'—';}
function custById(id){return store.customers.find(c=>c.id===id)||null;}
function actives(){return store.customers.filter(c=>!c.withdrawn_at);}
function custCats(c){return CATS.filter(([k])=>c['cat_'+k]).map(([k])=>k);}
function custMeasures(cid){return store.measurements.filter(m=>m.customer_id===cid).sort((a,b)=>a.date.localeCompare(b.date));}
function custSessions(cid){return store.sessions.filter(s=>s.customer_id===cid).sort((a,b)=>b.date.localeCompare(a.date));}
function livePays(){return store.payments.filter(p=>!p.voided_at);}
function custPays(cid){return store.payments.filter(p=>p.customer_id===cid).sort((a,b)=>(b.date+(b.created_at||'')).localeCompare(a.date+(a.created_at||'')));}
function totalSpend(cid){return livePays().filter(p=>p.customer_id===cid).reduce((s,p)=>s+(+p.amount||0),0);}
function payName(p){const c=custById(p.customer_id);return c?c.name:(p.customer_name||'（削除済み）');}
function productById(id){return store.products.find(p=>p.id===id)||null;}
function productKind(p){return p&&p.kind==='protein'?'protein':'beauty';}
function productsOf(kind){return store.products.filter(p=>p.active!==false&&productKind(p)===kind);}
function planHistory(cid,cat){return store.planPrices.filter(p=>p.customer_id===cid&&p.category===cat)
  .sort((a,b)=>(b.effective_date+(b.created_at||'')).localeCompare(a.effective_date+(a.created_at||'')));}
function currentPlanPrice(c,cat){const h=planHistory(c.id,cat);return h.length?+h[0].price:(c['price_'+cat]!=null?+c['price_'+cat]:null);}
function payItems(p){try{return Array.isArray(p.items)?p.items:(p.items?JSON.parse(p.items):[]);}catch(e){return [];}}
/* 会計の明細（旧形式の会計も同じ形にそろえる） */
function payLinesOf(p){
  const it=payItems(p).map(i=>({kind:['training','slimming','bust','protein','beauty','other'].includes(i.kind)?i.kind:'beauty',
    name:i.name||'',price:+i.price||0,qty:+i.qty||1,product_id:i.product_id||null}));
  if(p.subtotal!=null)return it;
  const itemsSum=it.reduce((s,l)=>s+l.price*l.qty,0);
  let sub=+p.amount||0;const v=+p.discount_value||0;
  if(p.discount_type==='minus')sub+=v;else if(p.discount_type==='plus')sub-=v;
  else if(p.discount_type==='minus_pct'&&v<100)sub=sub/(1-v/100);else if(p.discount_type==='plus_pct')sub=sub/(1+v/100);
  const base=Math.round(sub-itemsSum);
  if(base>0){const k=p.category==='goods'?'beauty':(p.category||'other');it.unshift({kind:k,name:catLabel(k),price:base,qty:1});}
  return it;
}
/* 会計の金額を種別ごとに配分（割引は按分） */
function payBreakdown(p){
  const L=payLinesOf(p);const sum=L.reduce((s,l)=>s+l.price*l.qty,0);const out={};
  if(!sum){const k=(p.categories&&p.categories[0])||p.category||'other';out[k==='goods'?'beauty':k]=+p.amount||0;return out;}
  const f=(+p.amount||0)/sum;L.forEach(l=>{out[l.kind]=(out[l.kind]||0)+l.price*l.qty*f;});return out;
}
function payKinds(p){const b=payBreakdown(p);return KINDS.map(k=>k[0]).concat(['other']).filter(k=>b[k]);}
function payDiscount(p){
  if(p.subtotal!=null)return (+p.coupon_discount||0)+Math.max(0,-(+p.adjust_amount||0));
  const v=+p.discount_value||0;
  if(p.discount_type==='minus')return v;
  if(p.discount_type==='minus_pct'){const L=payLinesOf(p);return L.reduce((s,l)=>s+l.price*l.qty,0)*v/100;}
  return 0;
}
function sumAmt(ps){return ps.reduce((s,p)=>s+(+p.amount||0),0);}
function sumKinds(ps){const o={};ps.forEach(p=>{const b=payBreakdown(p);for(const k in b)o[k]=(o[k]||0)+b[k];});return o;}
function inRange(p,a,b){return p.date>=a&&p.date<=b;}
/* 今月の1日〜今日 と、先月の同じ期間 */
function monthToDate(){const t=today();return [t.slice(0,8)+'01',t];}
function prevMonthSame(){const d=new Date();const pm=new Date(d.getFullYear(),d.getMonth()-1,1);
  const last=new Date(d.getFullYear(),d.getMonth(),0).getDate();return [ymd(pm),ymd(new Date(pm.getFullYear(),pm.getMonth(),Math.min(d.getDate(),last)))];}

/* ---- 割引券（プロテインを◯個買うごとに◯円） ---- */
function couponCfg(){return {every:Math.max(1,+S().coupon_every||3),amount:+S().coupon_amount||1000};}
function couponState(cid){
  const {every,amount}=couponCfg();
  const ps=livePays().filter(p=>p.customer_id===cid);
  const qty=ps.reduce((s,p)=>s+payLinesOf(p).filter(l=>l.kind==='protein').reduce((a,l)=>a+l.qty,0),0);
  const used=ps.reduce((s,p)=>s+(+p.coupons_used||0),0);
  const earned=Math.floor(qty/every);
  return {qty,stamps:qty%every,every,amount,earned,used,avail:Math.max(0,earned-used)};
}
function stampsHtml(cs){return `<span class="stamps">${Array.from({length:cs.every},(_,i)=>`<i class="${i<cs.stamps?'on':''}">${i+1}</i>`).join('')}</span>`;}

/* ---- プロテインの次回購入時期 ---- */
function voidedIds(){return new Set(store.payments.filter(p=>p.voided_at).map(p=>p.id));}
function custProteins(cid){const v=voidedIds();return store.proteins.filter(p=>p.customer_id===cid&&!(p.payment_id&&v.has(p.payment_id)))
  .sort((a,b)=>b.purchase_date.localeCompare(a.purchase_date));}
function proteinCalc(p){
  if(!p)return null;
  const prod=p.product_id?productById(p.product_id):null;
  const vol=(+p.volume_g)||(prod&&+prod.volume_g)||PROTEIN_BAG_G;
  const serv=(+p.serving_g)||(prod&&+prod.serving_g)||PROTEIN_SERVING_G;
  const perDay=(+p.per_day)||1;
  const servings=Math.floor(vol/serv),days=servings/perDay;
  const runOut=addDays(p.purchase_date,days);
  return {servings,days:Math.round(days),runOut,left:daysBetween(today(),runOut),vol,serv};
}
function proteinSoon(){
  return actives().map(c=>{const l=custProteins(c.id)[0];const calc=l&&proteinCalc(l);return calc?{c,calc}:null;})
    .filter(Boolean).filter(r=>r.calc.left<=14).sort((a,b)=>a.calc.left-b.calc.left);
}

function buildCalendar(ym){
  const [y,m]=ym.split('-').map(Number),startDow=new Date(y,m-1,1).getDay(),daysIn=new Date(y,m,0).getDate();
  const cells=Math.ceil((startDow+daysIn)/7)*7,td=today(),bdMap={};

  let h='<div class="cal-grid">'+['日','月','火','水','木','金','土'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<cells;i++){
    const dn=i-startDow+1,inM=dn>=1&&dn<=daysIn,ds=inM?`${y}-${pad(m)}-${pad(dn)}`:'';
    const bds=inM?(bdMap[ds.slice(5)]||[]):[];
    const rvs=inM?store.reservations.filter(r=>r.date===ds&&r.status!=='cancelled').sort(byTime):[];

      ${rvs.length>3?`<span class="rv more">＋${rvs.length-3}件</span>`:''}</div>`;
  }
  return h+'</div>';
}

function payCust(){return pay.cid?custById(pay.cid):null;}
function payAddKind(k,silent){

  if(['training','slimming','bust'].includes(k)){

    pay.lines.push({kind:k,name:catLabel(k)+'（契約料金）',price:pr||0,qty:1,product_id:null});

function payToggleKind(k){

function payAddProduct(){
  const list=store.products.filter(p=>p.active!==false);

function payLineSet(i,f,v){
  const L=pay.lines[i];if(!L)return;
  if(f==='product'){const p=productById(v);if(p){L.product_id=p.id;L.name=p.name;L.price=+p.price||0;L.kind=productKind(p);}payRender();return;}
  if(f==='qty')L.qty=Math.max(1,parseInt(v)||1);

function payCalc(){
  const sub=pay.lines.reduce((s,l)=>s+(+l.price||0)*(+l.qty||1),0);
  const v=parseFloat(pay.adjVal)||0;let adj=0;
  if(pay.adjType==='minus')adj=-v;else if(pay.adjType==='minus_pct')adj=-Math.round(sub*v/100);else if(pay.adjType==='plus')adj=v;
  const cs=pay.cid?couponState(pay.cid):null;
  const cnt=pay.coupon&&cs&&cs.avail?Math.min(pay.couponCount,cs.avail):0;
  const coupon=cnt*couponCfg().amount;
  return {sub,adj,cnt,coupon,total:Math.max(0,Math.round(sub+adj-coupon))};
}

    <div class="modal-b">

          <div class="unit"><input type="number" inputmode="numeric" value="${l.price}" oninput="payLineSet(${i},'price',this.value)"><span class="u">円</span></div>
          <button class="x" title="削除" onclick="pay.lines.splice(${i},1);payRender()">×</button></li>`;}).join('')}</ul>`
        :'<div class="muted" style="font-size:13px">上の種別を選ぶと、契約料金や商品が入ります。</div>'}

function payRefreshPlanPrices(){const c=payCust();if(!c)return;pay.lines.forEach(l=>{if(['training','slimming','bust'].includes(l.kind)){const p=currentPlanPrice(c,l.kind);l.price=p||0;}});}
function paySum(){
  const el=document.getElementById('paySum');if(!el)return;const k=payCalc();
  el.innerHTML=`<div><span>小計</span><span>${yen(k.sub)}</span></div>
    ${k.coupon?`<div><span>割引券（${k.cnt}枚）</span><span>− ${yen(k.coupon)}</span></div>`:''}
    ${k.adj?`<div><span>${k.adj<0?'値引き':'追加'}</span><span>${k.adj<0?'−':'＋'} ${yen(Math.abs(k.adj))}</span></div>`:''}
    <div class="grand"><span>合計</span><b>${yen(k.total)}</b></div>`;
}
async function savePay(){
  const c=payCust();
  if(!c){toast('お客様を選んでください');return;}
  if(!pay.lines.length){toast('種別か商品を選んでください');return;}
  if(!pay.date){toast('会計日を入力してください');return;}

    items:pay.lines.map(l=>({kind:l.kind,name:l.name,price:+l.price||0,qty:+l.qty||1,product_id:l.product_id||null})),
    subtotal:k.sub,adjust_amount:k.adj,discount_type:pay.adjType||null,discount_value:pay.adjType?(parseFloat(pay.adjVal)||0):null,
    coupons_used:k.cnt,coupon_discount:k.coupon,method:pay.method,reservation_id:pay.rid,note:pay.note.trim()||null};
  const btn=document.getElementById('pbtn');btn.disabled=true;btn.textContent='保存中…';
  const res=await dbWrite('payments','insert',row);
  if(res.error){toast('エラー: '+res.error.message);btn.disabled=false;btn.textContent='会計を確定';return;}
  /* プロテインは購入時期の管理にも自動で記録 */
  const pid=res.data&&res.data.id;
  const lastPer=(custProteins(c.id)[0]||{}).per_day||1;
  for(const l of pay.lines.filter(l=>l.kind==='protein')){
    const p=l.product_id?productById(l.product_id):null;
    await dbWrite('proteins','insert',{customer_id:c.id,purchase_date:pay.date,product_id:l.product_id||null,
      volume_g:((p&&+p.volume_g)||PROTEIN_BAG_G)*(+l.qty||1),serving_g:(p&&+p.serving_g)||PROTEIN_SERVING_G,per_day:lastPer,payment_id:pid||null});
  }
  const before=couponState(c.id).avail;
  await loadAll();closeModal();
  const after=couponState(c.id);
  toast(after.avail>before-k.cnt?`会計を記録しました。割引券（${yen(after.amount)}）が発行されました`:'会計を記録しました');
  render();
}

let salesData=[];
function salesPeriods(){
  const mode=ui.salesMode,t=today();
  if(mode==='day'){const ym=ui.salesYm||t.slice(0,7);const [y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();
    return Array.from({length:n},(_,i)=>{const k=`${ym}-${pad(i+1)}`;return {key:k,label:String(i+1),sub:dowJp(k),title:fmtYmd(k)+'（'+dowJp(k)+'）',cur:k===t,future:k>t,match:p=>p.date===k};});}
  if(mode==='month'){const y=ui.salesY||+t.slice(0,4);
    return Array.from({length:12},(_,i)=>{const k=`${y}-${pad(i+1)}`;return {key:k,label:`${i+1}月`,title:`${y}/${pad(i+1)}`,cur:k===t.slice(0,7),future:k>t.slice(0,7),match:p=>(p.date||'').slice(0,7)===k};});}
  const y0=+t.slice(0,4);
  return Array.from({length:6},(_,i)=>{const y=y0-5+i,k=String(y);return {key:k,label:`${y}年`,title:`${y}年`,cur:i===5,match:p=>(p.date||'').slice(0,4)===k};});
}
function periodStats(ps){
  const kind=ui.salesKind;let amt=0,cnt=0,disc=0,cash=0,cashless=0;const cust=new Set();
  ps.forEach(p=>{let a=+p.amount||0;if(kind){const b=payBreakdown(p);if(!b[kind])return;a=b[kind];}
    amt+=a;cnt++;cust.add(p.customer_id||('x'+p.id));if(!kind)disc+=payDiscount(p);
    if(p.method==='cash')cash+=a;else if(p.method)cashless+=a;});
  return {amt,cnt,cust:cust.size,disc,cash,cashless};
}
function viewSales(){
  const t=today(),mode=ui.salesMode,lp=livePays();
  if(!ui.salesY)ui.salesY=+t.slice(0,4);if(!ui.salesYm)ui.salesYm=t.slice(0,7);

function salesShift(d){

  else ui.salesY+=d;
  render();
}
function salesDetail(key){

function salesCsv(){

  a.download=`売上集計_${mode==='day'?ui.salesYm:mode==='month'?ui.salesY:'年別'}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);

/* 目盛りが切りのいい数字（4等分）になる最大値 */
function niceMax(v){if(v<=0)return 1;const p=10**Math.floor(Math.log10(v)),n=v/p;return [1,2,4,6,8,12].find(m=>n<=m)*p;}
function fmtTick(v){return String(+v.toFixed(2));}
function drawSales(){
  const cv=document.getElementById('salesChart');if(!cv)return;
  const d=salesData,dpr=window.devicePixelRatio||1,W=cv.clientWidth||700,H=260;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,W,H);
  const twoLine=ui.salesMode==='day';
  const P={l:42,r:34,t:28,b:twoLine?40:28},cw=W-P.l-P.r,ch=H-P.t-P.b;
  const F='"Zen Kaku Gothic New",sans-serif';
  const maxV=niceMax(Math.max(...d.map(r=>r.amt),1)),maxC=Math.max(4,Math.ceil(Math.max(...d.map(r=>r.cust),1)/4)*4);
  x.font=`11px ${F}`;x.fillStyle='#a08a85';
  x.textAlign='left';x.fillText('売上（万円）',0,12);x.textAlign='right';x.fillText('客数（人）',W,12);
  for(let g=0;g<=4;g++){const yy=P.t+ch*(1-g/4);x.strokeStyle=g?'#f5edea':'#eee2de';x.beginPath();x.moveTo(P.l,yy);x.lineTo(W-P.r,yy);x.stroke();
    x.textAlign='right';x.fillText(fmtTick(maxV*g/4/10000),P.l-6,yy+4);
    x.textAlign='left';x.fillText(fmtTick(maxC*g/4),W-P.r+6,yy+4);}
  const n=d.length,gap=cw/n,bw=Math.max(3,Math.min(46,gap*.62));
  d.forEach((r,i)=>{const bx=P.l+gap*i+(gap-bw)/2,bh=ch*(r.amt/maxV),by=P.t+ch-bh,rad=Math.min(4,bw/2,bh);
    x.fillStyle=r.cur?'#e8a3a0':'#efdeda';x.beginPath();x.moveTo(bx,by+bh);x.lineTo(bx,by+rad);x.arcTo(bx,by,bx+rad,by,rad);x.lineTo(bx+bw-rad,by);x.arcTo(bx+bw,by,bx+bw,by+rad,rad);x.lineTo(bx+bw,by+bh);x.closePath();x.fill();
    const cx=P.l+gap*i+gap/2;x.textAlign='center';x.fillStyle=r.cur?'#4f3d3a':'#a08a85';x.font=`${r.cur?'700 ':''}${n>20?10:11}px ${F}`;
    if(!twoLine||n<=16||i%2===0||r.cur)x.fillText(r.label,cx,P.t+ch+15);
    if(twoLine){x.font=`9.5px ${F}`;x.fillStyle=r.sub==='日'?'#c27672':r.sub==='土'?'#8a9bbd':'#cdbcb7';if(n<=16||i%2===0||r.cur)x.fillText(r.sub,cx,P.t+ch+28);}});
  /* 客数の線（これから先の期間は描かない） */
  const pts=d.map((r,i)=>({r,cx:P.l+gap*i+gap/2,cy:P.t+ch*(1-r.cust/maxC)})).filter(p=>!p.r.future);
  x.strokeStyle='#6e5955';x.lineWidth=1.6;x.lineJoin='round';x.beginPath();
  pts.forEach((p,i)=>i?x.lineTo(p.cx,p.cy):x.moveTo(p.cx,p.cy));x.stroke();
  pts.forEach(p=>{x.beginPath();x.arc(p.cx,p.cy,n>20?2.2:3,0,7);x.fillStyle='#fff';x.fill();x.stroke();});
  const tip=document.getElementById('salesTip');
  cv.onmousemove=e=>{const rc=cv.getBoundingClientRect(),mx=e.clientX-rc.left,i=Math.floor((mx-P.l)/gap);
    if(i<0||i>=n){tip.style.opacity=0;return;}const r=d[i];
    tip.innerHTML=`${r.title}<br>売上 <b>${yen(r.amt)}</b>　客数 <b>${r.cust}</b>人`;
    tip.style.left=Math.min(Math.max(P.l+gap*i+gap/2,70),W-70)+'px';tip.style.top=(P.t+ch*(1-r.amt/maxV))+'px';tip.style.opacity=1;};
  cv.onmouseleave=()=>tip.style.opacity=0;
  cv.onclick=e=>{const rc=cv.getBoundingClientRect(),i=Math.floor((e.clientX-rc.left-P.l)/gap);if(d[i]&&d[i].cnt)salesDetail(d[i].key);};
}

/* ---- 計測グラフ ---- */
function drawChart(cid,metric){
  const cv=document.getElementById('chart');if(!cv)return;
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth||700,H=260;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const x=cv.getContext('2d');x.scale(dpr,dpr);
  const F='"Zen Kaku Gothic New",sans-serif',meta=METRICS.find(m=>m[0]===metric);
  const d=custMeasures(cid).filter(m=>m[metric]!=null).map(m=>({x:m.date,y:+m[metric]}));
  const P={l:44,r:20,t:26,b:30},cw=W-P.l-P.r,ch=H-P.t-P.b;
  x.font=`12px ${F}`;x.fillStyle='#a08a85';
  if(!d.length){x.textAlign='center';x.fillText('まだ記録がありません',W/2,H/2);return;}
  const ys=d.map(v=>v.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const pd=(mx-mn)*.18;mn-=pd;mx+=pd;
  const X=i=>d.length===1?P.l+cw/2:P.l+cw*i/(d.length-1),Y=v=>P.t+ch*(1-(v-mn)/(mx-mn));
  x.textAlign='left';x.fillText(`${meta[1]}（${meta[2]}）`,0,12);
  x.font=`11px ${F}`;
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,yy=Y(v);x.strokeStyle='#f5edea';x.beginPath();x.moveTo(P.l,yy);x.lineTo(W-P.r,yy);x.stroke();x.textAlign='right';x.fillStyle='#a08a85';x.fillText(v.toFixed(1),P.l-6,yy+4);}
  const gr=x.createLinearGradient(0,P.t,0,P.t+ch);gr.addColorStop(0,'rgba(232,163,160,.28)');gr.addColorStop(1,'rgba(232,163,160,0)');
  x.beginPath();x.moveTo(X(0),Y(d[0].y));d.forEach((v,i)=>x.lineTo(X(i),Y(v.y)));x.lineTo(X(d.length-1),P.t+ch);x.lineTo(X(0),P.t+ch);x.closePath();x.fillStyle=gr;x.fill();
  x.beginPath();x.strokeStyle='#d98e8a';x.lineWidth=2.2;x.lineJoin='round';d.forEach((v,i)=>i?x.lineTo(X(i),Y(v.y)):x.moveTo(X(i),Y(v.y)));x.stroke();
  const every=Math.ceil(d.length/14);
  d.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v.y),3.5,0,7);x.fillStyle='#fff';x.fill();x.lineWidth=2;x.strokeStyle='#d98e8a';x.stroke();
    if(i%every===0||i===d.length-1){x.textAlign='center';x.fillStyle='#4f3d3a';x.font=`700 11px ${F}`;x.fillText(v.y,X(i),Y(v.y)-10);
      x.fillStyle='#a08a85';x.font=`10px ${F}`;const dd=new Date(v.x+'T00:00:00');x.fillText(`${dd.getMonth()+1}/${dd.getDate()}`,X(i),P.t+ch+16);}});
}

async function delProduct(id){const p=productById(id);if(!confirm(`「${p.name}」を削除しますか？（過去の会計はそのまま残ります）`))return;
  const {error}=await sb.from('products').delete().eq('id',id);if(error){toast('エラー: '+error.message);return;}await loadAll();closeModal();render();toast('削除しました');}
function setCoupon(){const {every,amount}=couponCfg();
  const holders=actives().map(c=>({c,cs:couponState(c.id)})).filter(r=>r.cs.avail||r.cs.stamps);
  return `<section class="card"><div class="ch"><h2>プロテイン割引券のルール</h2></div>
    <div class="form" style="max-width:520px">
      <div class="fld"><label>プロテインを</label><div class="unit"><input id="cp_every" type="number" min="1" value="${every}"><span class="u">個ごと</span></div></div>
      <div class="fld"><label>割引券の金額</label><div class="unit"><input id="cp_amount" type="number" min="0" step="100" value="${amount}"><span class="u">円</span></div></div></div>
    <div class="note" style="margin-top:16px">会計でプロテインを登録すると、自動でスタンプがたまります。<b>${every}個</b>たまるごとに <b>${yen(amount)}</b> の割引券が1枚発行され、会計のときに使えます。使ったあとも、スタンプはそのままたまり続けます。会計を取り消すと、その分のスタンプと割引券も元に戻ります。</div>
    <div style="margin-top:18px"><button class="btn primary" onclick="saveCoupon()">保存する</button></div></section>
  <section class="card"><div class="ch"><h2>スタンプ・割引券の状況<span>${holders.length}名</span></h2></div>
    ${holders.length?`<div class="tw"><table class="tbl"><thead><tr><th>お客様</th><th>スタンプ</th><th class="r">使える割引券</th></tr></thead><tbody>
      ${holders.sort((a,b)=>b.cs.avail-a.cs.avail||b.cs.stamps-a.cs.stamps).map(({c,cs})=>`<tr class="click" onclick="openCustomer('${c.id}','protein')"><td class="b">${esc(c.name)}</td><td>${stampsHtml(cs)}</td><td class="r b">${cs.avail?cs.avail+'枚':'—'}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">まだスタンプのある方はいません</div>'}</section>`;}
async function saveCoupon(){
  if(needMigr6())return;
  const every=parseInt(document.getElementById('cp_every').value),amount=parseInt(document.getElementById('cp_amount').value);
  if(!(every>=1)||!(amount>=0)){toast('数字を入力してください');return;}
  const {error}=await dbWrite('studio_settings','update',{coupon_every:every,coupon_amount:amount,updated_at:new Date().toISOString()},1);
  if(error){toast('エラー: '+error.message);return;}await loadAll();render();toast('保存しました');
}
function setApp(){
  return `<section class="card"><div class="ch"><h2>お客様アプリのURL</h2></div>
    <div class="copyrow"><code>${CUSTOMER_APP_URL}</code><button class="btn sm" onclick="copyText('${CUSTOMER_APP_URL}')">コピー</button></div>
    <div class="sec">お客様へのご案内</div>
    <div class="note">① 顧客を登録するときに、<b>お客様のメールアドレス</b>を入力します<br>
      ② お客様に上のURLを開いてもらい、<b>同じメールアドレス</b>で新規登録してもらいます<br>
      ③ 自動でご本人のデータ（計測・レッスン・スタンプ）につながります<br>
      スマホでは、ブラウザの共有メニューから「ホーム画面に追加」すると、アプリのように使えます。</div></section>`;}
function copyText(s){(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('コピーしました')).catch(()=>prompt('コピーしてください',s));}
function setAccount(){
  return `<section class="card"><div class="ch"><h2>アカウント${isAdmin?'<span>管理者（開発元）</span>':''}</h2></div>
    <div class="meta" style="margin-top:0"><div><div class="l">ログイン中のメール</div><div class="d">${esc(meUser?.email||'')}</div></div>
      <div><div class="l">権限</div><div class="d">${isAdmin?'管理者（開発元）':'オーナー'}</div></div></div>
    <div class="actions" style="margin-top:18px"><button class="btn" onclick="openEmailForm()">メールアドレスを変更</button><button class="btn" onclick="openPasswordForm()">パスワードを変更</button><button class="btn" onclick="signOut()">ログアウト</button></div>
    <div class="note" style="margin-top:16px">${isAdmin?'この端末は<b>管理者（開発元）</b>としてログインしています。お店がメール・パスワードを変更しても、管理者のアクセスは維持されます。':'お店用のメール・パスワードに変更できます。変更してもデータはそのまま引き継がれます。'}</div>
    <div style="margin-top:14px"><a class="link" onclick="resetConn()">接続先（Supabase）を変更</a></div></section>`;}
function openEmailForm(){
  modal(`<div class="modal-h"><h3>メールアドレスを変更</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form"><div class="fld full"><label>新しいメールアドレス</label><input id="ac_email" type="email" placeholder="new@example.com"></div></div>
      <div class="note" style="margin-top:14px">新しいメール宛に<b>確認リンク</b>が届きます。リンクを承認すると変更が完了します。</div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" id="acEbtn" onclick="saveEmail()">確認メールを送る</button></div>`);
}
async function saveEmail(){
  const email=document.getElementById('ac_email').value.trim();
  if(!/.+@.+\..+/.test(email)){toast('正しいメールアドレスを入力してください');return;}
  const btn=document.getElementById('acEbtn');btn.disabled=true;
  const {error}=await sb.auth.updateUser({email});
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  closeModal();toast('確認メールを送信しました');
}
function openPasswordForm(){
  modal(`<div class="modal-h"><h3>パスワードを変更</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form"><div class="fld full"><label>新しいパスワード（6文字以上）</label><input id="ac_pw1" type="password"></div>
      <div class="fld full"><label>もう一度入力</label><input id="ac_pw2" type="password"></div></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" id="acPbtn" onclick="savePassword()">変更する</button></div>`);
}
async function savePassword(){
  const p1=document.getElementById('ac_pw1').value,p2=document.getElementById('ac_pw2').value;
  if(p1.length<6){toast('6文字以上にしてください');return;}if(p1!==p2){toast('確認用が一致しません');return;}
  const btn=document.getElementById('acPbtn');btn.disabled=true;
  const {error}=await sb.auth.updateUser({password:p1});
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  const c=getCreds();if(c)saveCreds(c.email,p1);
  closeModal();toast('パスワードを変更しました');
}
function resetConn(){if(!confirm('接続情報を消去して再設定しますか？'))return;localStorage.removeItem('sb_url');localStorage.removeItem('sb_key');location.reload();}

/* ================= モーダル ================= */
function modal(inner,cls){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${cls||''}">${inner}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(ui.view==='sales'&&!ui.cust)drawSales();if(ui.cust&&ui.custTab==='record')drawChart(ui.cust,ui.metric);},150);});
boot();
</script>
</body>
</html>
