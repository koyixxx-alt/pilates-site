function openEmailForm(){
  modal(`<div class="modal-h"><h3>メールアドレスを変更</h3><button class="x" aria-label="閉じる" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form"><div class="fld full"><label>新しいメールアドレス</label><input id="ac_email" type="email" placeholder="new@example.com"></div></div>
      <div class="note" style="margin-top:14px">新しいメール宛に<b>確認リンク</b>が届きます。リンクを承認すると変更が完了します。</div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" id="acEbtn" onclick="saveEmail()">確認メールを送る</button></div>`);
}
async function saveEmail(){
  const email=document.getElementById('ac_email').value.trim();
  if(!/.+@.+\..+/.test(email)){toast('正しいメールアドレスを入力してください');return;}
  const btn=document.getElementById('acEbtn');btn.disabled=true;
  const {error}=await sb.auth.updateUser({email});
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  closeModal();toast('確認メールを送信しました');
}
function openPasswordForm(){
  modal(`<div class="modal-h"><h3>パスワードを変更</h3><button class="x" aria-label="閉じる" onclick="closeModal()">×</button></div>
    <div class="modal-b"><div class="form"><div class="fld full"><label>新しいパスワード（6文字以上）</label><input id="ac_pw1" type="password"></div>
      <div class="fld full"><label>もう一度入力</label><input id="ac_pw2" type="password"></div></div></div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" id="acPbtn" onclick="savePassword()">変更する</button></div>`);
}
async function savePassword(){
  const p1=document.getElementById('ac_pw1').value,p2=document.getElementById('ac_pw2').value;
  if(p1.length<6){toast('6文字以上にしてください');return;}if(p1!==p2){toast('確認用が一致しません');return;}
  const btn=document.getElementById('acPbtn');btn.disabled=true;
  const {error}=await sb.auth.updateUser({password:p1});
  if(error){toast('エラー: '+error.message);btn.disabled=false;return;}
  const c=getCreds();if(c)saveCreds(c.email,p1);
  closeModal();toast('パスワードを変更しました');
}
async function resetConn(){if(!await ask('接続情報を消去して再設定しますか？'))return;localStorage.removeItem('sb_url');localStorage.removeItem('sb_key');location.reload();}

/* ================= モーダル ================= */
function modal(inner,cls){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${cls||''}" role="dialog" aria-modal="true">${inner}</div></div>`;
  setTimeout(()=>{const f=document.querySelector('#modalRoot input:not([type=hidden]):not([type=checkbox]),#modalRoot select,#modalRoot textarea');if(f&&matchMedia('(hover:hover)').matches)f.focus({preventScroll:true});},60);}
function closeModal(){if(window._forcePw)return;document.getElementById('modalRoot').innerHTML='';}

/* ---- 確認・入力のダイアログ（ブラウザ標準の小窓の代わり） ---- */
let _dlg=null;
function dlgClose(v){document.getElementById('dialogRoot').innerHTML='';if(_dlg){const r=_dlg;_dlg=null;r.done(v);}}
function dlgShell(title,inner,footer){
  document.getElementById('dialogRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)dlgClose(_dlg&&_dlg.cancel)">
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><div class="modal-h"><h3 id="dlgT">${esc(title)}</h3></div>${inner}<div class="modal-f">${footer}</div></div></div>`;
}
/* ask('タイトル\n本文') → true / false */
function ask(text,o){
  o=o||{};const lines=String(text).split('\n'),title=o.title||lines[0],body=o.title?String(text):lines.slice(1).join('\n');
  const danger=o.danger??/削除|取り消|オフ/.test(text);
  const ok=o.ok||(/削除/.test(text)?'削除する':/取り消/.test(text)?'取り消す':/オフ/.test(text)?'オフにする':'OK');
  return new Promise(done=>{_dlg={done,cancel:false};
    dlgShell(title,body?`<div class="modal-b"><div class="dlg-body">${esc(body)}</div></div>`:'',
      `<button class="btn" onclick="dlgClose(false)">${esc(o.cancel||'キャンセル')}</button><button class="btn ${danger?'danger-fill':'primary'}" id="dlgOk" onclick="dlgClose(true)">${esc(ok)}</button>`);
    setTimeout(()=>{const b=document.getElementById('dlgOk');if(b)b.focus();},40);});
}
/* askText({title,label,value}) → 入力した文字 / null（キャンセル） */
function askText(o){
  return new Promise(done=>{_dlg={done,cancel:null};
    dlgShell(o.title,`<div class="modal-b">${o.body?`<div class="dlg-body" style="margin-bottom:14px">${esc(o.body)}</div>`:''}
      <div class="fld"><label for="dlgIn">${esc(o.label||'')}</label><input id="dlgIn" type="${o.type||'text'}" ${o.type==='number'?'step="0.5" inputmode="decimal"':''} value="${esc(o.value||'')}" onkeydown="if(event.key==='Enter')dlgClose(this.value)"></div></div>`,
      `${o.noCancel?'':`<button class="btn" onclick="dlgClose(null)">キャンセル</button>`}<button class="btn ${o.danger?'danger-fill':'primary'}" onclick="dlgClose(${o.noCancel?'null':"document.getElementById('dlgIn').value"})">${esc(o.ok||'OK')}</button>`);
    setTimeout(()=>{const i=document.getElementById('dlgIn');if(i){i.focus();i.select();}},40);});
}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(_dlg){dlgClose(_dlg.cancel);return;}closeModal();});

/* ---- 数字をふわっと数え上げる（画面を開いたときだけ） ---- */
function cu(n,f){n=Math.round(+n||0);return `<span class="cu" data-n="${n}" data-f="${f||''}">${f==='yen'?yen(n):n.toLocaleString('ja-JP')}</span>`;}
function animateCounts(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('#view .cu').forEach(el=>{
    const n=+el.dataset.n,f=el.dataset.f;if(!n)return;const t0=performance.now(),d=760;
    const fin=f==='yen'?yen(n):n.toLocaleString('ja-JP');
    const step=t=>{const p=Math.max(0,Math.min(1,(t-t0)/d)),v=Math.round(n*(1-Math.pow(1-p,3)));el.textContent=p<1?(f==='yen'?yen(v):v.toLocaleString('ja-JP')):fin;if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
    setTimeout(()=>{el.textContent=fin;},d+120);   /* 画面が裏にあって動きが止まっても、最後は必ず正しい数字にする */
  });
}
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(ui.view==='sales'&&!ui.cust)drawSales();if(ui.cust&&ui.custTab==='record')drawChart(ui.cust,ui.metric);},150);});
boot();
/* パスワード欄の「表示／非表示」ボタン（あとから出る入力欄にも自動で付く） */
const EYE_ON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function pwEye(inp){
  inp.dataset.eye=1;const w=document.createElement('span');w.className='pwbox';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const b=document.createElement('button');b.type='button';b.className='pweye';b.innerHTML=EYE_ON;
  b.setAttribute('aria-label','パスワードを表示');b.setAttribute('aria-pressed','false');
  b.onclick=()=>{const on=inp.type==='password';inp.type=on?'text':'password';b.innerHTML=on?EYE_OFF:EYE_ON;
    b.setAttribute('aria-label',on?'パスワードを隠す':'パスワードを表示');b.setAttribute('aria-pressed',String(on));inp.focus();};
  w.appendChild(b);
}
function pwEyes(){document.querySelectorAll('input[type=password]:not([data-eye])').forEach(pwEye);}
/* 画面を離れたら必ず隠す */
function pwHideAll(){document.querySelectorAll('input[data-eye]').forEach(i=>{if(i.type==='text'){i.type='password';const b=i.nextElementSibling;if(b){b.innerHTML=EYE_ON;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','パスワードを表示');}}});}
new MutationObserver(pwEyes).observe(document.body,{childList:true,subtree:true});pwEyes();
document.addEventListener('visibilitychange',()=>{if(document.hidden)pwHideAll();});
</script>
